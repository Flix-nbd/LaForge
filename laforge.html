function scopeSession(scope){return scope==='template'?editing():db.draft;}
function classicRows(e){return e.blocks.filter(b=>b.kind==='series').flatMap(b=>(b.rows||[]).filter(r=>!r.warmup));}
function groupFor(s,e){return (s.groups||[]).find(g=>g.id===e.groupId)||null;}
function groupMembers(s,g){return s.exercises.filter(e=>e.groupId===g.id);}
function groupType(g){return g.type==='biset'?'Biset':'Superset';}
function cleanGroups(s){if(!s)return;s.groups=(s.groups||[]).filter(g=>groupMembers(s,g).length>=2);const ids=new Set(s.groups.map(g=>g.id));s.exercises.forEach(e=>{if(e.groupId&&!ids.has(e.groupId))e.groupId=null;});}
function groupStamp(s,g,index){return {id:g.id,name:g.name,type:g.type,round:index+1,members:groupMembers(s,g).filter(e=>classicRows(e)[index]).map(e=>e.name)};}
function applyLoggedGroup(s,g){groupMembers(s,g).forEach(e=>classicRows(e).forEach((r,i)=>{if(r.done){const stamp=groupStamp(s,g,i);if(stamp.members.length>=2)r.chain=stamp;}}));}
function groupOverview(s,scope){return (s.groups||[]).map(g=>{const members=groupMembers(s,g);if(members.length<2)return '';return `<div class="group-overview"><div class="row between"><div class="grow"><span class="pill">${groupType(g)}</span> <b>${esc(g.name)}</b></div>${btn('Modifier','group-edit',`data-scope="${scope}" data-id="${g.id}"`,'text-btn')}</div><p class="group-sequence">${members.map((e,i)=>`<span>${i+1}. ${esc(e.name)}</span>`).join('<span class="chain-arrow" aria-hidden="true">→</span>')}</p><p class="muted group-rest">${icon('clock')} Repos après ${esc(members.at(-1).name)}, une fois le tour validé.</p></div>`;}).join('');}
function groupBadge(s,e){const g=groupFor(s,e);if(!g)return '';const members=groupMembers(s,g);const i=members.indexOf(e),last=i===members.length-1;return `<div class="chain-cue"><span class="pill group-badge">${groupType(g)} · ${esc(g.name)} · ${i+1}/${members.length}</span><p>${last?'Repos après cet exercice, une fois le tour validé.':'Puis '+esc(members[i+1].name)+' · sans repos'}</p></div>`;}
function groupDialog(scope,id=null,ei=null){const s=scopeSession(scope);if(!s)return;if(s.exercises.length<2){toast('Ajoute au moins deux exercices pour créer un biset.');return;}const g=id?(s.groups||[]).find(g=>g.id===id):null;const selected=g?groupMembers(s,g).map(e=>e.id):ei!==null?[s.exercises[ei]?.id]:[];const logged=scope==='draft'&&s.exercises.some(e=>classicRows(e).some(r=>r.done));
 modal(g?'Modifier l’enchaînement':'Créer un biset / superset',`<form data-form="group" data-scope="${scope}" data-id="${g?.id||''}"><label class="label" for="group-type">Type d’enchaînement</label><select id="group-type" name="type"><option value="biset" ${g?.type!=='superset'?'selected':''}>Biset · 2 exercices</option><option value="superset" ${g?.type==='superset'?'selected':''}>Superset · 2 exercices ou plus</option></select><label class="label" for="group-name">Nom (facultatif)</label><input id="group-name" name="name" maxlength="80" value="${esc(g?.name||'')}" placeholder="Ex. Bras, Biset 1…"><div class="label">Exercices à enchaîner, dans l’ordre de la séance</div><div class="group-options">${s.exercises.map((e,i)=>{const other=groupFor(s,e);return `<label class="group-option"><input type="checkbox" name="members" value="${e.id}" ${selected.includes(e.id)?'checked':''}><span><b>${i+1}. ${esc(e.name)}</b>${other&&other.id!==g?.id?`<small>Actuellement : ${esc(other.name)}</small>`:''}</span></label>`;}).join('')}</div><p class="notice">Le repos démarre après le dernier exercice du tour, quand les séries précédentes sont validées. Les blocs EMOM gardent leur propre chrono.</p>${logged?`<label class="group-option logged-option"><input type="checkbox" name="applyLogged" ${g?'':'checked'}><span>Appliquer aussi aux séries déjà validées<small>Sinon, leurs anciennes indications sont conservées.</small></span></label>`:''}<button class="btn full" style="margin-top:18px">${g?'Enregistrer':'Associer les exercices'}</button></form>${g?btn('Dissocier les exercices','group-delete',`data-scope="${scope}" data-id="${g.id}"`,'text-btn danger-text'):''}`);
}
function handleGroupSubmit(f,v,x){const s=scopeSession(x.scope);if(!s)return false;const ids=new FormData(f).getAll('members');if(ids.length<2||(v.type==='biset'&&ids.length!==2)){toast(v.type==='biset'?'Choisis exactement deux exercices pour un biset.':'Choisis au moins deux exercices.');return false;}const old=(s.groups||[]).find(g=>g.id===x.id),g={id:old?.id||uid(),type:v.type,name:v.name.trim()||`${v.type==='biset'?'Biset':'Superset'} ${(s.groups||[]).length+1}`};
 return change(()=>{s.groups=s.groups||[];s.exercises.forEach(e=>{if(e.groupId===g.id)e.groupId=null;if(ids.includes(e.id))e.groupId=g.id;});if(old)Object.assign(old,g);else s.groups.push(g);cleanGroups(s);if(x.scope==='draft'){s.restUntil=null;s.restContext=null;}if(x.scope==='draft'&&v.applyLogged!==undefined)applyLoggedGroup(s,g);});
}
function afterSeriesValidation(ex,bl,r){const d=db.draft;if(!d||!r.done||bl.kind==='emom')return '';const g=r.warmup?null:groupFor(d,ex);if(!g){startAutoRest(ex);return '';}
 const index=classicRows(ex).indexOf(r),members=groupMembers(d,g).filter(e=>classicRows(e)[index]);if(members.length<2){startAutoRest(ex);return 'Série supplémentaire hors enchaînement.';}r.chain=groupStamp(d,g,index);members.forEach(e=>{const row=classicRows(e)[index];if(!row.id)row.id=uid();});const last=members.at(-1),complete=members.every(e=>classicRows(e)[index].done);const key=g.id+':'+members.map(e=>classicRows(e)[index].id).join(':');d.restedRounds=d.restedRounds||[];
 if(d.restedRounds.includes(key))return 'Série mise à jour.';
 if(ex===last&&complete){d.restedRounds.push(key);const started=startAutoRest(ex,g);return started?'Tour terminé · repos lancé.':'Tour terminé.';}
 d.restUntil=null;d.restContext=null;const next=members.find(e=>!classicRows(e)[index].done);return next?`Enchaîne : ${next.name}.`:'Tour complet. Tu peux lancer le repos avec le bouton chrono.';
}
function emomDuration(b){return Number.isInteger(b.minutes)&&b.minutes>=1?b.minutes:b.rows.length;}
function emomElapsed(b,now=Date.now()){const t=b.timer;return t?Math.min(emomDuration(b)*60000,Math.max(0,t.elapsed+(t.running?now-t.started:0))):0;}
function settleEmom(b){if(b.kind!=='emom'||!b.timer)return;const cap=emomDuration(b)*60000,raw=b.timer.elapsed+(b.timer.running?Date.now()-b.timer.started:0);if(raw>=cap)b.timer={elapsed:cap,started:Date.now(),running:false};}
function recordedRow(r,mode){return r.done||r.reps!==null||r.rpe!==null||(r.weight!==null&&!(mode==='pdc'&&r.weight===0));}
function syncBlockLabels(){const kind=$('#block-kind')?.value;if(!kind)return;$('#block-count-label').textContent=kind==='emom'?'Durée totale (minutes)':'Nombre de séries';$('#block-target-label').textContent=kind==='emom'?'Objectif reps / minute':'Objectif reps / série';$('#block-help').textContent=kind==='emom'?'Une ligne par minute. Modifier l’objectif ne change pas les reps déjà notées. Le chrono garde le temps écoulé.':'Les séries déjà notées sont conservées. Tu peux aussi ajouter ou retirer des séries directement dans la séance.';$('#block-target').required=kind==='emom';$('#block-target').min=kind==='emom'?'1':'0';}
function blockDialog(scope,ei,bi=null){const e=scopeSession(scope)?.exercises[ei];if(!e)return;const b=bi===null?null:e.blocks[bi];modal(b?'Modifier le bloc':'Ajouter un bloc',`<form data-form="block" data-scope="${scope}" data-ex="${ei}" data-block="${bi??''}"><label class="label" for="block-kind">Format</label><select id="block-kind" name="kind" data-input="block-kind"><option value="series" ${b?.kind!=='emom'?'selected':''}>Séries · classique, pyramide ou libre</option><option value="emom" ${b?.kind==='emom'?'selected':''}>EMOM · une série par minute</option></select><label class="label" for="block-label">Nom du bloc</label><input id="block-label" name="label" maxlength="80" placeholder="Pyramide, Lesté, 4 × 6…" value="${esc(b?.label||'')}"><div class="form-grid"><div><label class="label" id="block-count-label" for="block-count">Nombre de séries</label><input id="block-count" name="count" type="number" min="1" max="120" value="${scope==='draft'&&b?(b.kind==='emom'?emomDuration(b):b.rows.length):b?.count||3}" required></div><div><label class="label" id="block-target-label" for="block-target">Objectif reps</label><input id="block-target" name="target" type="number" min="0" max="999" value="${b?.target||''}" placeholder="Facultatif"></div></div><p class="muted" id="block-help" style="font-size:12px;margin-top:13px"></p><button class="btn full" style="margin-top:20px">${b?'Enregistrer':'Ajouter le bloc'}</button></form>`);syncBlockLabels();}
function handleBlockSubmit(v,x){const ex=targetExercises(x.scope)?.[Number(x.ex)];if(!ex)return false;const old=x.block!==''?ex.blocks[Number(x.block)]:null,count=Number(v.count),target=Number(v.target)||0;if(!Number.isInteger(count)||count<1||count>120||target<0||target>999||(v.kind==='emom'&&target<1)){toast('Vérifie la durée et l’objectif de reps.');return false;}
 if(x.scope==='draft'&&old&&count<old.rows.length&&old.rows.slice(count).some(r=>recordedRow(r,ex.mode))){toast('Des lignes à retirer sont déjà renseignées. Supprime-les dans la séance avant de réduire la durée ou le nombre de séries.');return false;}
 return change(()=>{const label=v.label.trim()||(v.kind==='emom'?'EMOM':'Séries libres');if(x.scope==='template'){const b={id:old?.id||uid(),kind:v.kind,label,count,target};if(old)ex.blocks[Number(x.block)]=b;else ex.blocks.push(b);return;}
 if(old){settleEmom(old);if(old.kind!==v.kind)old.timer=null;old.kind=v.kind;old.label=label;old.target=target;old.minutes=v.kind==='emom'?count:null;while(old.rows.length<count)old.rows.push(freshRow(ex.mode==='pdc'?0:null));old.rows=old.rows.slice(0,count);settleEmom(old);}else ex.blocks.push(instantiate({name:ex.name,mode:ex.mode,blocks:[{id:uid(),kind:v.kind,label,count,target}]}).blocks[0]);});
}
function historyChainSummary(h){const groups=new Map();for(const e of h.exercises||[])for(const b of e.blocks)for(const r of b.rows){if(r.chain){const key=r.chain.id+'|'+r.chain.members.join('|');if(!groups.has(key))groups.set(key,r.chain);}}return [...groups.values()].map(g=>`<div class="history-chain"><span class="pill">${groupType(g)}</span><b>${esc(g.name)}</b><p>${g.members.map(esc).join(' → ')}</p></div>`).join('');}

function previousExercise(e){return db.history.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||'')).flatMap(h=>(h.exercises||[]).filter(x=>norm(x.name)===norm(e.name)&&x.mode===e.mode).map(x=>({exercise:x,date:h.date}))).at(0);}
function prefillExercise(e){if(db.settings.prefill===false)return e;const prev=previousExercise(e)?.exercise;if(!prev)return e;const used=new Set();e.blocks.forEach(b=>{const pb=prev.blocks.find((x,i)=>!used.has(i)&&x.kind===b.kind&&x.label===b.label)||prev.blocks.find((x,i)=>!used.has(i)&&x.kind===b.kind);if(!pb)return;used.add(prev.blocks.indexOf(pb));b.rows.forEach((r,i)=>{const old=pb.rows.find(x=>(x.position||pb.rows.indexOf(x)+1)===i+1);if(old?.done){r.weight=old.weight;r.previousReps=old.reps;r.reps=null;r.warmup=!!old.warmup;r.prefilled=true;}});});return e;}
function exerciseNotebook(s,e,scope,i){const previous=previousExercise(e);return `<div class="notebook-tools">${btn(icon('clock')+' '+restLabel(s,e),'rest-config',`data-scope="${scope}" data-id="${e.id}"`,'text-btn')}<details ${e.notes?'open':''}><summary>Note de l’exercice${e.notes?' •':''}</summary><textarea aria-label="Note ${esc(e.name)}" data-input="exercise-notes" data-scope="${scope}" data-ex="${i}" placeholder="Réglage machine, prise, sensations, adaptation…">${esc(e.notes||'')}</textarea>${previous?.exercise.notes?`<p class="previous-note"><b>Note précédente :</b> ${esc(previous.exercise.notes)}</p>`:''}</details></div>`;}
function restMemoryKey(s,obj,kind){return JSON.stringify(kind==='group'?['group',groupMembers(s,obj).map(e=>[norm(e.name),e.mode])]:['exercise',norm(obj.name),obj.mode]);}
function rememberedRest(s,obj,kind){if(!obj)return null;const saved=(db.settings.restPreferences||[]).find(p=>p.key===restMemoryKey(s,obj,kind));return saved?saved.rest:obj.rest;}
function rememberRest(s,obj,kind){if(s===db.draft)return;const key=restMemoryKey(s,obj,kind);db.settings.restPreferences??=[];const entry=db.settings.restPreferences.find(p=>p.key===key);const value={key,rest:obj.rest?clone(obj.rest):null};if(entry)Object.assign(entry,value);else db.settings.restPreferences.push(value);}
function restRule(s,e,g=null){const rule=rememberedRest(s,g,'group')||rememberedRest(s,e,'exercise');return rule||{enabled:true,seconds:db.settings.rest};}
function restLabel(s,e){const g=groupFor(s,e),rule=restRule(s,g?groupMembers(s,g).at(-1):e,g);return `${g?'Repos '+groupType(g).toLowerCase():'Repos'} : ${db.settings.autoRest===false?'auto désactivé':!rule.enabled||!rule.seconds?'désactivé':timeFmt(rule.seconds)}`;}
function startAutoRest(e,g=null){const d=db.draft,rule=restRule(d,e,g);d.restUntil=null;d.restContext=null;if(db.settings.autoRest===false||!rule.enabled||!rule.seconds)return false;d.restContext={kind:g?'group':'exercise',id:g?.id||e.id,startedAt:Date.now()};d.restUntil=d.restContext.startedAt+rule.seconds*1000;return true;}
function refreshRest(){const d=db.draft,c=d?.restContext;if(!c||c.kind==='manual')return;const g=c.kind==='group'?(d.groups||[]).find(g=>g.id===c.id):null,e=g?groupMembers(d,g).at(-1):d.exercises.find(e=>e.id===c.id);if(!e){d.restUntil=null;d.restContext=null;return;}const rule=restRule(d,e,g);d.restUntil=db.settings.autoRest!==false&&rule.enabled&&rule.seconds?c.startedAt+rule.seconds*1000:null;if(!d.restUntil)d.restContext=null;}
function restDialog(scope,id,forceKind=null){const s=scopeSession(scope);if(!s)return;const e=s.exercises.find(e=>e.id===id),g=forceKind==='group'?(s.groups||[]).find(g=>g.id===id):e&&forceKind!=='exercise'?groupFor(s,e):null,obj=g||e;if(!obj)return;const rule=rememberedRest(s,obj,g?'group':'exercise');modal('Repos · '+obj.name,`<form data-form="rest-config" data-scope="${scope}" data-id="${obj.id}" data-kind="${g?'group':'exercise'}"><label class="label" for="rest-mode">Déclenchement automatique</label><select id="rest-mode" name="mode"><option value="inherit" ${!rule?'selected':''}>${g?'Suivre le dernier exercice':'Suivre le réglage général'}</option><option value="custom" ${rule?.enabled?'selected':''}>Activer un repos personnalisé</option><option value="off" ${rule&&!rule.enabled?'selected':''}>Désactiver pour cet ${g?'enchaînement':'exercice'}</option></select><label class="label" for="custom-rest">Durée personnalisée (secondes)</label><input id="custom-rest" type="number" name="seconds" min="1" max="1800" step="1" required value="${rule?.seconds||db.settings.rest||120}"><p class="muted" style="margin-top:12px">${g?'Le repos démarre après le dernier exercice du tour. ':''}${scope==='draft'?'Ce réglage concerne uniquement la séance en cours.':'Ce réglage sera repris aux prochaines séances.'} Si le chrono tourne, la durée est ajustée depuis son départ.${db.settings.autoRest===false?' Le repos automatique général est actuellement désactivé.':''}</p><button class="btn full" style="margin-top:18px">Enregistrer</button></form>`);}

function historyEditView(){const h=db.historyEdit?.snapshot;if(h?.champion)return champHistoryEdit(h);if(!h)return emptyState('Aucune correction en cours.',btn('Historique','nav','data-page="history"'));return `<div class="page-head"><div class="eyebrow">Corriger une séance passée</div><h1>${esc(h.title)}</h1><p class="muted">Correction conservée sur cet appareil. Les performances changent uniquement à l’enregistrement.</p></div><form id="history-edit-form" data-form="history-save"><div class="card"><label class="label">Nom<input data-input="history-field" data-field="title" required maxlength="100" value="${esc(h.title)}"></label><div class="form-grid"><label class="label">Date<input data-input="history-field" data-field="date" type="date" required value="${esc(h.date)}"></label><label class="label">Durée (min)<input data-input="history-field" data-field="duration" type="number" min="0" step="0.1" value="${h.duration??''}"></label></div></div><div class="stack" style="margin-top:16px">${h.exercises.map((e,ei)=>`<section class="card"><label class="label">Exercice<input required maxlength="100" data-input="history-exercise" data-ex="${ei}" data-field="name" value="${esc(e.name)}"></label><p class="muted">${e.mode==='pdc'?'PDC · lest ajouté':'Poids total'} · É = échauffement</p><label class="label">Note de l’exercice<textarea data-input="history-exercise" data-ex="${ei}" data-field="notes">${esc(e.notes||'')}</textarea></label>${e.blocks.map((b,bi)=>`<div class="block"><h3>${esc(b.label)}${b.kind==='emom'?' · EMOM':''}</h3><div class="set-grid labels"><span>Type</span><span>${e.mode==='pdc'?'Lest kg':'Poids kg'}</span><span>Reps</span><span>RPE</span><span></span><span></span></div>${b.rows.map((r,ri)=>`<div class="set-grid ${r.warmup?'warmup':''}">${btn(r.warmup?'É':String(r.position||ri+1),'history-warmup',`data-ex="${ei}" data-block="${bi}" data-row="${ri}" aria-label="${r.warmup?'Passer en série de travail':'Marquer comme échauffement'}" aria-pressed="${!!r.warmup}"`,'index type-toggle')}${['weight','reps','rpe'].map(f=>`<input type="number" ${f!=='rpe'?'required':''} min="${f==='rpe'?1:0}" ${f==='rpe'?'max="10"':''} step="${f==='reps'?1:0.5}" value="${r[f]??''}" aria-label="${f==='weight'?'Charge':f==='reps'?'Répétitions':'RPE'} série ${ri+1}" data-input="history-row" data-ex="${ei}" data-block="${bi}" data-row="${ri}" data-field="${f}">`).join('')}<span></span>${btn(icon('close'),'history-row-delete',`data-ex="${ei}" data-block="${bi}" data-row="${ri}" aria-label="Retirer la série"`,'remove')}</div>`).join('')}${btn('+ Ajouter une série','history-row-add',`data-ex="${ei}" data-block="${bi}"`,'text-btn')}</div>`).join('')}</section>`).join('')}</div><label class="label">Notes de séance<textarea data-input="history-field" data-field="notes">${esc(h.notes||'')}</textarea></label><div class="foot-actions"><button class="btn full">Enregistrer les corrections</button></div></form>${btn('Annuler les corrections','history-discard','','text-btn danger-text')}`;}
function saveHistoryEdit(){const edit=db.historyEdit,old=db.history.find(h=>h.id===edit?.id);if(!old||JSON.stringify(old)!==edit.original){toast('La séance originale a changé. Annule cette correction puis rouvre-la.');return false;}const h=clone(edit.snapshot);h.title=h.title.trim();h.exercises.forEach(e=>{e.name=e.name.trim();e.blocks=e.blocks.filter(b=>b.rows.length);});h.exercises=h.exercises.filter(e=>e.blocks.length||(e.notes||'').trim());if(!h.title||!h.exercises.length||h.exercises.some(e=>!e.name||e.blocks.some(b=>b.rows.some(r=>r.weight===null||r.reps===null)))){toast('Complète les valeurs ou retire les lignes incomplètes.');return false;}h.exercises.forEach(e=>e.blocks.forEach(b=>b.rows.forEach(r=>r.done=true)));cleanGroups(h);h.updatedAt=new Date().toISOString();const candidate=clone(db);candidate.history[candidate.history.findIndex(x=>x.id===h.id)]=h;candidate.historyEdit=null;try{validate(candidate);}catch(e){toast('Vérifie les valeurs de la séance.');return false;}const ok=change(()=>{removeLegacyFor(old);db.history[db.history.indexOf(old)]=h;db.historyEdit=null;},false);if(ok){goto('history');toast('Séance corrigée · performances mises à jour.');}return ok;}

function freshRow(weight=null){return {id:uid(),weight,reps:null,rpe:null,done:false};}

function startWorkout(sid=null,pid=null){if(db.draft){startPicker();return;}const s=sid?session(sid):null;if(sid&&!s){toast('Cette séance n’existe plus. Modifie le planning.');return;}const draft={id:uid(),kind:'workout',title:s?.name||'Séance libre',sessionId:sid,programId:sid?db.programs.find(p=>p.sessions.some(s=>s.id===sid))?.id||null:null,planId:pid,date:dayKey(),startedAt:new Date().toISOString(),notes:'',groups:clone(s?.groups||[]),exercises:(s?.exercises||[]).map(instantiate),restUntil:null,restedRounds:[]};if(s?.champion)champPrepare(draft,s);if(change(()=>db.draft=draft,false)){closeModal();goto('workout');}}
function measurements(){const out=[];for(const h of db.history){for(const e of h.exercises||[]){const rows=e.blocks.flatMap(b=>b.rows.filter(r=>r.done&&!r.warmup));if(rows.length)out.push({date:h.date,name:e.name,mode:e.mode,rows,blocks:e.blocks});}}
 for(const m of db.legacyMeasurements){if(!db.history.some(h=>h.date===m.date&&(h.exercises||[]).some(e=>norm(e.name)===norm(m.name)))){out.push({date:m.date,name:m.name,mode:/traction|dips|pompe/i.test(m.name)?'pdc':'weight',rows:m.blocks.flatMap(b=>b.rows.filter(r=>r.done&&!r.warmup)),blocks:m.blocks});}}

function liveInputsValid(){const invalid=$('#app input[data-input="set"]:invalid, #app input[data-ch-field]:invalid');if(invalid){invalid.focus();invalid.reportValidity();toast('Corrige la valeur signalée avant de terminer la séance.');return false;}return true;}
function finishWorkout(){if(!liveInputsValid())return;const d=db.draft;if(!d)return;const completed=d.exercises.flatMap(e=>e.blocks.flatMap(b=>b.rows)).filter(r=>r.done);if(!completed.length){toast('Valide au moins une série pour enregistrer la séance.');return;}const pending=d.exercises.flatMap(e=>e.blocks.flatMap(b=>b.rows)).filter(r=>!r.done).length;
 modal('Terminer la séance',`<div class="notice">${completed.length} séries / minutes validées seront conservées.${pending?` Les ${pending} lignes non validées seront exclues. Les notes des exercices seront conservées.`:''}</div><p style="margin-top:15px;font-size:14px">Ton programme garde les séries prévues. L’historique gardera exactement celles réalisées aujourd’hui.</p>${btn('Enregistrer ma séance','finish-confirm','','btn full')}`);}
function findFocusEmom(){for(const [ei,e] of (db.draft?.exercises||[]).entries()){const bi=e.blocks.findIndex(b=>b.id===focusEmomId&&b.kind==='emom');if(bi>=0)return {e,b:e.blocks[bi],ei,bi};}return null;}
function emomFocusView({e,b,ei,bi}){return `<section class="emom-focus"><div>${btn(icon('back')+' Retour à la séance','emom-focus-close','','text-btn')}<div class="eyebrow" style="margin-top:30px">FOCUS EMOM</div><h1>${esc(e.name)}</h1><p class="muted">${esc(b.label)}</p></div><div class="focus-clock"><p id="focus-round"></p><strong id="focus-time" aria-label="Temps restant dans la minute">01:00</strong><p id="focus-state"></p><progress id="focus-progress" max="${emomDuration(b)*60}" value="0" aria-label="Progression EMOM"></progress><h2>${b.target?b.target+' reps par minute':'Répétitions libres'}</h2></div><div><div class="foot-actions">${btn('Démarrer','emom-toggle',`data-ex="${ei}" data-block="${bi}"`,'btn full')}</div>${btn('Modifier reps / durée','block-edit',`data-scope="draft" data-ex="${ei}" data-block="${bi}"`,'text-btn')}${btn('Réinitialiser','emom-reset',`data-ex="${ei}" data-block="${bi}"`,'text-btn')}<p class="muted" style="font-size:12px">Reviens à la séance pour noter et valider tes répétitions. Le chrono continue.</p></div></section>`;}
function tickEmomFocus(){const f=findFocusEmom(),el=$('#focus-time');if(!f||!el)return;const {b,ei,bi}=f,seconds=Math.floor(emomElapsed(b)/1000),total=emomDuration(b)*60,done=seconds>=total;el.textContent=done?'00:00':timeFmt(60-seconds%60);$('#focus-round').textContent=done?`${emomDuration(b)} minutes terminées`:`Minute ${Math.floor(seconds/60)+1} / ${emomDuration(b)}`;$('#focus-state').textContent=done?'EMOM terminé':!b.timer?'Prêt à démarrer':b.timer.running?'En cours':'En pause';$('#focus-progress').value=seconds;el.classList.toggle('final-seconds',!done&&!!b.timer?.running&&60-seconds%60<=3);const button=$(`[data-action="emom-toggle"][data-ex="${ei}"][data-block="${bi}"]`);if(button)button.textContent=done?'Recommencer':!b.timer?'Démarrer':b.timer.running?'Pause':'Reprendre';}
function workoutSummary(h){if(h.champion)return champSummary(h);let series=0,emom=0,warmup=0;for(const e of h.exercises)for(const b of e.blocks)for(const r of b.rows){if(!r.done)continue;if(r.warmup)warmup++;else if(b.kind==='emom')emom++;else series++;}return {series,emom,warmup,exercises:h.exercises.filter(e=>e.blocks.some(b=>b.rows.some(r=>r.done))).length};}
function showWorkoutSummary(h,records=[]){const n=workoutSummary(h);modal('Séance enregistrée',`<div class="workout-summary"><span class="pill">Bien joué !</span>${records.length?`<div class="pr-celebration"><b>★ ${records.length} nouveau${records.length>1?'x PR':' PR'}</b>${records.map(r=>`<p><strong>${esc(r.name)} · ${r.value}</strong><br>${esc(r.label)} · précédent : ${r.old}</p>`).join('')}</div>`:''}<h2>${esc(h.title)}</h2><p class="muted">${esc(dateLabel(h.date))}</p>${champTotalsView(h)}<div class="summary-grid">${[[h.duration+' min','Durée totale'],[n.exercises,'Exercices réalisés'],[n.series,'Séries de travail'],[n.emom,'Minutes EMOM validées']].map(([value,label])=>`<div><strong>${value}</strong><span>${label}</span></div>`).join('')}</div>${n.warmup?`<p class="muted">${n.warmup} série(s) d’échauffement, comptées séparément.</p>`:''}${h.notes?`<div class="summary-note"><h3>Ta note de séance</h3><p>${esc(h.notes)}</p></div>`:''}${btn('Voir mon historique','summary-close','','btn full')}</div>`);}
function finishConfirm(){if(!liveInputsValid())return;const d=db.draft;if(!d)return;const h=clone(d);h.endedAt=new Date().toISOString();h.duration=Math.max(1,Math.round((Date.now()-Date.parse(h.startedAt))/60000));h.exercises=h.exercises.map(e=>({...e,blocks:e.blocks.map(b=>({...b,timer:null,rows:b.rows.map((r,i)=>({...r,position:i+1})).filter(r=>r.done)})).filter(b=>b.rows.length)})).filter(e=>e.blocks.length||(e.notes||'').trim());cleanGroups(h);delete h.restUntil;delete h.restedRounds;delete h.restContext;
 const records=newWorkoutPRs(h);
 if(change(()=>{db.history.push(h);db.draft=null;},false)){focusEmomId=null;closeModal();goto('history');showWorkoutSummary(h,records);}}
function planDialog(date,id=null){const p=id?db.plan.find(p=>p.id===id):null,ss=sessions();modal(p?'Modifier le planning':'Planifier un entraînement',`<form data-form="plan" data-id="${id||''}"><label class="label" for="plan-date">Jour</label><input id="plan-date" name="date" type="date" value="${p?.date||date}" required><label class="label" for="plan-kind">Activité</label><select id="plan-kind" name="kind" data-input="plan-kind"><option value="workout" ${!p||p.kind==='workout'?'selected':''}>Musculation / PDC</option><option value="wod" ${p?.kind==='wod'?'selected':''}>WOD</option><option value="run" ${p?.kind==='run'?'selected':''}>Course à pied</option></select><div id="plan-session-wrap" ${p&&p.kind!=='workout'?'hidden':''}><label class="label" for="plan-session">Séance</label><select id="plan-session" name="sessionId"><option value="">Séance libre</option>${ss.map(s=>`<option value="${s.id}" ${p?.sessionId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><label class="label" for="plan-title">Nom (facultatif)</label><input id="plan-title" name="title" value="${esc(p?.title||'')}" maxlength="100" placeholder="Ex. footing facile, WOD du jour…"><button class="btn full" style="margin-top:20px">${p?'Enregistrer':'Ajouter à ma semaine'}</button></form>${p?btn('Retirer du planning','plan-delete',`data-id="${p.id}"`,'text-btn danger-text'):''}`);}
function activityDialog(kind,id=null,planId=null){const h=id?db.history.find(h=>h.id===id):null,p=planId?db.plan.find(p=>p.id===planId):null;modal(kind==='run'?'Noter une course':'Noter un WOD',`<form data-form="activity" data-kind="${kind}" data-id="${id||''}" data-plan="${planId||h?.planId||''}"><label class="label" for="activity-title">Nom</label><input id="activity-title" name="title" required maxlength="100" value="${esc(h?.title||p?.title||(kind==='run'?'Course à pied':'Mon WOD'))}"><label class="label" for="activity-date">Date réalisée</label><input id="activity-date" name="date" type="date" required value="${h?.date||p?.date||dayKey()}">${kind==='wod'?`<label class="label" for="activity-content">Contenu du WOD</label><textarea id="activity-content" name="content" placeholder="Ex. 5 rounds : 10 tractions, 20 pompes, 30 squats">${esc(h?.content||'')}</textarea><label class="label" for="activity-result">Résultat</label><input id="activity-result" name="result" value="${esc(h?.result||'')}" placeholder="Ex. 18:42 ou 6 rounds + 12 reps">`:''}<div class="form-grid">${kind==='run'?`<div><label class="label" for="activity-distance">Distance (km)</label><input id="activity-distance" name="distance" type="number" inputmode="decimal" min="0.01" step="0.01" value="${h?.distance??''}" placeholder="5"></div>`:''}<div><label class="label" for="activity-duration">Durée (minutes)</label><input id="activity-duration" name="duration" type="number" inputmode="decimal" min="0.1" step="0.1" value="${h?.duration??''}" placeholder="30"></div></div><label class="label" for="activity-notes">Notes / ressenti</label><textarea id="activity-notes" name="notes" placeholder="Allure, sensations, adaptations…">${esc(h?.notes||'')}</textarea><button class="btn full" style="margin-top:20px">Enregistrer dans l’historique</button></form>`);}
function historyView(){const h=db.history.filter(h=>histFilter==='all'||h.kind===histFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||''));return `<div class="page-head"><div class="eyebrow">Ce que tu as fait</div><h1>Ton historique.</h1><p class="muted">Chaque séance, avec son vrai contenu.</p></div>${db.historyEdit?`<div class="notice">Correction en cours : ${esc(db.historyEdit.snapshot.title)} ${btn('Reprendre','nav','data-page="history-edit"','text-btn')}</div>`:''}<div class="tabs">${[['all','Tout'],['workout','Muscu / PDC'],['wod','WOD'],['run','Course']].map(([k,t])=>btn(t,'hist-filter',`data-kind="${k}"`,histFilter===k?'active':'')).join('')}</div><div class="stack">${h.map(h=>`<article class="card"><div class="row"><div class="activity-icon ${h.kind}">${icon(h.kind)}</div><div class="grow"><div class="eyebrow">${esc(dateLabel(h.date))}</div><h3>${esc(h.title)}</h3></div>${ib('next','history-detail',`data-id="${h.id}"`,'Voir le détail')}</div><div class="history-summary"><span>${esc(activitySubtitle(h))}</span>${h.kind==='workout'&&h.duration?`<span>${fmt(h.duration)} min</span>`:''}</div>${h.champion?champTotalsView(h):historyChainSummary(h)}${(h.exercises||[]).slice(0,3).map(e=>`<div class="history-ex"><b style="font-size:13px">${esc(e.name)}</b><p>${esc(e.blocks.flatMap(b=>b.rows.map(r=>rowSummary(r,e.mode))).join(' / '))}</p></div>`).join('')}${h.exercises?.length>3?`<p class="muted" style="font-size:12px;margin-top:12px">+ ${h.exercises.length-3} exercices dans le détail</p>`:''}${h.kind==='wod'&&h.content?`<p class="muted" style="margin-top:12px;white-space:pre-wrap">${esc(h.content)}</p>`:''}</article>`).join('')||emptyState('Tes entraînements apparaîtront ici une fois enregistrés.',btn('Ajouter un entraînement','start'))}</div>`;}
function historyDetail(id){const ch=db.history.find(h=>h.id===id);if(ch?.champion)return champHistoryDetail(ch);const h=db.history.find(h=>h.id===id);if(!h)return;modal(h.title,`<p class="muted" style="margin-top:15px">${esc(dateLabel(h.date))}${h.duration?' · '+fmt(h.duration)+' min':''}${h.distance?' · '+fmt(h.distance)+' km':''}</p>${h.kind==='run'&&h.distance&&h.duration?`<div class="notice">Allure moyenne : ${timeFmt(Math.round(h.duration*60/h.distance))} / km</div>`:''}${h.content?`<p style="white-space:pre-wrap;margin-top:15px">${esc(h.content)}</p>`:''}${h.result?`<div class="notice"><b>Résultat :</b> ${esc(h.result)}</div>`:''}${h.champion?champTotalsView(h):historyChainSummary(h)}${(h.exercises||[]).map(e=>`<div class="history-ex"><h3>${esc(e.name)}</h3>${!e.blocks.length?'<p class="muted">Aucune série validée.</p>':''}${e.notes?`<p class="exercise-note">${esc(e.notes)}</p>`:''}${e.blocks.map(b=>`<div style="margin-top:12px"><span class="pill subtle">${esc(b.label)}${b.kind==='emom'?' · EMOM · '+(b.minutes||b.rows.length)+' min prévues':''}</span>${b.rows.map((r,i)=>`<p>${b.kind==='emom'?'Minute':'Série'} ${r.position||i+1} — ${esc(rowSummary(r,e.mode))}${r.chain?`<span class="history-row-chain">${esc(r.chain.name)} · tour ${r.chain.round}</span>`:''}${b.kind==='emom'&&r.targetAtLog?`<span class="history-row-chain">Objectif noté : ${r.targetAtLog} reps</span>`:''}</p>`).join('')}</div>`).join('')}</div>`).join('')}${h.notes?`<hr class="rule"><div class="eyebrow">Notes</div><p style="white-space:pre-wrap">${esc(h.notes)}</p>`:''}<div class="foot-actions">${btn('Modifier',h.kind==='workout'?'history-edit':'activity-edit',`data-id="${h.id}"`,'btn secondary')}${btn('Supprimer','history-delete',`data-id="${h.id}"`,'btn danger')}</div>`);}
function spark(values){if(values.length<2)return '<div class="muted" style="font-size:12px;margin:20px 0">La courbe apparaîtra après un deuxième entraînement.</div>';const min=Math.min(...values),max=Math.max(...values),range=max-min||1,pts=values.map((v,i)=>[6+i*288/(values.length-1),54-(v-min)/range*43]),points=pts.map(p=>p.join(',')).join(' ');return `<svg class="spark" viewBox="0 0 300 65" role="img" aria-label="Évolution : ${values.map(fmt).join(', ')}"><path d="M6 57H294" stroke="#edf0f5" fill="none"/><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--blue)"/>`).join('')}</svg>`;}
function performanceCards(limit=Infinity){const groups=new Map();for(const m of measurements()){const k=JSON.stringify([norm(m.name),m.mode]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);}const all=[...groups.values()].sort((a,b)=>b.at(-1).date.localeCompare(a.at(-1).date)).slice(0,limit);return all.map(ms=>{const last=ms.at(-1),rows=ms.flatMap(m=>m.rows),weighted=rows.some(r=>r.weight>0);const best=rows.reduce((best,r)=>!best||(weighted?(r.weight>best.weight||(r.weight===best.weight&&r.reps>best.reps)):r.reps>best.reps)?r:best,null);const values=ms.slice(-12).map(m=>Math.max(...m.rows.map(r=>weighted?r.weight||0:r.reps||0)));const pdc=last.mode==='pdc';return `<div class="card"><div class="eyebrow">${pdc?'Poids du corps':'Musculation'} · ${ms.length} entraînements</div><h3>${esc(last.name)}</h3><div class="row between" style="margin-top:17px"><div class="perf-value">${weighted&&pdc?'+':''}${fmt(weighted?best.weight:best.reps)} <small>${weighted?'kg':'reps'}</small></div><span class="pill done">${weighted?'Charge maximale':'Meilleure série'}</span></div>${weighted?`<p class="muted" style="font-size:12px;margin-top:4px">${best.reps} reps à cette charge${pdc?' · lest ajouté':''}</p>`:''}${spark(values)}<div class="row between muted" style="font-size:10px"><span>${dayDate(ms.slice(-12)[0].date).toLocaleDateString('fr-FR')}</span><span>${dayDate(last.date).toLocaleDateString('fr-FR')}</span></div><p class="muted" style="font-size:12px;margin-top:13px">Courbe : ${weighted?'charge maximale':'maximum de reps par série'} à chaque entraînement.</p></div>`;}).join('')||emptyState('Tes records et tes courbes se construiront au fil de tes séances.');}
function prKey(p){return JSON.stringify([norm(p.name),p.mode,p.metric,p.metric==='load_reps'?p.reps:null,p.metric==='reps'?p.load:null]);}
function prLabel(p){return p.metric==='load'?'Charge maximale réalisée':p.metric==='load_reps'?`Charge sur ${p.reps} reps exactement`:`Maximum de reps ${p.mode==='pdc'&&p.load===0?'sans lest':'à '+(p.mode==='pdc'?'+':'')+fmt(p.load)+' kg'}`;}
function prUnit(p){return p.metric==='reps'?'reps':'kg';}
function prValue(p,v){return `${p.mode==='pdc'&&p.metric!=='reps'&&v>0?'+':''}${fmt(v)} ${prUnit(p)}`;}
function prRows(p,rows){return rows.filter(r=>r.done&&!r.warmup&&Number.isFinite(r.weight)&&Number.isInteger(r.reps)&&r.reps>0&&(p.metric!=='load_reps'||r.reps===p.reps)&&(p.metric!=='reps'||r.weight===p.load));}
function prPoints(p,source=measurements()){return source.filter(m=>norm(m.name)===norm(p.name)&&m.mode===p.mode).map(m=>{const rows=prRows(p,m.rows);if(!rows.length)return null;const row=rows.reduce((a,b)=>{const av=p.metric==='reps'?a.reps:a.weight,bv=p.metric==='reps'?b.reps:b.weight;return bv>av||bv===av&&b.reps>a.reps?b:a;});return {date:m.date,value:p.metric==='reps'?row.reps:row.weight,reps:row.reps};}).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));}
function prBest(points){return points.reduce((a,b)=>!a||b.value>a.value||b.value===a.value&&b.reps>a.reps?b:a,null);}
function prExercises(){const list=measurements().map(m=>({name:m.name,mode:m.mode})).concat(sessions().flatMap(s=>s.exercises),db.customExercises||[],db.settings.prPins||[]);return [...new Map(list.map(e=>[JSON.stringify([norm(e.name),e.mode]),{name:e.name,mode:e.mode}])).values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));}
function prCard(p,index){const points=prPoints(p),best=prBest(points);return `<article class="pr-card"><div class="row between"><span class="pr-pin">◆ ÉPINGLÉ</span><div class="row">${ib('up','pr-move',`data-id="${p.id}" data-dir="-1" ${index===0?'disabled':''}`,'Monter ce PR')}${ib('down','pr-move',`data-id="${p.id}" data-dir="1" ${index===(db.settings.prPins||[]).length-1?'disabled':''}`,'Descendre ce PR')}${ib('edit','pr-edit',`data-id="${p.id}"`,'Modifier le PR et son objectif')}${ib('close','pr-unpin',`data-id="${p.id}"`,'Désépingler ce PR')}</div></div><button class="pr-open" data-action="pr-detail" data-id="${p.id}"><h3>${esc(p.name)}</h3><p class="muted">${esc(prLabel(p))}</p><strong class="pr-number">${best?prValue(p,best.value):'—'}</strong><p class="muted">${best?`${p.metric!=='reps'?best.reps+' reps · ':''}${esc(dateLabel(best.date))}`:'Pas encore de série correspondant à ce critère'}</p>${spark(points.slice(-12).map(x=>x.value))}<span class="text-btn">Voir la progression →</span></button>${p.goal?`<div class="pr-goal"><div class="row between"><span>Objectif ${prValue(p,p.goal)}</span><b>${best?Math.round(best.value/p.goal*100):0} %</b></div><progress value="${Math.min(best?.value||0,p.goal)}" max="${p.goal}" aria-label="Progression vers l’objectif"></progress>${best&&best.value>=p.goal?'<span class="pr-pin">Objectif atteint</span>':''}</div>`:''}</article>`;}
function prDialog(id=null,name=null,mode=null){const pin=(db.settings.prPins||[]).find(p=>p.id===id),exs=prExercises();if(!exs.length){toast('Ajoute un exercice à ton programme ou réalise une séance pour épingler un PR.');return;}const selected=pin||{name:name||exs[0].name,mode:mode||exs[0].mode,metric:'load',reps:5,load:0};modal(pin?'Modifier mon PR':'Épingler un PR',`<form data-form="pr-save" ${pin?`data-id="${pin.id}"`:''}><label class="label" for="pr-exercise">Exercice</label><select id="pr-exercise" name="exercise">${exs.map(e=>`<option value="${esc(JSON.stringify(e))}" ${norm(e.name)===norm(selected.name)&&e.mode===selected.mode?'selected':''}>${esc(e.name)} · ${e.mode==='pdc'?'PDC / lest':'poids total'}</option>`).join('')}</select><label class="label" for="pr-metric">Record à suivre</label><select id="pr-metric" name="metric" data-input="pr-metric"><option value="load" ${selected.metric==='load'?'selected':''}>Charge maximale réalisée</option><option value="load_reps" ${selected.metric==='load_reps'?'selected':''}>Charge pour un nombre précis de reps</option><option value="reps" ${selected.metric==='reps'?'selected':''}>Maximum de reps à charge fixe</option></select><div id="pr-reps-wrap" ${selected.metric!=='load_reps'?'hidden':''}><label class="label" for="pr-reps">Nombre exact de répétitions</label><input id="pr-reps" name="reps" type="number" min="1" max="999" step="1" value="${selected.reps||5}"></div><div id="pr-load-wrap" ${selected.metric!=='reps'?'hidden':''}><label class="label" for="pr-load">Charge fixe (kg) · 0 pour PDC sans lest</label><input id="pr-load" name="load" type="number" min="0" max="2000" step="any" value="${selected.load||0}"></div><label class="label" for="pr-goal">Objectif facultatif · <span id="pr-goal-unit">${prUnit(selected)}</span></label><input id="pr-goal" name="goal" type="number" min="0.01" step="any" value="${pin?.goal||''}" placeholder="Laisser vide sans objectif"><p class="muted" style="font-size:12px;margin-top:12px">Séries validées hors échauffement. En PDC, la charge est le lest ajouté. Aucun maximum estimé.</p><button class="btn full" style="margin-top:18px">${pin?'Enregistrer':'Épingler ce PR'}</button></form>`);}
function prDetail(id){const p=(db.settings.prPins||[]).find(p=>p.id===id);if(!p)return;const points=prPoints(p),best=prBest(points),recent=points.slice(-12);modal(p.name,`<p class="muted">${esc(prLabel(p))}</p><strong class="pr-number">${best?prValue(p,best.value):'—'}</strong><p class="muted">Record réalisé${best?' · '+esc(dateLabel(best.date)):''}</p>${spark(recent.map(x=>x.value))}<p class="muted">Les ${recent.length} derniers entraînements correspondant au critère.</p>${recent.length?`<table class="pr-table"><thead><tr><th>Date</th><th>Performance</th></tr></thead><tbody>${recent.slice().reverse().map(x=>`<tr><td>${esc(dateLabel(x.date))}</td><td>${prValue(p,x.value)}${p.metric!=='reps'?' × '+x.reps+' reps':''}</td></tr>`).join('')}</tbody></table>`:emptyState('Aucune série correspondante pour le moment.')}${btn('Modifier l’objectif / le critère','pr-edit',`data-id="${p.id}"`,'btn full')}`);}
function newWorkoutPRs(h){const before=measurements().filter(m=>m.date<=h.date),current=h.exercises.map(e=>({name:e.name,mode:e.mode,date:h.date,rows:e.blocks.flatMap(b=>b.rows)})),candidates=[...(db.settings.prPins||[])];for(const e of h.exercises){candidates.push({name:e.name,mode:e.mode,metric:'load'});if(e.mode==='pdc')candidates.push({name:e.name,mode:e.mode,metric:'reps',load:0});}return [...new Map(candidates.map(p=>[prKey(p),p])).values()].flatMap(p=>{const old=prBest(prPoints(p,before)),next=prBest(prPoints(p,current));return old&&next&&next.value>old.value?[{name:p.name,label:prLabel(p),value:prValue(p,next.value),old:prValue(p,old.value)}]:[];});}

async function importData(file){if(!file)return;try{const p=JSON.parse(await file.text());let s;if(p.app!=='LaForge'||!p.data)throw Error('Ce fichier n’est pas une sauvegarde LaForge.');if(p.version===2){s=p.data;validate(s);}else if(p.version===1&&p.data[KEY]){s=JSON.parse(p.data[KEY]);validate(s);}else if(p.version===1&&(p.data.laforge_db||p.data.session_log)){s=migrate(p.data);validate(s);}else throw Error('Format non reconnu.');if(!confirm(`Restaurer cette sauvegarde (${s.programs.length} programmes, ${s.history.length} activités) ? Les données actuelles de cette version seront remplacées.`))return;seedExercises(s);localStorage.setItem(KEY,JSON.stringify(s));db=s;blocked=false;storageError='';migrationNotice=false;closeModal();goto('home');toast('Sauvegarde restaurée.');}catch(e){toast('Import impossible : '+e.message);}finally{$('#import-file').value='';}}
function tick(){champTick();tickEmomFocus();const d=db.draft;if(!d||page!=='workout')return;const elapsed=$('#elapsed');if(elapsed)elapsed.textContent=Math.floor((Date.now()-Date.parse(d.startedAt))/60000)+' min';const rest=$('#rest-display');if(rest)rest.innerHTML='';

function soundControls(){return `<div class="timer-sound-controls">${btn(db.settings.timerSound===false?'Bips désactivés':'Bips activés','timer-sound-toggle',`aria-pressed="${db.settings.timerSound!==false}"`,'text-btn')}<span data-sound-status></span></div>`;}
function updateSoundStatus(){const text=db.settings.timerSound===false?'':audioFailed?'Son indisponible : réessaie « Tester le son ».':timerAudio?.state==='running'?'Musique + bips · désactive le silencieux sur iPhone':'Touche « Tester le son » pour vérifier tes écouteurs.';document.querySelectorAll('[data-sound-status]').forEach(el=>{if(el.textContent!==text)el.textContent=text;});}
function configureTimerAudio(){try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch{}}
function releaseTimerAudio(){stopTimerSounds();try{if(navigator.audioSession)navigator.audioSession.type='auto';}catch{}if(timerAudio?.state==='running')timerAudio.suspend?.().catch(()=>{});}
async function unlockTimerAudio(){if(db.settings.timerSound===false)return false;try{configureTimerAudio();const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Audio unavailable');if(!timerAudio||timerAudio.state==='closed'){timerAudio=new C();timerAudio.addEventListener('statechange',updateSoundStatus);}if(timerAudio.state!=='running')await timerAudio.resume();audioFailed=timerAudio.state!=='running';updateSoundStatus();return !audioFailed;}catch{audioFailed=true;updateSoundStatus();return false;}}
function stopTimerSounds(){for(const node of soundNodes){try{node.stop();}catch{}}soundNodes.clear();}
function timerTone(final=false,delay=0){if(db.settings.timerSound===false||timerAudio?.state!=='running'||document.visibilityState!=='visible')return;try{const osc=timerAudio.createOscillator(),gain=timerAudio.createGain(),at=timerAudio.currentTime+delay,duration=final?0.32:0.12;osc.type='sine';osc.frequency.setValueAtTime(final?1100:780,at);gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(0.16,at+0.012);gain.gain.setValueAtTime(0.16,at+duration-0.035);gain.gain.linearRampToValueAtTime(0,at+duration);osc.connect(gain);gain.connect(timerAudio.destination);soundNodes.add(osc);osc.onended=()=>{soundNodes.delete(osc);osc.disconnect();gain.disconnect();};osc.start(at);osc.stop(at+duration+0.01);}catch{audioFailed=true;updateSoundStatus();}}
async function testTimerSound(){if(db.settings.timerSound===false){toast('Active les bips pour les tester.');return;}if(await unlockTimerAudio()){stopTimerSounds();[0,1,2].forEach(delay=>timerTone(false,delay));timerTone(true,3);setTimeout(()=>{if(page!=='workout')releaseTimerAudio();},3600);}}
function tickTimerSounds(){const d=db.draft;if(!d||page!=='workout'||document.visibilityState!=='visible'){soundClocks.clear();return;}const now=Date.now(),active=new Set();let cue=null;
 if(d.restUntil){const key=d.id+':rest',signature=d.restUntil,left=Math.ceil((d.restUntil-now)/1000),old=soundClocks.get(key);active.add(key);if(left>=1&&left<=3&&(!old||old.signature!==signature||old.value!==left))cue=false;else if(left===0&&old?.signature===signature&&old.value>0&&now-old.at<1500)cue=true;soundClocks.set(key,{signature,value:left,at:now});}
 for(const e of d.exercises)for(const b of e.blocks){if(b.kind!=='emom'||!b.timer)continue;const key=d.id+':emom:'+b.id;active.add(key);if(!b.timer.running)continue;const raw=Math.max(0,b.timer.elapsed+now-b.timer.started),second=Math.floor(raw/1000),cap=emomDuration(b)*60,old=soundClocks.get(key);if(!old||old.value!==second){if(second<cap&&second%60>=57){if(cue!==true)cue=false;}else if(second>0&&second<=cap&&second%60===0&&old&&old.value===second-1&&now-old.at<1500)cue=true;}soundClocks.set(key,{value:second,at:now});}
 for(const key of soundClocks.keys())if(!active.has(key))soundClocks.delete(key);
 if(cue!==null)timerTone(cue);
}

let screenLock=null,screenLockPending=false,screenLockState='idle',screenPageHidden=false;
function wantsScreenLock(){return !!db.draft&&page==='workout'&&document.visibilityState==='visible'&&!screenPageHidden;}
function screenLockStatus(){const el=$('#screen-lock-status');if(!el)return;const active=screenLock&&!screenLock.released;el.innerHTML=active?'Écran maintenu allumé':screenLockState==='unsupported'?'Maintien de l’écran indisponible sur ce navigateur.':screenLockState==='blocked'?`Écran susceptible de se verrouiller. ${btn('Réessayer','screen-lock-retry','','text-btn')}<span class="screen-lock-help">Le téléphone peut refuser en mode économie d’énergie ou si la batterie est faible.</span>`:screenLockPending?'Maintien de l’écran…':'Maintien de l’écran en attente…';el.classList.toggle('screen-lock-active',!!active);}
async function syncScreenLock(retry=false){
 if(!wantsScreenLock()){const previous=screenLock;screenLock=null;screenLockState='idle';if(previous&&!previous.released){try{await previous.release();}catch{}}screenLockStatus();return;}
 if(!navigator.wakeLock?.request){screenLockState='unsupported';screenLockStatus();return;}
 if(screenLock&&!screenLock.released||screenLockPending){screenLockStatus();return;}
 if(screenLockState==='blocked'&&!retry){screenLockStatus();return;}
 screenLockPending=true;screenLockState='pending';screenLockStatus();
 try{const lock=await navigator.wakeLock.request('screen');if(!wantsScreenLock()){await lock.release();screenLockState='idle';return;}screenLock=lock;screenLockState=lock.released?'blocked':'active';lock.addEventListener('release',()=>{if(screenLock!==lock)return;screenLock=null;screenLockState=wantsScreenLock()?'blocked':'idle';screenLockStatus();});}
 catch{screenLockState=wantsScreenLock()?'blocked':'idle';}
 finally{screenLockPending=false;screenLockStatus();}
}
document.addEventListener('visibilitychange',()=>{syncScreenLock(document.visibilityState==='visible');});
window.addEventListener('pagehide',()=>{screenPageHidden=true;syncScreenLock();});

function champRollback(h){if(!h?.champion)return;const p=db.programs.find(p=>p.id===h.champion.programId),c=p?.champion;if(!c)return;const from=c.autoFrom;const index=(stage,week)=>stage?3+(stage-1)*4+week-1:week-1;const matches=from&&from.stage===h.champion.stage&&from.week===h.champion.week;const adjacent=!c.manualCursor&&!from&&(index(c.stage,c.week)===index(h.champion.stage,h.champion.week)+1||c.completed&&c.stage===h.champion.stage&&c.week===h.champion.week);if(matches||adjacent){c.stage=h.champion.stage;c.week=h.champion.week;c.completed=false;c.autoFrom=null;}}
function champTemplateView(s){return `<div class="page-head">${btn('‹ Programme','nav','data-page="program"','text-btn')}<h1>${esc(s.name)}</h1><p class="muted">Modèle permanent · pour toutes les prochaines séances de ce type. La séance en cours et l’historique restent inchangés.</p></div>${s.champion.blocks.map((b,bi)=>`<section class="card"><div class="row">${champIcon(b.rounds[0].items[0].family,b.title)}<h2>${esc(b.title)}</h2></div><p class="muted">${b.rounds.length} ${b.type==='emom'?'minutes':'tours / paliers'} · ${esc(b.type)}</p><p>${esc(b.note)}</p>${btn('Exercices, objectifs et repos','ch-config',`data-scope="template" data-sid="${s.id}" data-bi="${bi}"`,'btn secondary')}${btn('Retirer le bloc','ch-template-remove',`data-sid="${s.id}" data-bi="${bi}"`,'text-btn danger-text')}</section>`).join('')}${btn('+ Ajouter un bloc','ch-template-add',`data-sid="${s.id}"`,'btn secondary')}${btn('Terminé','nav','data-page="program"','btn')}`;}
function champConfig(bi,scope='draft',sid=''){const owner=scope==='template'?session(sid):db.draft,b=owner?.champion?.blocks[bi];if(!b)return;const families={pull:'Tractions',push:'Pompes',dip:'Dips',mu:'Muscle-ups',hold:'Maintien / gainage',leg:'Jambes'};modal(scope==='template'?'Modifier les prochaines séances':'Adapter cette séance',`<form class="ch-editor" data-ch-form="block" data-config="true" data-bi="${bi}" data-scope="${scope}" data-sid="${sid}"><p class="muted">${scope==='template'?'Ces réglages deviennent le modèle des prochaines séances.':'Modifications temporaires : le modèle dans Programme reste inchangé.'}</p><label class="label">Nom du bloc<input name="title" required maxlength="150" value="${esc(b.title)}"></label><label class="label">Repos commun (s, 0 = libre)<input name="rest" type="number" min="0" max="1800" required value="${b.rounds.find((r,ri)=>b.breaks?.[ri]==null)?.rest||0}"></label><p class="muted">Chaque tour garde son objectif : tu peux varier les reps minute par minute. Les objectifs ne sont jamais comptés comme des résultats. Pour remplacer un mouvement dans tout le bloc, utilise le champ ci-dessous.</p><label class="label">Remplacer dans tout le bloc<select name="replace-from"><option value="">Aucun remplacement</option>${[...new Set(b.rounds.flatMap(r=>r.items.map(i=>i.label)))].map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label><label class="label">Nouveau nom<input name="replace-name" maxlength="100" placeholder="Ex. Tractions lestées"></label><label class="label">Catégorie pour les totaux<select name="replace-family">${Object.entries(families).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="label">Unité du mouvement remplacé<select name="replace-unit"><option value="reps">Répétitions</option><option value="seconds">Secondes</option></select></label>${b.rounds.map((r,ri)=>`<details ${b.rounds.length<=4?'open':''}><summary>${esc(r.label||'Tour '+(ri+1))} · ${esc(r.items.map(i=>i.label+' : '+i.target).join(' + '))}</summary><fieldset><label>Repos après ce tour (s)<input name="rest-${ri}" type="number" min="0" max="1800" required value="${r.rest}"></label>${r.items.map((i,ii)=>`<label class="label">${esc(i.label)} · objectif<input name="t-${ri}-${ii}" maxlength="100" value="${esc(i.target)}"></label>${i.unit==='reps'?`<label class="label">Lest / charge prévu (kg)<input name="weight-${ri}-${ii}" type="number" min="0" max="2000" step="0.5" required value="${i.weight??0}"></label>`:''}`).join('')}</fieldset></details>`).join('')}<label class="label">Notes<textarea name="note">${esc(b.note)}</textarea></label><button class="btn full" type="submit">${scope==='template'?'Enregistrer pour les prochaines séances':'Appliquer à cette séance'}</button></form>`);}
document.addEventListener('click',event=>{const x=event.target.closest('[data-action]')?.dataset;if(!x)return;if(x.action==='ch-collapse'){change(()=>{const b=db.draft.champion.blocks[Number(x.bi)];b.uiCollapsed=!b.uiCollapsed;});return;}if(x.action==='ch-config'||x.action==='ch-edit'){event.preventDefault();event.stopImmediatePropagation();champConfig(Number(x.bi),x.scope||'draft',x.sid||'');}else if(x.action==='ch-template-remove'){const s=session(x.sid);if(s.champion.blocks.length<=1){toast('Garde au moins un bloc.');return;}if(confirm('Retirer ce bloc des prochaines séances ?'))change(()=>{s.champion.blocks.forEach((b,j)=>b.sourceKey||=s.id+':'+j);s.champion.blocks.splice(Number(x.bi),1);});}else if(x.action==='ch-template-add'){const s=session(x.sid);modal('Ajouter un bloc',`<form data-ch-form="add" data-sid="${s.id}"><label class="label">Nom<input name="name" required maxlength="100" placeholder="Tractions lestées"></label><label class="label">Catégorie<select name="family"><option value="pull">Tractions</option><option value="dip">Dips</option><option value="push">Pompes</option><option value="mu">Muscle-ups</option><option value="leg">Jambes</option><option value="hold">Maintien / gainage</option></select></label><label class="label">Format<select name="type"><option value="series">Séries</option><option value="emom">EMOM</option><option value="fortime">For time</option></select></label><label class="label">Nombre de séries / minutes<input name="count" type="number" min="1" max="200" value="3" required></label><button class="btn full" type="submit">Ajouter puis régler</button></form>`);}},true);
document.addEventListener('submit',event=>{const f=event.target;if(f.dataset.chForm==='add'){event.preventDefault();event.stopImmediatePropagation();if(!f.checkValidity())return;const v=new FormData(f),s=session(f.dataset.sid),count=Number(v.get('count')),family=String(v.get('family')),name=String(v.get('name')).trim();if(!name)return;let bi;if(change(()=>{const id=uid();s.champion.blocks.forEach((b,j)=>b.sourceKey||=s.id+':'+j);const b={id,sourceKey:s.id+':'+id,title:name,note:'',type:String(v.get('type')),customized:true,rounds:Array.from({length:count},(_,j)=>({id:uid(),label:(v.get('type')==='emom'?'Minute ':'Série ')+(j+1),rest:v.get('type')==='emom'?0:120,timer:null,items:[{id:uid(),family,label:name,unit:family==='hold'?'seconds':'reps',target:'',weight:0,reps:null,seconds:null,done:false,warmup:false}]}))};s.champion.blocks.push(b);bi=s.champion.blocks.length-1;})){closeModal();champConfig(bi,'template',s.id);}return;}
 if(f.dataset.config!=='true')return;event.preventDefault();event.stopImmediatePropagation();if(!f.checkValidity())return;const v=new FormData(f),scope=f.dataset.scope,owner=scope==='template'?session(f.dataset.sid):db.draft,b=owner?.champion?.blocks[Number(f.dataset.bi)];if(!b)return;const from=String(v.get('replace-from')),name=String(v.get('replace-name')).trim();if(from&&!name){toast('Renseigne le nom du mouvement de remplacement.');return;}const rest=Number(v.get('rest')),old=b.rounds.find((r,ri)=>b.breaks?.[ri]==null)?.rest||0;if(change(()=>{champBindTimer();b.title=String(v.get('title'));b.note=String(v.get('note'));b.customized=true;b.rounds.forEach((r,ri)=>{r.rest=rest!==old&&b.breaks?.[ri]==null?rest:Number(v.get('rest-'+ri));r.items.forEach((i,ii)=>{const target=String(v.get(`t-${ri}-${ii}`));if(target!==i.target)i.targetOverride=true;i.target=target;const w=v.get(`weight-${ri}-${ii}`);if(w!==null&&Number(w)!==i.weight){i.weight=Number(w);i.done=false;}if(from&&i.label===from){if(scope==='draft'&&db.draft?.champion?.timer?.itemId===i.id)delete db.draft.champion.timer;i.label=name;i.family=String(v.get('replace-family'));i.unit=String(v.get('replace-unit'));i.weight??=0;i.reps=null;i.seconds=null;i.done=false;}});});}))closeModal();},true);
function champHistoryAutosave(event){const f=event.target.closest('form[data-ch-form="history"]'),edit=db.historyEdit;if(!f||!edit?.snapshot?.champion||!event.target.checkValidity())return;const v=new FormData(f);change(()=>{const h=edit.snapshot;h.title=String(v.get('title'));h.date=String(v.get('date'));h.notes=String(v.get('notes'));h.champion.blocks.forEach((b,bi)=>b.rounds.forEach((r,ri)=>{const t=v.get(`time-${bi}-${ri}`);if(t!==null)r.time=t===''?null:Number(t);r.items.forEach((i,ii)=>{const key=`${bi}-${ri}-${ii}`,value=v.get('v-'+key),weight=v.get('w-'+key);i[i.unit==='seconds'?'seconds':'reps']=value===''?null:Number(value);if(weight!==null)i.weight=weight===''?null:Number(weight);i.warmup=v.has('e-'+key);i.done=v.has('d-'+key)&&(i.unit==='seconds'?i.seconds!==null:i.reps!==null&&i.weight!==null);});}));},false);}
document.addEventListener('input',champHistoryAutosave);document.addEventListener('change',champHistoryAutosave);

function homeView(){const t=document.createElement('div');t.innerHTML=legacyHomeView();const p=currentProgram(),last=[...db.history].sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||''))[0];const pins=db.settings.prPins||[];const sections={week:t.querySelector('.home-week')?.outerHTML||'',programs:darkHomePrograms(),records:`<section class="card"><div class="row between"><h2>Records épinglés</h2>${btn('Voir tout','nav','data-page="perf"','text-btn')}</div><div class="dark-pins">${pins.slice(0,3).map(pin=>{const best=prBest(prPoints(pin));return `<button class="dark-pin" data-action="pr-detail" data-id="${pin.id}"><span>${esc(pin.name)}</span><strong>${best?prValue(pin,best.value):'—'}</strong></button>`;}).join('')||btn('Choisir mes records','pr-add','','text-btn')}</div></section>`,last:last?`<section class="card"><div class="eyebrow">Dernière séance</div>${btn(esc(last.title)+' · '+esc(dateLabel(last.date))+' →','history-detail',`data-id="${last.id}"`,'text-btn')}</section>`:''};const order=db.settings.homeOrder||['week','programs','records','last'];return `<div class="page-head"><h1>Bonjour Félix</h1><p class="muted">${esc(dateLabel(dayKey()))}</p></div>${migrationNotice?'<div class="notice">Tes données ont été reprises. Tu peux exporter une sauvegarde dans les réglages.</div>':''}<div class="home-layout">${t.querySelector('.hero')?.outerHTML||''}${order.filter(k=>!db.settings.homeHidden?.includes(k)).map(k=>sections[k]||'').join('')}</div>${btn('Personnaliser l’accueil','dark-home-settings','','text-btn full')}`;}
function darkHomePrograms(){const p=currentProgram(),others=db.programs.filter(q=>q.id!==p?.id);return `<section class="card"><div class="eyebrow">Programme actif</div>${p?darkProgramCard(p,true):btn('Créer un programme','program-add','','btn secondary')}${others.length?`<details><summary>Autres programmes · ${others.length}</summary>${others.map(q=>`<div class="row between"><span>${esc(q.name)}${q.archived?' · archivé':''}</span>${btn('Ouvrir','dark-program-open',`data-id="${q.id}"`,'text-btn')}</div>`).join('')}</details>`:''}</section>`;}
function darkProgramCard(p,compact=false){const hs=programHistory(p),seen=new Set(hs.filter(h=>h.champion).map(h=>[h.champion.stage,h.champion.week,h.sessionId].join(':'))),total=p.sessions.reduce((n,s)=>n+(s.champion?(s.champion.stage?4:3):0),0);return `<div class="dark-program"><div class="row between"><h3>${esc(p.name)}</h3>${p.id===db.activeProgram?'<span class="pill">Actif</span>':''}</div><p class="muted">${p.champion?seen.size+' / '+total+' séances du parcours':hs.length+' séances réalisées'}</p>${p.champion&&total?`<progress max="${total}" value="${Math.min(total,seen.size)}" aria-label="Avancement ${esc(p.name)}"></progress>`:''}<div class="row wrap">${btn('Voir les séances','dark-program-open',`data-id="${p.id}"`,'text-btn')}${!compact?btn('Résultats','dark-program-results',`data-id="${p.id}"`,'text-btn'):''}${!compact&&p.id!==db.activeProgram?btn(p.archived?'Réutiliser':'Utiliser','dark-program-use',`data-id="${p.id}"`,'btn secondary'):''}</div>${!compact?`<details class="dark-options"><summary aria-label="Options du programme">⋯</summary>${btn('Renommer','program-rename',`data-id="${p.id}"`,'text-btn')}${btn(p.archived?'Désarchiver':'Archiver','dark-program-archive',`data-id="${p.id}"`,'text-btn')}${btn('Recommencer un cycle','dark-program-repeat',`data-id="${p.id}"`,'text-btn')}${btn('Dupliquer et modifier','dark-program-copy',`data-id="${p.id}"`,'text-btn')}</details>`:''}</div>`;}
function programView(){const active=db.programs.filter(p=>!p.archived),archived=db.programs.filter(p=>p.archived);return `<div class="page-head"><div class="row between"><h1>Mes programmes</h1>${btn('Ajouter','program-add','','text-btn')}</div></div><div class="stack">${active.map(p=>`<section class="card">${darkProgramCard(p)}</section>`).join('')||'<p class="muted">Tes programmes actifs apparaîtront ici.</p>'}</div><details class="card" style="margin-top:16px"><summary>Anciens programmes · ${archived.length}</summary>${archived.map(p=>darkProgramCard(p)).join('')||'<p class="muted">Aucun programme archivé.</p>'}</details><div class="row wrap">${btn('Mes exercices','nav','data-page="catalog"','text-btn')}${db.programs.some(p=>p.champion)?'':btn('Ajouter Champion niveau 2','ch-install','','text-btn')}</div>`;}
function darkCopyProgram(id,repeat){const p=db.programs.find(p=>p.id===id);if(!p)return;change(()=>{const q=clone(p),map=new Map();q.id=uid();q.name=p.name+(repeat?' · nouveau cycle':' · copie');q.archived=false;q.originProgramId=p.originProgramId||p.id;q.createdAt=new Date().toISOString();q.sessions.forEach(s=>{const old=s.id;s.id=uid();map.set(old,s.id);s.exercises?.forEach(e=>{e.id=uid();e.blocks.forEach(b=>b.id=uid());});s.champion?.blocks.forEach((b,j)=>{b.sourceKey||=old+':'+j;b.id=uid();b.rounds.forEach(r=>{r.id=uid();r.items.forEach(i=>i.id=uid());});});});if(q.champion)q.champion={stage:0,week:1,completed:false};if(repeat)p.archived=true;db.programs.push(q);db.activeProgram=q.id;});goto('program-detail');}
function darkHomeSettings(){const labels={week:'Calendrier et statistiques',programs:'Mes programmes',records:'Records épinglés',last:'Dernière séance'},order=db.settings.homeOrder||Object.keys(labels);modal('Personnaliser l’accueil',order.map((k,j)=>`<div class="row between"><label><input type="checkbox" data-dark-home="${k}" ${db.settings.homeHidden?.includes(k)?'':'checked'}> ${labels[k]}</label>${btn('↑','dark-home-move',`data-key="${k}" data-dir="-1" ${j===0?'disabled':''}`,'icon')}${btn('↓','dark-home-move',`data-key="${k}" data-dir="1" ${j===order.length-1?'disabled':''}`,'icon')}</div>`).join(''));}
function darkEnhance(){const nav=$('#nav');document.body.dataset.view=page;document.body.classList.toggle('show-rpe',!!db.settings.showRpe);nav.style.gridTemplateColumns='repeat(3,1fr)';nav.querySelectorAll('[data-page]').forEach(el=>{const selected=el.dataset.page==='perf'?['perf','history','history-edit'].includes(page):el.dataset.page==='program'?['program','program-detail','editor','catalog'].includes(page):page==='home';el.classList.toggle('active',selected);if(selected)el.setAttribute('aria-current','page');});if(['history','perf'].includes(page))$('#app').insertAdjacentHTML('afterbegin',`<div class="dark-tabs">${btn('Performances','nav','data-page="perf"',page==='perf'?'btn':'btn secondary')}${btn('Historique','nav','data-page="history"',page==='history'?'btn':'btn secondary')}</div>`);if(page==='program-detail'){const head=$('#app .page-head');head?.insertAdjacentHTML('afterbegin',btn('‹ Mes programmes','nav','data-page="program"','text-btn'));$('#app [data-action="program-delete"]')?.remove();}

document.addEventListener('click',event=>{const x=event.target.closest('[data-action]')?.dataset,a=x?.action;if(!a?.startsWith('dark-'))return;const p=db.programs.find(p=>p.id===x.id);if(a==='dark-rpe')change(()=>db.settings.showRpe=!db.settings.showRpe);else if(a==='dark-home-settings')darkHomeSettings();else if(a==='dark-home-move'){change(()=>{const order=db.settings.homeOrder||['week','programs','records','last'],i=order.indexOf(x.key),j=i+Number(x.dir);if(j>=0&&j<order.length)[order[i],order[j]]=[order[j],order[i]];db.settings.homeOrder=order;});darkHomeSettings();}else if(a==='dark-ex-collapse')change(()=>{const e=db.draft.exercises[Number(x.ex)];e.uiCollapsed=!e.uiCollapsed;});else if(a==='dark-program-open'&&p){if(change(()=>db.activeProgram=p.id,false))goto('program-detail');}else if(a==='dark-program-use'&&p){change(()=>{p.archived=false;db.activeProgram=p.id;});goto('home');}else if(a==='dark-program-archive'&&p){change(()=>{p.archived=!p.archived;if(p.archived&&db.activeProgram===p.id)db.activeProgram=db.programs.find(q=>!q.archived)?.id||null;});}else if(a==='dark-program-results'&&p){const hs=programHistory(p);modal(p.name+' · résultats',`<p class="muted">${hs.length} séances enregistrées · historique conservé</p>${hs.map(h=>btn(esc(dateLabel(h.date))+' · '+esc(h.title),'history-detail',`data-id="${h.id}"`,'text-btn full')).join('')||'<p>Pas encore de séance enregistrée.</p>'}`);}else if((a==='dark-program-repeat'||a==='dark-program-copy')&&p){const repeat=a==='dark-program-repeat';if(!repeat||confirm('Créer un nouveau cycle depuis le début et archiver celui-ci ? Toutes tes anciennes performances seront conservées.'))darkCopyProgram(p.id,repeat);}});
