<script>
'use strict';
const KEY='laforge_simple_v2';
const $=s=>document.querySelector(s), uid=()=> 'f_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const fmt=n=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayDate(k){return new Date(k+'T12:00:00');}
function addDays(k,n){const d=dayDate(k);d.setDate(d.getDate()+n);return dayKey(d);}
function monday(k){const d=dayDate(k);return addDays(k,-((d.getDay()+6)%7));}
const dateLabel=k=>dayDate(k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const timeFmt=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
const paths={pdc:'M4 3h16M7 3v7l5 3 5-3V3M12 13v8M8 21l4-5 4 5M12 6h.01',home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',program:'M6 3h12a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 14h14M9 7h7M9 11h5',plus:'M12 5v14M5 12h14',history:'M3 4v5h5M3.5 9a9 9 0 1 1-.3 6M12 7v5l3 2',perf:'M4 4v16h16M7 15l4-5 4 2 5-7',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',workout:'M3 8v8M6 6v12M18 6v12M21 8v8M6 12h12',run:'m13 7-3 5 5 3-1 6M10 12l-4 5H2M13 7l4 5h4M15 3h.01',wod:'m13 2-9 12h7l-1 8L21 9h-8Z',arrow:'M5 12h14m-5-5 5 5-5 5',back:'m14 6-6 6 6 6',next:'m10 6 6 6-6 6',check:'m5 12 4 4L19 6',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',edit:'m16 3 5 5-12 12-6 1 1-6L16 3ZM13 6l5 5',up:'m6 14 6-6 6 6',down:'m6 10 6 6 6-6',close:'m6 6 12 12M6 18 18 6',calendar:'M4 5h16v16H4ZM8 2v6M16 2v6M4 10h16',save:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l3 2'};
function icon(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.workout}"/></svg>`;}
function btn(label,action,attrs='',cls='btn'){return `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;}
function ib(n,action,attrs='',label=n){return btn(icon(n),action,`${attrs} aria-label="${esc(label)}" title="${esc(label)}"`,'icon small');}
function emptyState(text,button=''){return `<div class="empty">${icon('workout')}${text}${button}</div>`;}
const CATALOG=['Développé couché','Développé incliné haltères','Tractions','Tractions supination','Dips','Pompes','Rowing barre','Rowing haltère','Tirage vertical','Tirage horizontal','Développé militaire','Élévations latérales','Oiseau','Face pull','Curl barre','Curl haltères','Curl marteau','Extension triceps','Squat','Presse à cuisses','Leg extension','Leg curl','Soulevé de terre roumain','Hip thrust','Fentes','Mollets','Crunch'];
function blank(){return {version:2,programs:[],activeProgram:null,plan:[],history:[],draft:null,legacyMeasurements:[],settings:{rest:120,lastExport:null}};}
let storageError='',blocked=false,migrationNotice=false;
function parseOld(raw,key,fallback){try{return JSON.parse(raw[key]||'null')??fallback;}catch{return fallback;}}
function oldBlocks(ex){const src=ex.blocs;const row=r=>({weight:Number(r.poids)||0,reps:Number(r.reps)||0,rpe:r.rpe==null?null:Number(r.rpe),done:true});
 if(src?.length)return src.map(b=>b.kind==='emom'?{id:uid(),kind:'emom',label:b.label||'EMOM',minutes:Number(b.emomData?.duree)||10,target:Number(b.emomData?.objectif)||5,rows:Object.values(b.emomData?.log||{}).map(r=>row({reps:r})),timer:null}:{id:uid(),kind:'series',label:b.label||'Séries',target:0,rows:(b.series||[]).map(row)});
 return [{id:uid(),kind:'series',label:'Séries',target:0,rows:(ex.detail?.length?ex.detail:[{poids:ex.poids,reps:ex.reps,rpe:ex.rpe}]).map(row)}];
}
function legacyWodResult(r){if(!r)return '';if(String(r.format).includes('AMRAP'))return (r.rounds||0)+' rounds + '+(r.reps||0)+' reps';if(String(r.format).includes('TIME'))return (r.min||0)+':'+String(r.sec||0).padStart(2,'0');return (r.score||0)+' reps / score';}
function migrate(raw){const out=blank(), old=parseOld(raw,'laforge_db',{}), log=parseOld(raw,'session_log',[]);const isPdc=e=>!!e.blocMode||/traction|dips|pompe/i.test(e.exercice_nom||e.nom||'');
 out.programs=(old.programmes||[]).map(p=>({id:p.id,name:p.nom||'Programme',sessions:(old.seances||[]).filter(s=>s.programme_id===p.id).sort((a,b)=>(a.ordre||0)-(b.ordre||0)).map(s=>({id:s.id,name:s.nom||'Séance',exercises:(old.seance_exercices||[]).filter(e=>e.seance_id===s.id&&e.type!=='wod').sort((a,b)=>(a.ordre||0)-(b.ordre||0)).map(e=>({id:e.id,name:e.type==='emom'?(e.emomConfig?.mouvement||e.exercice_nom||'Exercice'):e.exercice_nom||e.nom||'Exercice',mode:isPdc(e)?'pdc':'weight',blocks:[e.type==='emom'?{id:uid(),kind:'emom',label:'EMOM',count:Math.max(1,Math.min(60,Number(e.emomConfig?.duree)||10)),target:Number(e.emomConfig?.objectif)||5}:{id:uid(),kind:'series',label:e.blocMode?'Séries libres':'Séries',count:e.blocMode?1:Math.max(1,Math.min(30,Number(e.sets)||3)),target:Number(e.reps)||0}]}))}))}));
 out.activeProgram=out.programs[0]?.id||null;
 out.plan=parseOld(raw,'weekplan',[]).flatMap((x,i)=>x.type==='seance'&&out.programs.some(p=>p.sessions.some(s=>s.id===x.seance_id))?[{id:uid(),date:addDays(monday(dayKey()),i),kind:'workout',sessionId:x.seance_id,title:out.programs.flatMap(p=>p.sessions).find(s=>s.id===x.seance_id).name}]:[]);
 out.history=(Array.isArray(log)?log:[]).filter(h=>h.date&&Number.isFinite(Date.parse(h.date))).map(h=>({id:h.id||uid(),kind:['seance','libre'].includes(h.type)?'workout':h.type==='wod'?'wod':'run',title:h.nom||'Activité importée',date:dayKey(new Date(h.date)),startedAt:h.date,endedAt:h.date,duration:Number(h.dureeMin)||null,notes:h.notes||'',content:[h.wodInfo?.desc||'',...(h.wodItems||[]).map(w=>w.nom+' — '+(w.resume||''))].filter(Boolean).join('\n'),result:typeof h.result==='string'?h.result:legacyWodResult(h.wodResult),distance:null,exercises:[...(h.exercices||[]),...(h.emomItems||[]).map(e=>({nom:e.mouvement||e.nom,blocMode:true,blocs:[{kind:'emom',label:e.nom||'EMOM',emomData:{duree:e.duree,objectif:e.objectif,log:e.detail}}]}))].map(e=>({id:uid(),name:e.nom||'Exercice',mode:isPdc(e)?'pdc':'weight',blocks:oldBlocks(e)}))}));
 out.legacyMeasurements=(old.performances||[]).map(p=>({id:p.id||uid(),date:(p.date||p.created_at||'').slice(0,10),name:p.exercice_nom||(old.seance_exercices||[]).find(e=>e.id===p.seance_exercice_id)?.exercice_nom||'Exercice',blocks:oldBlocks(p)})).filter(p=>/^\d{4}-\d{2}-\d{2}$/.test(p.date));
 out.legacyArchive=raw;
 return out;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);validate(data);return data;}const old=localStorage.getItem('laforge_db'),hist=localStorage.getItem('session_log');if(old||hist){const raw={};['laforge_db','session_log','weekplan','pgx','pins','profil_v1','wod_perf_v1'].forEach(k=>{const v=localStorage.getItem(k);if(v)raw[k]=v;});migrationNotice=true;const migrated=migrate(raw);validate(migrated);return migrated;}return blank();}catch(e){blocked=true;storageError='Les données locales ne peuvent pas être lues. Elles sont conservées. Exporte-les depuis les réglages avant de restaurer une sauvegarde.';return blank();}}
function validate(s){
 const str=v=>typeof v==='string', arr=Array.isArray, num=v=>typeof v==='number'&&Number.isFinite(v), optnum=v=>v==null||num(v), text=v=>v==null||str(v), ident=v=>str(v)&&/^[a-zA-Z0-9_-]{1,120}$/.test(v), id=o=>o&&ident(o.id), date=v=>str(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(dayDate(v).getTime())&&dayKey(dayDate(v))===v;
 const timer=t=>t==null||(num(t.elapsed)&&t.elapsed>=0&&num(t.started)&&typeof t.running==='boolean');
 const optionalId=v=>v==null||ident(v), positiveInt=v=>Number.isInteger(v)&&v>0;
 const chain=c=>c==null||(id(c)&&str(c.name)&&['biset','superset'].includes(c.type)&&positiveInt(c.round)&&arr(c.members)&&c.members.length>=2&&c.members.every(str));
 const rest=r=>r==null||(typeof r.enabled==='boolean'&&Number.isInteger(r.seconds)&&r.seconds>=0&&r.seconds<=1800);
 const row=r=>r&&(r.warmup==null||typeof r.warmup==='boolean')&&(r.prefilled==null||typeof r.prefilled==='boolean')&&optionalId(r.id)&&chain(r.chain)&&(r.targetAtLog==null||(num(r.targetAtLog)&&r.targetAtLog>=0))&&(r.position==null||positiveInt(r.position))&&typeof r.done==='boolean'&&['weight','reps','rpe'].every(k=>r[k]===null||(num(r[k])&&r[k]>=0))&&(r.reps===null||Number.isInteger(r.reps))&&(r.rpe===null||(r.rpe>=1&&r.rpe<=10))&&(!r.done||(r.reps!==null&&r.weight!==null));
 const blocks=(bs,template)=>arr(bs)&&bs.every(b=>id(b)&&str(b.label)&&['series','emom'].includes(b.kind)&&num(b.target)&&b.target>=0&&(b.minutes==null||positiveInt(b.minutes))&&(template?Number.isInteger(b.count)&&b.count>=1&&b.count<=120:arr(b.rows)&&b.rows.every(row)&&timer(b.timer)));
 const groups=o=>o.groups==null||(arr(o.groups)&&o.groups.every(g=>id(g)&&rest(g.rest)&&str(g.name)&&['biset','superset'].includes(g.type))&&new Set(o.groups.map(g=>g.id)).size===o.groups.length&&(o.exercises||[]).every(e=>e.groupId==null||o.groups.some(g=>g.id===e.groupId)));
 const exs=(es,t)=>arr(es)&&es.every(e=>id(e)&&str(e.name)&&text(e.notes)&&rest(e.rest)&&optionalId(e.groupId)&&['pdc','weight'].includes(e.mode)&&blocks(e.blocks,t));
 if(!s||s.version!==2||!arr(s.programs)||!arr(s.plan)||!arr(s.history)||!arr(s.legacyMeasurements)||!s.settings||!num(s.settings.rest)||s.settings.rest<0||s.settings.rest>1800)throw Error('Format de sauvegarde incompatible');
 if(!s.programs.every(p=>id(p)&&str(p.name)&&arr(p.sessions)&&p.sessions.every(t=>id(t)&&str(t.name)&&exs(t.exercises,true)&&groups(t))))throw Error('Programmes invalides');
 if(!s.history.every(h=>id(h)&&str(h.title)&&['workout','wod','run'].includes(h.kind)&&date(h.date)&&exs(h.exercises||[],false)&&groups(h)&&['notes','content','result'].every(k=>text(h[k]))&&optnum(h.distance)&&optnum(h.duration)))throw Error('Historique invalide');
 if(s.draft&&(!id(s.draft)||!str(s.draft.title)||!date(s.draft.date)||!Number.isFinite(Date.parse(s.draft.startedAt))||!exs(s.draft.exercises,false)||!groups(s.draft)||!text(s.draft.notes)||!optnum(s.draft.restUntil)))throw Error('Séance en cours invalide');
 if(s.draft?.restedRounds!=null&&(!arr(s.draft.restedRounds)||!s.draft.restedRounds.every(str)))throw Error('Suivi des tours invalide');
 if(s.settings.autoRest!=null&&typeof s.settings.autoRest!=='boolean'||s.settings.prefill!=null&&typeof s.settings.prefill!=='boolean')throw Error('Réglages invalides');
 if(s.draft?.restContext!=null){const c=s.draft.restContext;if(!['exercise','group','manual'].includes(c.kind)||!num(c.startedAt)||!optionalId(c.id)||(c.seconds!=null&&(!num(c.seconds)||c.seconds<0||c.seconds>1800)))throw Error('Repos invalide');}
 if(s.historyEdit!=null){const q=s.historyEdit,h=q.snapshot;if(!id(q)||!str(q.original)||!h||h.id!==q.id||h.kind!=='workout'||!str(h.title)||!str(h.date)||!optnum(h.duration)||!text(h.notes)||!exs(h.exercises,false)||!groups(h))throw Error('Correction invalide');}
 if(!s.plan.every(p=>id(p)&&date(p.date)&&str(p.title)&&['workout','wod','run'].includes(p.kind)&&(p.sessionId==null||ident(p.sessionId))))throw Error('Planning invalide');
 if(!s.legacyMeasurements.every(m=>id(m)&&str(m.name)&&date(m.date)&&blocks(m.blocks,false)))throw Error('Anciennes performances invalides');
 const unique=xs=>new Set(xs.map(x=>x.id)).size===xs.length;
 if(!unique(s.programs)||!unique(s.programs.flatMap(p=>p.sessions))||!unique(s.plan)||!unique(s.history))throw Error('Identifiants en double');
}

let db=load();
let page='home',selectedDay=dayKey(),weekStart=monday(dayKey()),editSessionId=null,histFilter='all',weekExpanded=false,toastTimeout;
function persist(){if(blocked){showError();return false;}try{localStorage.setItem(KEY,JSON.stringify(db));storageError='';showError();return true;}catch(e){storageError='Enregistrement impossible sur cet appareil. Cette modification n’a pas été enregistrée. Libère de l’espace ou exporte tes données dans les réglages.';showError();return false;}}
function change(fn,redraw=true){const prev=clone(db);fn();if(!persist()){db=prev;render();return false;}if(redraw)render();return true;}
function showError(){$('#storage-alert').innerHTML=storageError?`<div class="banner">${esc(storageError)}</div>`:'';}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').hidden=true,3000);}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();}
function closeModal(){$('#dialog').close();}
const currentProgram=()=>db.programs.find(p=>p.id===db.activeProgram)||db.programs[0];
const sessions=()=>db.programs.flatMap(p=>p.sessions);
const session=id=>sessions().find(s=>s.id===id);
const editing=()=>session(editSessionId);
function goto(p){page=p;render();window.scrollTo({top:0});}
function render(){showError();$('#settings-btn').innerHTML=icon('settings');$('#nav').innerHTML=[['home','home','Accueil'],['program','program','Programme'],['start','plus','Séance'],['history','history','Historique'],['perf','perf','Perf']].map(([a,i,t])=>btn(a==='start'?`<span class="plus">${icon(i)}</span><span>${t}</span>`:icon(i)+`<span>${t}</span>`,'nav',`data-page="${a}" ${page===a?'aria-current="page"':''}`,page===a?'active':'')).join('');
 $('#exercise-list').innerHTML=[...new Set(CATALOG.concat(sessions().flatMap(s=>s.exercises.map(e=>e.name))))].map(n=>`<option value="${esc(n)}"></option>`).join('');
 $('#app').innerHTML=page==='home'?homeView():page==='program'?programView():page==='editor'?editorView():page==='workout'?workoutView():page==='history-edit'?historyEditView():page==='history'?historyView():page==='perf'?perfView():settingsView();tick();}
function stats(){const h=db.history.filter(h=>h.date>=weekStart&&h.date<addDays(weekStart,7));return {count:h.length,sets:h.reduce((n,h)=>n+(h.exercises||[]).reduce((n,e)=>n+e.blocks.reduce((n,b)=>n+b.rows.filter(r=>r.done&&!r.warmup).length,0),0),0),km:h.reduce((n,h)=>n+(h.kind==='run'?Number(h.distance)||0:0),0)};}
function activitySubtitle(h){if(h.kind==='workout')return `${(h.exercises||session(h.sessionId)?.exercises||[]).length} exercices`;if(h.kind==='run')return [h.distance?fmt(h.distance)+' km':null,h.duration?fmt(h.duration)+' min':null].filter(Boolean).join(' · ')||'Sortie course à pied';return h.result||'WOD personnel';}
function weekView(){const expanded=page!=='home'||weekExpanded;return `<div class="section"><h2>${icon('calendar')} Ta semaine</h2><div class="row week-controls">${ib('back','week','data-dir="-1"','Semaine précédente')}<span class="week-range">${dayDate(weekStart).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${dayDate(addDays(weekStart,6)).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span>${ib('next','week','data-dir="1"','Semaine suivante')}</div></div><div class="week">${Array.from({length:7},(_,i)=>{const k=addDays(weekStart,i),done=db.history.filter(h=>h.date===k),plans=db.plan.filter(p=>p.date===k&&!db.history.some(h=>h.planId===p.id)),entries=done.concat(plans),first=entries[0],label=first?.title||'Repos';return btn(`<span>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]}</span><strong>${dayDate(k).getDate()}</strong><span class="day-status ${done.length?'completed':plans.length?'planned':''}">${done.length?icon('check'):plans.length?icon('next'):''}</span><span class="day-caption ${first?'kind-'+first.kind:''}">${esc(label)}${entries.length>1?' +'+(entries.length-1):''}</span>`,'day',`data-date="${k}" title="${esc(dateLabel(k)+' : '+entries.map(e=>e.title).join(', '))}" aria-label="${esc(dateLabel(k)+' : '+(entries.map(e=>e.title).join(', ')||'Repos'))}" aria-pressed="${k===selectedDay}"`,'day'+(k===dayKey()?' today':'')+(k===selectedDay?' selected':'')+(done.length?' is-done':''));}).join('')}</div><div class="week-tools">${btn(icon('edit')+' Modifier ma semaine','week-expand','','text-btn')}${btn('+ Ajouter','plan',`data-date="${selectedDay}"`,'text-btn')}</div>${expanded?`<div class="card day-panel"><div class="row between"><div class="eyebrow" style="margin:0">${esc(dateLabel(selectedDay))}</div>${page==='home'?ib('close','week-expand','','Fermer le détail du jour'):''}</div>${agendaView(selectedDay)}</div>`:''}`;}

function agendaView(k){const hs=db.history.filter(h=>h.date===k),plans=db.plan.filter(p=>p.date===k&&!db.history.some(h=>h.planId===p.id));return plans.map(p=>`<div class="agenda-item"><div class="activity-icon ${p.kind}">${icon(p.kind)}</div><div class="grow"><h3>${esc(p.title)}</h3><p>Prévu · ${esc(activitySubtitle(p))}</p></div>${ib('edit','plan-edit',`data-id="${p.id}"`,'Modifier ou déplacer')}${ib('arrow','plan-start',`data-id="${p.id}"`,'Démarrer ou noter le résultat')}</div>`).join('')+hs.map(h=>`<div class="agenda-item"><div class="activity-icon ${h.kind}">${icon(h.kind)}</div><div class="grow"><h3>${esc(h.title)}</h3><p>${esc(activitySubtitle(h))}</p></div><span class="pill done">Fait</span>${ib('next','history-detail',`data-id="${h.id}"`,'Détail de l’activité')}</div>`).join('')+(!plans.length&&!hs.length?'<p class="muted" style="padding-top:18px">Journée libre. À toi de choisir.</p>':'');}
function progressRows(limit=4){const groups=new Map();for(const m of measurements()){const k=norm(m.name);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);}const all=[...groups.values()].sort((a,b)=>b.at(-1).date.localeCompare(a.at(-1).date)).slice(0,limit);return all.map(ms=>{const last=ms.at(-1),weighted=ms.some(m=>m.rows.some(r=>r.weight>0)),values=ms.slice(-12).map(m=>Math.max(...m.rows.map(r=>weighted?r.weight||0:r.reps||0))),pdc=last.mode==='pdc',latest=values.at(-1),previous=values.at(-2),delta=previous===undefined?null:Math.round((latest-previous)*10)/10,bestRow=last.rows.reduce((a,r)=>!a||r.weight>a.weight||r.weight===a.weight&&r.reps>a.reps?r:a,null);const detail=weighted?`${pdc?'+':''}${fmt(bestRow.weight)} kg · ${bestRow.reps} reps`:`${fmt(latest)} reps · PDC`;return `<div class="progress-row"><span class="progress-icon">${icon(pdc?'pdc':'workout')}</span><div><div class="progress-name">${esc(last.name)}</div><div class="progress-detail">${esc(detail)}</div></div><span class="progress-change ${delta<0?'negative':''}" title="Écart avec le précédent entraînement">${delta===null?'':delta===0?'Stable':`${delta>0?'↑ +':'↓ '}${fmt(delta)} ${weighted?'kg':'reps'}`}</span><div class="progress-spark">${values.length>=2?spark(values):'<span class="first-data">1 séance</span>'}</div></div>`;}).join('')||`<div class="card empty">${icon('perf')}Tes premières séances feront apparaître ici tes records et tes courbes.</div>`;}
function homeView(){const st=stats(),p=db.plan.find(p=>p.date===dayKey()&&!db.history.some(h=>h.planId===p.id)),suggested=!p&&!db.draft?currentProgram()?.sessions[0]:null;const title=db.draft?db.draft.title:p?p.title:suggested?suggested.name:'À toi de jouer.',sub=db.draft?`${db.draft.exercises.length} exercices · séance en cours`:p?activitySubtitle(p):suggested?`${suggested.exercises.length} exercices`:'Choisis une séance pour commencer.',action=db.draft?'resume':p?'plan-start':suggested?'session-start':'start',attrs=p?`data-id="${p.id}"`:suggested?`data-id="${suggested.id}"`:'';return `<div class="page-head home-head"><h1>Bonjour Félix</h1><p class="muted">${esc(dateLabel(dayKey()))}</p></div>${migrationNotice?'<div class="notice" style="margin-bottom:16px">Tes anciennes données disponibles sur cet appareil ont été reprises. Exporte une sauvegarde dans les réglages pour en garder une copie.</div>':''}<div class="home-layout"><div class="card hero ${!p&&!suggested&&!db.draft?'hero-empty':''}"><div><div class="hero-label">${db.draft?'Ta séance en cours':p?'Séance du jour':'Ton prochain entraînement'}</div><h2>${esc(title)}</h2><div class="hero-meta"><span>${icon('workout')}${esc(sub)}</span></div></div><div class="hero-actions">${btn((db.draft?'Reprendre':p||suggested?'Commencer':'Choisir ma séance')+' '+icon('next'),action,attrs)}${p&&!db.draft?btn('Changer','plan-edit',`data-id="${p.id}"`,'text-btn'):''}</div></div><div class="home-week">${weekView()}<div class="week-statline"><span><b>${st.count}</b> entraînements</span><span><b>${st.sets}</b> séries / min EMOM</span><span><b>${fmt(st.km)}</b> km courus</span></div></div><div class="home-progress"><div class="section"><h2>${icon('perf')} Ta progression</h2>${btn('Voir tout','nav','data-page="perf"','text-btn')}</div><div class="progress-list">${progressRows()}</div></div><div class="motivation"><img src="data:image/webp;base64,UklGRohOAABXRUJQVlA4IHxOAACQCwGdASpAAUABPok4lEelI6IlMvtZuKARCWdtk4ik9XxzTkATnOUlInY+RQdj function programView(){const p=currentProgram();return `<div class="page-head"><h1>Programme</h1><p class="muted">Tes séances. Une semaine qui s’adapte à toi.</p></div><div class="program-actions">${p?`<select aria-label="Programme actif" data-input="program-select">${db.programs.map(p=>`<option value="${p.id}" ${p.id===currentProgram().id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}${btn('+ Programme','program-add','','btn secondary')}</div>${p?`<div class="card program-overview"><div class="row between"><div><div class="eyebrow">Programme actuel</div><h2>${esc(p.name)}</h2><p class="muted" style="font-size:11px;margin-top:7px">${p.sessions.length} séances · planning libre</p></div><div class="row">${ib('edit','program-rename',`data-id="${p.id}"`,'Renommer le programme')}${ib('trash','program-delete',`data-id="${p.id}"`,'Supprimer le programme')}</div></div></div>${weekView()}<div class="section"><h2>Mes séances</h2>${ib('plus','session-add',`data-id="${p.id}"`,'Créer une séance')}</div><div>${p.sessions.map((s,i)=>`<div class="session-card"><div class="agenda-item"><div class="grow"><h3>${esc(s.name)}</h3><p>${s.exercises.length} exercices · ${s.exercises.reduce((n,e)=>n+e.blocks.reduce((n,b)=>n+b.count,0),0)} séries / min prévues</p></div>${ib('up','session-move',`data-id="${s.id}" data-dir="-1" ${i===0?'disabled':''}`,'Monter la séance')}${ib('edit','session-edit',`data-id="${s.id}"`,'Modifier la séance')}${ib('arrow','session-start',`data-id="${s.id}"`,'Commencer la séance')}</div></div>`).join('')||emptyState('Crée ta première séance avec les exercices de ton choix.')}</div>${btn('+ Créer une séance','session-add',`data-id="${p.id}"`,'btn secondary full')}`:emptyState('Donne un nom à ton programme, puis crée tes séances.',btn('Créer mon programme','program-add'))}`;}

function editorView(){const s=editing();if(!s)return emptyState('Cette séance n’existe plus.',btn('Mes programmes','nav','data-page="program"'));return `<div class="page-head"><div class="row between">${btn(icon('back')+' Programme','nav','data-page="program"','text-btn')}${btn('Supprimer','session-delete',`data-id="${s.id}"`,'text-btn danger-text')}</div><h1>${esc(s.name)}</h1><div class="row between"><p class="muted">Les changements sont enregistrés automatiquement.</p>${ib('edit','session-rename',`data-id="${s.id}"`,'Renommer la séance')}</div></div>${groupOverview(s,'template')}<div class="session-tools">${btn('+ Biset / superset','group-add','data-scope="template"','btn secondary')}</div><div class="stack">${s.exercises.map((e,i)=>`<div class="card"><div class="exercise-head"><div class="grow"><div class="eyebrow">${i+1} · ${e.mode==='pdc'?'Poids du corps':'Musculation'}</div><h3>${esc(e.name)}</h3>${groupBadge(s,e)}</div>${ib('up','exercise-move',`data-scope="template" data-ex="${i}" data-dir="-1" ${i===0?'disabled':''}`,'Monter l’exercice')}${ib('down','exercise-move',`data-scope="template" data-ex="${i}" data-dir="1" ${i===s.exercises.length-1?'disabled':''}`,'Descendre l’exercice')}${ib('trash','exercise-delete',`data-scope="template" data-ex="${i}"`,'Retirer l’exercice')}</div>${exerciseNotebook(s,e,'template',i)}${e.blocks.map((b,j)=>`<div class="template-block"><div class="row between"><div><b>${esc(b.label)}</b><p class="muted">${b.kind==='emom'?`${b.count} min · objectif ${b.target} reps / min`:`${b.count} séries${b.target?' · '+b.target+' reps':''}`}</p></div><div class="row">${ib('up','block-move',`data-scope="template" data-ex="${i}" data-block="${j}" data-dir="-1" ${j===0?'disabled':''}`,'Monter le bloc')}${ib('edit','block-edit',`data-scope="template" data-ex="${i}" data-block="${j}"`,'Modifier le bloc')}${ib('trash','block-delete',`data-scope="template" data-ex="${i}" data-block="${j}"`,'Retirer le bloc')}</div></div></div>`).join('')}<div class="row between wrap">${btn('+ Ajouter un bloc','block-add',`data-scope="template" data-ex="${i}"`,'text-btn')}${btn(e.groupId?'Modifier l’enchaînement':'Associer à un exercice','group-exercise',`data-scope="template" data-ex="${i}"`,'text-btn')}</div></div>`).join('')||emptyState('Ajoute un exercice pour commencer.')}</div><div class="foot-actions">${btn('+ Ajouter un exercice','exercise-add','data-scope="template"','btn secondary')}${btn('Terminé','nav','data-page="program"')}</div><p class="muted" style="font-size:12px;margin-top:15px">Tu pourras ajouter ou enlever des séries pendant l’entraînement. Les anciennes séances gardent leur contenu.</p>`;}
function startPicker(){if(db.draft){modal('Une séance en cours',`<div class="notice">${esc(db.draft.title)} est en cours. Termine-la ou abandonne-la avant d’en démarrer une autre.</div>${btn('Reprendre','resume','','btn full')}`);return;}const ss=currentProgram()?.sessions||[];modal('Qu’est-ce qu’on fait ?',`${ss.map(s=>btn(`<div class="activity-icon">${icon('workout')}</div><div><b>${esc(s.name)}</b><small>${s.exercises.length} exercices</small></div>`,'session-start',`data-id="${s.id}"`,'choice')).join('')}${btn(icon('plus')+'<div><b>Séance libre</b><small>Ajoute tes exercices au fil de l’entraînement</small></div>','free-start','','choice')}${btn(icon('wod')+'<div><b>Noter un WOD</b><small>Contenu, résultat et ressenti</small></div>','activity','data-kind="wod"','choice')}${btn(icon('run')+'<div><b>Noter une course</b><small>Distance, durée et ressenti</small></div>','activity','data-kind="run"','choice')}`);}
function nameDialog(title,value,action,attrs=''){modal(title,`<form data-form="${action}" ${attrs}><label class="label" for="name">Nom</label><input id="name" name="name" maxlength="100" required value="${esc(value)}" autocomplete="off"><button class="btn full" style="margin-top:20px">Enregistrer</button></form>`);}
function exDialog(scope){modal('Ajouter un exercice',`<form data-form="exercise" data-scope="${scope}"><label class="label" for="ex-name">Exercice</label><input id="ex-name" name="name" list="exercise-list" placeholder="Tractions, développé couché…" maxlength="100" required autocomplete="off"><label class="label" for="ex-mode">Charge à noter</label><select id="ex-mode" name="mode"><option value="weight">Musculation · poids total</option><option value="pdc">Poids du corps · lest ajouté (0 = sans lest)</option></select><div class="form-grid"><div><label class="label" for="ex-count">Séries prévues</label><input id="ex-count" name="count" type="number" min="1" max="30" value="3" required></div><div><label class="label" for="ex-target">Reps visées (facultatif)</label><input id="ex-target" name="target" type="number" min="1" max="999" placeholder="Ex. 8"></div></div><button class="btn full" style="margin-top:20px">Ajouter l’exercice</button></form>`);}
function scopeSession(scope){return scope==='template'?editing():db.draft;}
function classicRows(e){return e.blocks.filter(b=>b.kind==='series').flatMap(b=>(b.rows||[]).filter(r=>!r.warmup));}
function groupFor(s,e){return (s.groups||[]).find(g=>g.id===e.groupId)||null;}
function groupMembers(s,g){return s.exercises.filter(e=>e.groupId===g.id);}
function groupType(g){return g.type==='biset'?'Biset':'Superset';}
function cleanGroups(s){if(!s)return;s.groups=(s.groups||[]).filter(g=>groupMembers(s,g).length>=2);const ids=new Set(s.groups.map(g=>g.id));s.exercises.forEach(e=>{if(e.groupId&&!ids.has(e.groupId))e.groupId=null;});}
function groupStamp(s,g,index){return {id:g.id,name:g.name,type:g.type,round:index+1,members:groupMembers(s,g).filter(e=>classicRows(e)[index]).map(e=>e.name)};}
function applyLoggedGroup(s,g){groupMembers(s,g).forEach(e=>classicRows(e).forEach((r,i)=>{if(r.done){const stamp=groupStamp(s,g,i);if(stamp.members.length>=2)r.chain=stamp;}}));}
function groupOverview(s,scope){return (s.groups||[]).map(g=>{const members=groupMembers(s,g);if(members.length<2)return '';return `<div class="group-overview"><div class="row between"><div class="grow"><span class="pill">${groupType(g)}</span> <b>${esc(g.name)}</b></div>${btn('Modifier','group-edit',`data-scope="${scope}" data-id="${g.id}"`,'text-btn')}</div><p class="group-sequence">${members.map((e,i)=>`<span>${i+1}. ${esc(e.name)}</span>`).join('<span class="chain-arrow" aria-hidden="true">→</span>')}</p><p class="muted group-rest">${icon('clock')} Repos après ${esc(members.at(-1).name)}, une fois le tour validé.</p></div>`;}).join('');}

function afterSeriesValidation(ex,bl,r){const d=db.draft;if(!d||!r.done||bl.kind==='emom')return '';const g=r.warmup?null:groupFor(d,ex);if(!g){startAutoRest(ex);return '';}
 const index=classicRows(ex).indexOf(r),members=groupMembers(d,g).filter(e=>classicRows(e)[index]);if(members.length<2){startAutoRest(ex);return 'Série supplémentaire hors enchaînement.';}r.chain=groupStamp(d,g,index);members.forEach(e=>{const row=classicRows(e)[index];if(!row.id)row.id=uid();});const last=members.at(-1),complete=members.every(e=>classicRows(e)[index].done);const key=g.id+':'+members.map(e=>classicRows(e)[index].id).join(':');d.restedRounds=d.restedRounds||[];

function emomDuration(b){return Number.isInteger(b.minutes)&&b.minutes>=1?b.minutes:b.rows.length;}

function blockDialog(scope,ei,bi=null){const e=scopeSession(scope)?.exercises[ei];if(!e)return;const b=bi===null?null:e.blocks[bi];modal(b?'Modifier le bloc':'Ajouter un bloc',`<form data-form="block" data-scope="${scope}" data-ex="${ei}" data-block="${bi??''}"><label class="label" for="block-kind">Format</label><select id="block-kind" name="kind" data-input="block-kind"><option value="series" ${b?.kind!=='emom'?'selected':''}>Séries · classique, pyramide ou libre</option><option value="emom" ${b?.kind==='emom'?'selected':''}>EMOM · une série par minute</option></select><label class="label" for="block-label">Nom du bloc</label><input id="block-label" name="label" maxlength="80" placeholder="Pyramide, Lesté, 4 × 6…" value="${esc(b?.label||'')}"><div class="form-grid"><div><label class="label" id="block-count-label" for="block-count">Nombre de séries</label><input id="block-count" name="count" type="number" min="1" max="120" value="${scope==='draft'&&b?(b.kind==='emom'?emomDuration(b):b.rows.length):b?.count||3}" required></div><div><label class="label" id="block-target-label" for="block-target">Objectif reps</label><input id="block-target" name="target" type="number" min="0" max="999" value="${b?.target||''}" placeholder="Facultatif"></div></div><p class="muted" id="block-help" style="font-size:12px;margin-top:13px"></p><button class="btn full" style="margin-top:20px">${b?'Enregistrer':'Ajouter le bloc'}</button></form>`);syncBlockLabels();}
function handleBlockSubmit(v,x){const ex=targetExercises(x.scope)?.[Number(x.ex)];if(!ex)return false;const old=x.block!==''?ex.blocks[Number(x.block)]:null,count=Number(v.count),target=Number(v.target)||0;if(!Number.isInteger(count)||count<1||count>120||target<0||target>999||(v.kind==='emom'&&target<1)){toast('Vérifie la durée et l’objectif de reps.');return false;}

function historyChainSummary(h){const groups=new Map();for(const e of h.exercises||[])for(const b of e.blocks)for(const r of b.rows){if(r.chain){const key=r.chain.id+'|'+r.chain.members.join('|');if(!groups.has(key))groups.set(key,r.chain);}}return [...groups.values()].map(g=>`<div class="history-chain"><span class="pill">${groupType(g)}</span><b>${esc(g.name)}</b><p>${g.members.map(esc).join(' → ')}</p></div>`).join('');}

function previousExercise(e){return db.history.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||'')).flatMap(h=>(h.exercises||[]).filter(x=>norm(x.name)===norm(e.name)&&x.mode===e.mode).map(x=>({exercise:x,date:h.date}))).at(0);}

function restDialog(scope,id,forceKind=null){const s=scopeSession(scope);if(!s)return;const e=s.exercises.find(e=>e.id===id),g=forceKind==='group'?(s.groups||[]).find(g=>g.id===id):e&&forceKind!=='exercise'?groupFor(s,e):null,obj=g||e;if(!obj)return;const rule=obj.rest;modal('Repos · '+obj.name,`<form data-form="rest-config" data-scope="${scope}" data-id="${obj.id}" data-kind="${g?'group':'exercise'}"><label class="label" for="rest-mode">Déclenchement automatique</label><select id="rest-mode" name="mode"><option value="inherit" ${!rule?'selected':''}>${g?'Suivre le dernier exercice':'Suivre le réglage général'}</option><option value="custom" ${rule?.enabled?'selected':''}>Activer un repos personnalisé</option><option value="off" ${rule&&!rule.enabled?'selected':''}>Désactiver pour cet ${g?'enchaînement':'exercice'}</option></select><label class="label" for="custom-rest">Durée personnalisée (secondes)</label><input id="custom-rest" type="number" name="seconds" min="1" max="1800" step="1" required value="${rule?.seconds||db.settings.rest||120}"><p class="muted" style="margin-top:12px">${g?'Le repos démarre après le dernier exercice du tour. ':''}Si le chrono tourne, la durée est ajustée depuis son départ.${db.settings.autoRest===false?' Le repos automatique général est actuellement désactivé.':''}</p><button class="btn full" style="margin-top:18px">Enregistrer</button></form>`);}

function startWorkout(sid=null,pid=null){if(db.draft){startPicker();return;}const s=sid?session(sid):null;if(sid&&!s){toast('Cette séance n’existe plus. Modifie le planning.');return;}const draft={id:uid(),kind:'workout',title:s?.name||'Séance libre',sessionId:sid,planId:pid,date:dayKey(),startedAt:new Date().toISOString(),notes:'',groups:clone(s?.groups||[]),exercises:(s?.exercises||[]).map(instantiate),restUntil:null,restedRounds:[]};if(change(()=>db.draft=draft,false)){closeModal();goto('workout');}}

 for(const m of db.legacyMeasurements){if(!db.history.some(h=>h.date===m.date&&(h.exercises||[]).some(e=>norm(e.name)===norm(m.name)))){out.push({date:m.date,name:m.name,mode:/traction|dips|pompe/i.test(m.name)?'pdc':'weight',rows:m.blocks.flatMap(b=>b.rows.filter(r=>r.done&&!r.warmup)),blocks:m.blocks});}}

function historyView(){const h=db.history.filter(h=>histFilter==='all'||h.kind===histFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||''));return `<div class="page-head"><div class="eyebrow">Ce que tu as fait</div><h1>Ton historique.</h1><p class="muted">Chaque séance, avec son vrai contenu.</p></div>${db.historyEdit?`<div class="notice">Correction en cours : ${esc(db.historyEdit.snapshot.title)} ${btn('Reprendre','nav','data-page="history-edit"','text-btn')}</div>`:''}<div class="tabs">${[['all','Tout'],['workout','Muscu / PDC'],['wod','WOD'],['run','Course']].map(([k,t])=>btn(t,'hist-filter',`data-kind="${k}"`,histFilter===k?'active':'')).join('')}</div><div class="stack">${h.map(h=>`<article class="card"><div class="row"><div class="activity-icon ${h.kind}">${icon(h.kind)}</div><div class="grow"><div class="eyebrow">${esc(dateLabel(h.date))}</div><h3>${esc(h.title)}</h3></div>${ib('next','history-detail',`data-id="${h.id}"`,'Voir le détail')}</div><div class="history-summary"><span>${esc(activitySubtitle(h))}</span>${h.kind==='workout'&&h.duration?`<span>${fmt(h.duration)} min</span>`:''}</div>${historyChainSummary(h)}${(h.exercises||[]).slice(0,3).map(e=>`<div class="history-ex"><b style="font-size:13px">${esc(e.name)}</b><p>${esc(e.blocks.flatMap(b=>b.rows.map(r=>rowSummary(r,e.mode))).join(' / '))}</p></div>`).join('')}${h.exercises?.length>3?`<p class="muted" style="font-size:12px;margin-top:12px">+ ${h.exercises.length-3} exercices dans le détail</p>`:''}${h.kind==='wod'&&h.content?`<p class="muted" style="margin-top:12px;white-space:pre-wrap">${esc(h.content)}</p>`:''}</article>`).join('')||emptyState('Tes entraînements apparaîtront ici une fois enregistrés.',btn('Ajouter un entraînement','start'))}</div>`;}
function historyDetail(id){const h=db.history.find(h=>h.id===id);if(!h)return;modal(h.title,`<p class="muted" style="margin-top:15px">${esc(dateLabel(h.date))}${h.duration?' · '+fmt(h.duration)+' min':''}${h.distance?' · '+fmt(h.distance)+' km':''}</p>${h.kind==='run'&&h.distance&&h.duration?`<div class="notice">Allure moyenne : ${timeFmt(Math.round(h.duration*60/h.distance))} / km</div>`:''}${h.content?`<p style="white-space:pre-wrap;margin-top:15px">${esc(h.content)}</p>`:''}${h.result?`<div class="notice"><b>Résultat :</b> ${esc(h.result)}</div>`:''}${historyChainSummary(h)}${(h.exercises||[]).map(e=>`<div class="history-ex"><h3>${esc(e.name)}</h3>${e.notes?`<p class="exercise-note">${esc(e.notes)}</p>`:''}${e.blocks.map(b=>`<div style="margin-top:12px"><span class="pill subtle">${esc(b.label)}${b.kind==='emom'?' · EMOM · '+(b.minutes||b.rows.length)+' min prévues':''}</span>${b.rows.map((r,i)=>`<p>${b.kind==='emom'?'Minute':'Série'} ${r.position||i+1} — ${esc(rowSummary(r,e.mode))}${r.chain?`<span class="history-row-chain">${esc(r.chain.name)} · tour ${r.chain.round}</span>`:''}${b.kind==='emom'&&r.targetAtLog?`<span class="history-row-chain">Objectif noté : ${r.targetAtLog} reps</span>`:''}</p>`).join('')}</div>`).join('')}</div>`).join('')}${h.notes?`<hr class="rule"><div class="eyebrow">Notes</div><p style="white-space:pre-wrap">${esc(h.notes)}</p>`:''}<div class="foot-actions">${btn('Modifier',h.kind==='workout'?'history-edit':'activity-edit',`data-id="${h.id}"`,'btn secondary')}${btn('Supprimer','history-delete',`data-id="${h.id}"`,'btn danger')}</div>`);}
function spark(values){if(values.length<2)return '<div class="muted" style="font-size:12px;margin:20px 0">La courbe apparaîtra après un deuxième entraînement.</div>';const min=Math.min(...values),max=Math.max(...values),range=max-min||1,pts=values.map((v,i)=>[6+i*288/(values.length-1),54-(v-min)/range*43]),points=pts.map(p=>p.join(',')).join(' ');return `<svg class="spark" viewBox="0 0 300 65" role="img" aria-label="Évolution : ${values.map(fmt).join(', ')}"><path d="M6 57H294" stroke="#edf0f5" fill="none"/><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--blue)"/>`).join('')}</svg>`;}
function performanceCards(limit=Infinity){const groups=new Map();for(const m of measurements()){const k=norm(m.name);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);}const all=[...groups.values()].sort((a,b)=>b.at(-1).date.localeCompare(a.at(-1).date)).slice(0,limit);return all.map(ms=>{const last=ms.at(-1),rows=ms.flatMap(m=>m.rows),weighted=rows.some(r=>r.weight>0);const best=rows.reduce((best,r)=>!best||(weighted?(r.weight>best.weight||(r.weight===best.weight&&r.reps>best.reps)):r.reps>best.reps)?r:best,null);const values=ms.slice(-12).map(m=>Math.max(...m.rows.map(r=>weighted?r.weight||0:r.reps||0)));const pdc=last.mode==='pdc';return `<div class="card"><div class="eyebrow">${pdc?'Poids du corps':'Musculation'} · ${ms.length} entraînements</div><h3>${esc(last.name)}</h3><div class="row between" style="margin-top:17px"><div class="perf-value">${weighted&&pdc?'+':''}${fmt(weighted?best.weight:best.reps)} <small>${weighted?'kg':'reps'}</small></div><span class="pill done">${weighted?'Charge maximale':'Meilleure série'}</span></div>${weighted?`<p class="muted" style="font-size:12px;margin-top:4px">${best.reps} reps à cette charge${pdc?' · lest ajouté':''}</p>`:''}${spark(values)}<div class="row between muted" style="font-size:10px"><span>${dayDate(ms.slice(-12)[0].date).toLocaleDateString('fr-FR')}</span><span>${dayDate(last.date).toLocaleDateString('fr-FR')}</span></div><p class="muted" style="font-size:12px;margin-top:13px">Courbe : ${weighted?'charge maximale':'maximum de reps par série'} à chaque entraînement.</p></div>`;}).join('')||emptyState('Tes records et tes courbes se construiront au fil de tes séances.');}

function exportData(){const payload=blocked?{app:'LaForge',version:1,exportedAt:new Date().toISOString(),data:{[KEY]:localStorage.getItem(KEY),laforge_db:localStorage.getItem('laforge_db'),session_log:localStorage.getItem('session_log')}}:{app:'LaForge',version:2,exportedAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='laforge-sauvegarde-'+dayKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);if(!blocked)change(()=>db.settings.lastExport=new Date().toISOString());toast('Fichier de sauvegarde préparé. Garde-le dans tes fichiers.');}
async function importData(file){if(!file)return;try{const p=JSON.parse(await file.text());let s;if(p.app!=='LaForge'||!p.data)throw Error('Ce fichier n’est pas une sauvegarde LaForge.');if(p.version===2){s=p.data;validate(s);}else if(p.version===1&&p.data[KEY]){s=JSON.parse(p.data[KEY]);validate(s);}else if(p.version===1&&(p.data.laforge_db||p.data.session_log)){s=migrate(p.data);validate(s);}else throw Error('Format non reconnu.');if(!confirm(`Restaurer cette sauvegarde (${s.programs.length} programmes, ${s.history.length} activités) ? Les données actuelles de cette version seront remplacées.`))return;localStorage.setItem(KEY,JSON.stringify(s));db=s;blocked=false;storageError='';migrationNotice=false;closeModal();goto('home');toast('Sauvegarde restaurée.');}catch(e){toast('Import impossible : '+e.message);}finally{$('#import-file').value='';}}
function tick(){const d=db.draft;if(!d||page!=='workout')return;const elapsed=$('#elapsed');if(elapsed)elapsed.textContent=Math.floor((Date.now()-Date.parse(d.startedAt))/60000)+' min';const rest=$('#rest-display');if(rest){const left=d.restUntil?Math.max(0,Math.ceil((d.restUntil-Date.now())/1000)):0;rest.innerHTML=left?`<div class="timer" style="margin:10px 0 0"><span>Repos</span><strong>${timeFmt(left)}</strong><div>${btn('Modifier','rest-active-edit','','text-btn')}${btn('Arrêter','rest-stop','','text-btn')}</div></div>`:'';}
 d.exercises.forEach((e,ei)=>e.blocks.forEach((b,bi)=>{if(b.kind!=='emom')return;const el=document.querySelector(`[data-emom-display="${b.id}"]`);if(!el)return;const t=b.timer;if(!t){el.textContent='Prêt';return;}const seconds=Math.floor(emomElapsed(b)/1000),duration=emomDuration(b)*60,done=seconds>=duration;el.textContent=done?'Terminé':`Min ${Math.floor(seconds/60)+1} / ${emomDuration(b)} · ${timeFmt(60-seconds%60)}${t.running?'':' · pause'}`;const button=document.querySelector(`[data-action="emom-toggle"][data-ex="${ei}"][data-block="${bi}"]`);if(button)button.textContent=done?'Recommencer':t.running?'Pause':'Reprendre';}));}

 else if(a==='history-warmup'||a==='history-row-add'||a==='history-row-delete'){const bl=db.historyEdit?.snapshot.exercises[ei]?.blocks[bi];if(!bl)return;if(a==='history-row-delete'&&!confirm('Retirer cette série de la correction ?'))return;change(()=>{if(a==='history-warmup'){bl.rows[ri].warmup=!bl.rows[ri].warmup;delete bl.rows[ri].chain;}else if(a==='history-row-add'){if(bl.rows.length>=120)return;const r=freshRow();r.position=Math.max(0,...bl.rows.map((r,i)=>r.position||i+1))+1;bl.rows.push(r);}else bl.rows.splice(ri,1);});}
 else if(a==='close')closeModal();
 else if(a==='settings')goto('settings');
 else if(a==='start')startPicker();
 else if(a==='resume'){closeModal();goto('workout');}
 else if(a==='week'){weekStart=addDays(weekStart,Number(x.dir)*7);selectedDay=weekStart;render();}
 else if(a==='day'){selectedDay=x.date;weekExpanded=true;render();}
 else if(a==='week-expand'){weekExpanded=!weekExpanded;render();}
 else if(a==='program-add')nameDialog('Créer un programme','','program-add');
 else if(a==='program-rename')nameDialog('Renommer le programme',db.programs.find(p=>p.id===x.id)?.name||'','program-rename',`data-id="${x.id}"`);
 else if(a==='program-delete'){if(confirm('Supprimer ce programme et ses séances prévues ? L’historique et la séance en cours sont conservés.'))change(()=>{const ids=db.programs.find(p=>p.id===x.id).sessions.map(s=>s.id);db.programs=db.programs.filter(p=>p.id!==x.id);db.plan=db.plan.filter(p=>!ids.includes(p.sessionId));db.activeProgram=db.programs[0]?.id||null;});}
 else if(a==='session-add')nameDialog('Créer une séance','','session-add',`data-id="${x.id}"`);
 else if(a==='session-rename')nameDialog('Renommer la séance',session(x.id)?.name||'','session-rename',`data-id="${x.id}"`);
 else if(a==='session-edit'){editSessionId=x.id;goto('editor');}
 else if(a==='session-delete'){if(confirm('Supprimer cette séance du programme et du planning ? Les séances déjà réalisées sont conservées.')){if(change(()=>{db.programs.forEach(p=>p.sessions=p.sessions.filter(s=>s.id!==x.id));db.plan=db.plan.filter(p=>p.sessionId!==x.id);},false))goto('program');}}
 else if(a==='session-move')change(()=>{const ss=db.programs.find(p=>p.sessions.some(s=>s.id===x.id)).sessions,i=ss.findIndex(s=>s.id===x.id),j=i+Number(x.dir);if(j>=0&&j<ss.length)[ss[i],ss[j]]=[ss[j],ss[i]];});
 else if(a==='session-start')startWorkout(x.id);
 else if(a==='free-start')startWorkout();
 else if(a==='exercise-add')exDialog(x.scope);
 else if(a==='exercise-move'){if(e)change(()=>{const j=ei+Number(x.dir);if(j>=0&&j<exercises.length)[exercises[ei],exercises[j]]=[exercises[j],exercises[ei]];if(x.scope==='draft')refreshRest();});}
 else if(a==='exercise-delete'){if(e&&confirm(`Retirer ${e.name} ${x.scope==='draft'?'de cette séance uniquement':'du programme'} ?`))change(()=>{exercises.splice(ei,1);cleanGroups(scopeSession(x.scope));if(x.scope==='draft')refreshRest();});}
 else if(a==='block-move'){if(e)change(()=>{const j=bi+Number(x.dir);if(j>=0&&j<e.blocks.length)[e.blocks[bi],e.blocks[j]]=[e.blocks[j],e.blocks[bi]];});}
 else if(a==='group-add')groupDialog(x.scope);
 else if(a==='group-edit')groupDialog(x.scope,x.id);
 else if(a==='group-exercise'){if(e)groupDialog(x.scope,e.groupId||null,ei);}
 else if(a==='group-delete'){const ss=scopeSession(x.scope);if(ss&&confirm('Dissocier ces exercices pour les prochaines séries ? Les indications déjà notées restent dans l’historique.')){if(change(()=>{ss.groups=(ss.groups||[]).filter(g=>g.id!==x.id);ss.exercises.forEach(e=>{if(e.groupId===x.id)e.groupId=null;});}))closeModal();}}
 else if(a==='block-add')blockDialog(x.scope,ei);
 else if(a==='block-edit')blockDialog(x.scope,ei,bi);
 else if(a==='block-delete'){if(b&&confirm('Retirer ce bloc et ses séries ?'))change(()=>e.blocks.splice(bi,1));}
 else if(a==='row-add'){const ex=db.draft?.exercises[ei],bl=ex?.blocks[bi];if(bl){if(bl.rows.length>=120){toast('Limite de 120 lignes par bloc. Ajoute un autre bloc.');return;}change(()=>{settleEmom(bl);bl.rows.push(freshRow(bl.rows.at(-1)?.weight??(ex.mode==='pdc'?0:null)));if(bl.kind==='emom')bl.minutes=bl.rows.length;});}}
 else if(a==='row-delete'){const ex=db.draft?.exercises[ei],bl=ex?.blocks[bi];if(!bl)return;if(bl.rows.length===1){toast('Garde une ligne ou retire le bloc entier.');return;}if(!recordedRow(bl.rows[ri],ex.mode)||confirm('Retirer cette série et ses valeurs ?'))change(()=>{settleEmom(bl);bl.rows.splice(ri,1);if(bl.kind==='emom')bl.minutes=bl.rows.length;settleEmom(bl);});}
 else if(a==='row-check'){const ex=db.draft?.exercises[ei],bl=ex?.blocks[bi],r=bl?.rows[ri];if(!r)return;if([...el.closest('.set-grid').querySelectorAll('input')].some(i=>!i.checkValidity())){toast('Corrige les valeurs de cette série avant de la valider.');return;}if(!r.done&&(r.reps===null||!Number.isInteger(r.reps)||r.reps<0||r.weight===null||r.weight<0||(r.rpe!==null&&(r.rpe<1||r.rpe>10)))){toast('Renseigne la charge (0 si PDC) et les reps. RPE facultatif : 1 à 10.');return;}let message='';const saved=change(()=>{r.done=!r.done;if(!r.id)r.id=uid();if(r.done){r.prefilled=false;r.targetAtLog=bl.target;message=afterSeriesValidation(ex,bl,r);}});if(saved&&message)toast(message);}
 else if(a==='draft-name')nameDialog('Nom de cette séance',db.draft?.title||'','draft-name');
 else if(a==='finish')finishWorkout();
 else if(a==='finish-confirm')finishConfirm();
 else if(a==='abandon'){if(confirm('Abandonner la séance en cours et ses séries ?'))if(change(()=>db.draft=null,false))goto('home');}
 else if(a==='rest'){if(db.draft)change(()=>{const seconds=db.settings.rest||120;db.draft.restContext={kind:'manual',startedAt:Date.now(),seconds};db.draft.restUntil=Date.now()+seconds*1000;});}
 else if(a==='rest-stop')change(()=>{db.draft.restUntil=null;db.draft.restContext=null;});
 else if(a==='emom-toggle'){const bl=db.draft?.exercises[ei]?.blocks[bi];if(bl)change(()=>{settleEmom(bl);if(!bl.timer||emomElapsed(bl)>=emomDuration(bl)*60000)bl.timer={elapsed:0,started:Date.now(),running:true};else if(bl.timer.running){bl.timer.elapsed=emomElapsed(bl);bl.timer.running=false;}else{bl.timer.started=Date.now();bl.timer.running=true;}});}
 else if(a==='emom-reset'){const bl=db.draft?.exercises[ei]?.blocks[bi];if(bl)change(()=>bl.timer=null);}
 else if(a==='plan')planDialog(x.date||selectedDay);
 else if(a==='plan-edit')planDialog(null,x.id);
 else if(a==='plan-delete'){if(confirm('Retirer cet entraînement du planning ?'))if(change(()=>db.plan=db.plan.filter(p=>p.id!==x.id)))closeModal();}
 else if(a==='plan-start'){const p=db.plan.find(p=>p.id===x.id);if(!p)return;if(p.kind==='workout'){startWorkout(p.sessionId||null,p.id);if(db.draft?.planId===p.id&&!p.sessionId)change(()=>db.draft.title=p.title);}else activityDialog(p.kind,null,p.id);}
 else if(a==='activity')activityDialog(x.kind);
 else if(a==='activity-edit'){const h=db.history.find(h=>h.id===x.id);if(h)activityDialog(h.kind,h.id);}
 else if(a==='hist-filter'){histFilter=x.kind;render();}
 else if(a==='history-detail')historyDetail(x.id);
 else if(a==='history-delete'){if(confirm('Supprimer cette activité de l’historique ? Ses performances seront retirées aussi.'))if(change(()=>{removeLegacyFor(db.history.find(h=>h.id===x.id));db.history=db.history.filter(h=>h.id!==x.id);if(db.historyEdit?.id===x.id)db.historyEdit=null;}))closeModal();}
 else if(a==='export')exportData();
 else if(a==='import')$('#import-file').click();
});
document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();const fd=new FormData(f),v=Object.fromEntries(fd),x=f.dataset,a=x.form;const name=(v.name||'').trim();let ok=false;
 if(a==='program-add'){if(!name)return;ok=change(()=>{const p={id:uid(),name,sessions:[]};db.programs.push(p);db.activeProgram=p.id;},false);if(ok)goto('program');}
 else if(a==='program-rename'){if(!name)return;ok=change(()=>db.programs.find(p=>p.id===x.id).name=name);}
 else if(a==='session-add'){if(!name)return;ok=change(()=>{const s={id:uid(),name,exercises:[]};db.programs.find(p=>p.id===x.id).sessions.push(s);editSessionId=s.id;},false);if(ok)goto('editor');}
 else if(a==='session-rename'){if(!name)return;ok=change(()=>{session(x.id).name=name;db.plan.filter(p=>p.sessionId===x.id).forEach(p=>p.title=name);});}
 else if(a==='draft-name'){if(!name)return;ok=change(()=>db.draft.title=name);}
 else if(a==='exercise'){if(!name)return;const ex={id:uid(),name,mode:v.mode,blocks:[{id:uid(),kind:'series',label:'Séries',count:Number(v.count),target:Number(v.target)||0}]};ok=change(()=>targetExercises(x.scope).push(x.scope==='draft'?instantiate(ex):ex));}
 else if(a==='rest-config'){const ss=scopeSession(x.scope),obj=x.kind==='group'?(ss?.groups||[]).find(g=>g.id===x.id):ss?.exercises.find(e=>e.id===x.id);if(!obj)return;const seconds=Number(v.seconds);if(!Number.isInteger(seconds)||seconds<1||seconds>1800)return;ok=change(()=>{obj.rest=v.mode==='inherit'?null:{enabled:v.mode!=='off',seconds};if(x.scope==='draft')refreshRest();});}
 else if(a==='manual-rest'){const seconds=Number(v.seconds);if(!db.draft||!Number.isInteger(seconds)||seconds<1||seconds>1800)return;ok=change(()=>{const startedAt=db.draft.restContext?.startedAt||Date.now();db.draft.restContext={kind:'manual',startedAt,seconds};db.draft.restUntil=startedAt+seconds*1000;});}
 else if(a==='history-save')ok=saveHistoryEdit();
 else if(a==='block')ok=handleBlockSubmit(v,x);
 else if(a==='group')ok=handleGroupSubmit(f,v,x);
 else if(a==='plan'){const old=db.plan.find(p=>p.id===x.id);const p={id:old?.id||uid(),date:v.date,kind:v.kind,sessionId:v.kind==='workout'?(v.sessionId||null):null,title:v.title.trim()||(v.kind==='workout'?(session(v.sessionId)?.name||'Séance libre'):v.kind==='wod'?'Mon WOD':'Course à pied')};ok=change(()=>{if(old)Object.assign(old,p);else db.plan.push(p);selectedDay=v.date;weekStart=monday(v.date);});}
 else if(a==='activity'){const old=db.history.find(h=>h.id===x.id);const h={id:old?.id||uid(),kind:x.kind,title:v.title.trim(),date:v.date,endedAt:old?.endedAt||new Date().toISOString(),planId:x.plan||null,notes:v.notes||'',content:v.content||'',result:v.result||'',duration:v.duration?Number(v.duration):null,distance:v.distance?Number(v.distance):null,exercises:[]};if(!h.title)return;ok=change(()=>{if(old)Object.assign(old,h);else db.history.push(h);},false);if(ok){goto('history');toast('Entraînement enregistré.');}}
 if(ok)closeModal();
});
document.addEventListener('input',event=>{const el=event.target,x=el.dataset;if(x.input==='set'){const r=db.draft?.exercises[Number(x.ex)]?.blocks[Number(x.block)]?.rows[Number(x.row)];if(!r)return;if(el.validity.badInput||!el.checkValidity()){el.setAttribute('aria-invalid','true');return;}el.removeAttribute('aria-invalid');const v=el.value===''?null:Number(el.value);change(()=>{r[x.field]=v;r.done=false;},false);el.closest('.set-grid').classList.remove('checked');const check=el.closest('.set-grid').querySelector('.check');check.classList.remove('on');check.setAttribute('aria-pressed','false');check.setAttribute('aria-label','Valider la série '+(Number(x.row)+1));const c=$('#validated-count');if(c)c.textContent=db.draft.exercises.flatMap(e=>e.blocks.flatMap(b=>b.rows)).filter(r=>r.done).length;}
 else if(x.input==='exercise-notes'){const ex=targetExercises(x.scope)?.[Number(x.ex)];if(ex)change(()=>ex.notes=el.value,false);}
 else if(['history-field','history-exercise','history-row'].includes(x.input)){const h=db.historyEdit?.snapshot;if(!h)return;if(el.validity.badInput||!el.checkValidity()&&el.value!==''){el.setAttribute('aria-invalid','true');return;}el.removeAttribute('aria-invalid');change(()=>{const obj=x.input==='history-field'?h:x.input==='history-exercise'?h.exercises[Number(x.ex)]:h.exercises[Number(x.ex)]?.blocks[Number(x.block)]?.rows[Number(x.row)];if(!obj)return;obj[x.field]=el.type==='number'?(el.value===''?null:Number(el.value)):el.value;if(x.input==='history-row')obj.done=obj.weight!==null&&obj.reps!==null;},false);}
 else if(x.input==='draft-notes')change(()=>db.draft.notes=el.value,false);
 else if(el.id==='ex-name'){const sel=$('#ex-mode');if(sel)sel.value=/traction|dips|pompe/i.test(el.value)?'pdc':'weight';}
});
document.addEventListener('change',event=>{const el=event.target,x=el.dataset;if(x.input==='prefill-setting')change(()=>db.settings.prefill=el.checked);else if(x.input==='auto-rest-setting')change(()=>{db.settings.autoRest=el.checked;refreshRest();});else if(x.input==='block-kind')syncBlockLabels();else if(x.input==='program-select')change(()=>db.activeProgram=el.value);else if(x.input==='plan-kind')$('#plan-session-wrap').hidden=el.value!=='workout';else if(x.input==='rest-setting'){if(el.checkValidity()&&el.value!=='')change(()=>{db.settings.rest=Number(el.value);refreshRest();});else{toast('Choisis une durée entre 0 et 1800 secondes.');render();}}else if(el.id==='import-file')importData(el.files[0]);});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
// The draft is persisted on every valid input; visibility changes never erase it.
window.addEventListener('pageshow',()=>{tick();});
setInterval(tick,500);
render();
</script>
