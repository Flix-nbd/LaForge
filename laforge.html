function scopeSession(scope){return scope==='template'?editing():db.draft;}
function classicRows(e){return e.blocks.filter(b=>b.kind==='series').flatMap(b=>(b.rows||[]).filter(r=>!r.warmup));}
function groupFor(s,e){return (s.groups||[]).find(g=>g.id===e.groupId)||null;}
function groupMembers(s,g){return s.exercises.filter(e=>e.groupId===g.id);}
function groupType(g){return g.type==='biset'?'Biset':'Superset';}
function cleanGroups(s){if(!s)return;s.groups=(s.groups||[]).filter(g=>groupMembers(s,g).length>=2);const ids=new Set(s.groups.map(g=>g.id));s.exercises.forEach(e=>{if(e.groupId&&!ids.has(e.groupId))e.groupId=null;});}
function groupStamp(s,g,index){return {id:g.id,name:g.name,type:g.type,round:index+1,members:groupMembers(s,g).filter(e=>classicRows(e)[index]).map(e=>e.name)};}
function applyLoggedGroup(s,g){groupMembers(s,g).forEach(e=>classicRows(e).forEach((r,i)=>{if(r.done){const stamp=groupStamp(s,g,i);if(stamp.members.length>=2)r.chain=stamp;}}));}
function groupOverview(s,scope){return (s.groups||[]).map(g=>{const members=groupMembers(s,g);if(members.length<2)return '';return `<div class="group-overview"><div class="row between"><div class="grow"><span class="pill">${groupType(g)}</span> <b>${esc(g.name)}</b></div>${btn('Modifier','group-edit',`data-scope="${scope}" data-id="${g.id}"`,'text-btn')}</div><p class="group-sequence">${members.map((e,i)=>`<span>${i+1}. ${esc(e.name)}</span>`).join('<span class="chain-arrow" aria-hidden="true">→</span>')}</p><p class="muted group-rest">${icon('clock')} Repos après ${esc(members.at(-1).name)}, une fois le tour validé.</p></div>`;}).join('');}

function groupDialog(scope,id=null,ei=null){const s=scopeSession(scope);if(!s)return;if(s.exercises.length<2){toast('Ajoute au moins deux exercices pour créer un biset.');return;}const g=id?(s.groups||[]).find(g=>g.id===id):null;const selected=g?groupMembers(s,g).map(e=>e.id):ei!==null?[s.exercises[ei]?.id]:[];const logged=scope==='draft'&&s.exercises.some(e=>classicRows(e).some(r=>r.done));

function handleGroupSubmit(f,v,x){const s=scopeSession(x.scope);if(!s)return false;const ids=new FormData(f).getAll('members');if(ids.length<2||(v.type==='biset'&&ids.length!==2)){toast(v.type==='biset'?'Choisis exactement deux exercices pour un biset.':'Choisis au moins deux exercices.');return false;}const old=(s.groups||[]).find(g=>g.id===x.id),g={id:old?.id||uid(),type:v.type,name:v.name.trim()||`${v.type==='biset'?'Biset':'Superset'} ${(s.groups||[]).length+1}`};
 return change(()=>{s.groups=s.groups||[];s.exercises.forEach(e=>{if(e.groupId===g.id)e.groupId=null;if(ids.includes(e.id))e.groupId=g.id;});if(old)Object.assign(old,g);else s.groups.push(g);cleanGroups(s);if(x.scope==='draft'){s.restUntil=null;s.restContext=null;}if(x.scope==='draft'&&v.applyLogged!==undefined)applyLoggedGroup(s,g);});
}
function afterSeriesValidation(ex,bl,r){const d=db.draft;if(!d||!r.done||bl.kind==='emom')return '';const g=r.warmup?null:groupFor(d,ex);if(!g){startAutoRest(ex);return '';}
 const index=classicRows(ex).indexOf(r),members=groupMembers(d,g).filter(e=>classicRows(e)[index]);if(members.length<2){startAutoRest(ex);return 'Série supplémentaire hors enchaînement.';}r.chain=groupStamp(d,g,index);members.forEach(e=>{const row=classicRows(e)[index];if(!row.id)row.id=uid();});const last=members.at(-1),complete=members.every(e=>classicRows(e)[index].done);const key=g.id+':'+members.map(e=>classicRows(e)[index].id).join(':');d.restedRounds=d.restedRounds||[];
 if(d.restedRounds.includes(key))return 'Série mise à jour.';
 if(ex===last&&complete){d.restedRounds.push(key);const started=startAutoRest(ex,g);return started?'Tour terminé · repos lancé.':'Tour terminé.';}
 d.restUntil=null;d.restContext=null;const next=members.find(e=>!classicRows(e)[index].done);return next?`Enchaîne : ${next.name}.`:'Tour complet. Tu peux lancer le repos avec le bouton chrono.';
}
function emomDuration(b){return Number.isInteger(b.minutes)&&b.minutes>=1?b.minutes:b.rows.length;}
function emomElapsed(b,now=Date.now()){const t=b.timer;return t?Math.min(emomDuration(b)*60000,Math.max(0,t.elapsed+(t.running?now-t.started:0))):0;}
function settleEmom(b){if(b.kind!=='emom'||!b.timer)return;const cap=emomDuration(b)*60000,raw=b.timer.elapsed+(b.timer.running?Date.now()-b.timer.started:0);if(raw>=cap)b.timer={elapsed:cap,started:Date.now(),running:false};}

function syncBlockLabels(){const kind=$('#block-kind')?.value;if(!kind)return;$('#block-count-label').textContent=kind==='emom'?'Durée totale (minutes)':'Nombre de séries';$('#block-target-label').textContent=kind==='emom'?'Objectif reps / minute':'Objectif reps / série';$('#block-help').textContent=kind==='emom'?'Une ligne par minute. Modifier l’objectif ne change pas les reps déjà notées. Le chrono garde le temps écoulé.':'Les séries déjà notées sont conservées. Tu peux aussi ajouter ou retirer des séries directement dans la séance.';$('#block-target').required=kind==='emom';$('#block-target').min=kind==='emom'?'1':'0';}
function blockDialog(scope,ei,bi=null){const e=scopeSession(scope)?.exercises[ei];if(!e)return;const b=bi===null?null:e.blocks[bi];modal(b?'Modifier le bloc':'Ajouter un bloc',`<form data-form="block" data-scope="${scope}" data-ex="${ei}" data-block="${bi??''}"><label class="label" for="block-kind">Format</label><select id="block-kind" name="kind" data-input="block-kind"><option value="series" ${b?.kind!=='emom'?'selected':''}>Séries · classique, pyramide ou libre</option><option value="emom" ${b?.kind==='emom'?'selected':''}>EMOM · une série par minute</option></select><label class="label" for="block-label">Nom du bloc</label><input id="block-label" name="label" maxlength="80" placeholder="Pyramide, Lesté, 4 × 6…" value="${esc(b?.label||'')}"><div class="form-grid"><div><label class="label" id="block-count-label" for="block-count">Nombre de séries</label><input id="block-count" name="count" type="number" min="1" max="120" value="${scope==='draft'&&b?(b.kind==='emom'?emomDuration(b):b.rows.length):b?.count||3}" required></div><div><label class="label" id="block-target-label" for="block-target">Objectif reps</label><input id="block-target" name="target" type="number" min="0" max="999" value="${b?.target||''}" placeholder="Facultatif"></div></div><p class="muted" id="block-help" style="font-size:12px;margin-top:13px"></p><button class="btn full" style="margin-top:20px">${b?'Enregistrer':'Ajouter le bloc'}</button></form>`);syncBlockLabels();}
function handleBlockSubmit(v,x){const ex=targetExercises(x.scope)?.[Number(x.ex)];if(!ex)return false;const old=x.block!==''?ex.blocks[Number(x.block)]:null,count=Number(v.count),target=Number(v.target)||0;if(!Number.isInteger(count)||count<1||count>120||target<0||target>999||(v.kind==='emom'&&target<1)){toast('Vérifie la durée et l’objectif de reps.');return false;}

function tickEmomFocus(){const f=findFocusEmom(),el=$('#focus-time');if(!f||!el)return;const {b,ei,bi}=f,seconds=Math.floor(emomElapsed(b)/1000),total=emomDuration(b)*60,done=seconds>=total;el.textContent=done?'00:00':timeFmt(60-seconds%60);$('#focus-round').textContent=done?`${emomDuration(b)} minutes terminées`:`Minute ${Math.floor(seconds/60)+1} / ${emomDuration(b)}`;$('#focus-state').textContent=done?'EMOM terminé':!b.timer?'Prêt à démarrer':b.timer.running?'En cours':'En pause';$('#focus-progress').value=seconds;el.classList.toggle('final-seconds',!done&&!!b.timer?.running&&60-seconds%60<=3);const button=$(`[data-action="emom-toggle"][data-ex="${ei}"][data-block="${bi}"]`);if(button)button.textContent=done?'Recommencer':!b.timer?'Démarrer':b.timer.running?'Pause':'Reprendre';}

 const records=newWorkoutPRs(h);

function lfOldPlanDialog(date,id=null){const p=id?db.plan.find(p=>p.id===id):null,ss=sessions();modal(p?'Modifier le planning':'Planifier un entraînement',`<form data-form="plan" data-id="${id||''}"><label class="label" for="plan-date">Jour</label><input id="plan-date" name="date" type="date" value="${p?.date||date}" required><label class="label" for="plan-kind">Activité</label><select id="plan-kind" name="kind" data-input="plan-kind"><option value="workout" ${!p||p.kind==='workout'?'selected':''}>Musculation / PDC</option><option value="wod" ${p?.kind==='wod'?'selected':''}>WOD</option><option value="run" ${p?.kind==='run'?'selected':''}>Course à pied</option></select><div id="plan-session-wrap" ${p&&p.kind!=='workout'?'hidden':''}><label class="label" for="plan-session">Séance</label><select id="plan-session" name="sessionId"><option value="">Séance libre</option>${ss.map(s=>`<option value="${s.id}" ${p?.sessionId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><label class="label" for="plan-title">Nom (facultatif)</label><input id="plan-title" name="title" value="${esc(p?.title||'')}" maxlength="100" placeholder="Ex. footing facile, WOD du jour…"><button class="btn full" style="margin-top:20px">${p?'Enregistrer':'Ajouter à ma semaine'}</button></form>${p?btn('Retirer du planning','plan-delete',`data-id="${p.id}"`,'text-btn danger-text'):''}`);}

function historyView(){const h=db.history.filter(h=>histFilter==='all'||h.kind===histFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||'').localeCompare(a.endedAt||''));return `<div class="page-head"><div class="eyebrow">Ce que tu as fait</div><h1>Ton historique.</h1><p class="muted">Chaque séance, avec son vrai contenu.</p></div>${db.historyEdit?`<div class="notice">Correction en cours : ${esc(db.historyEdit.snapshot.title)} ${btn('Reprendre','nav','data-page="history-edit"','text-btn')}</div>`:''}<div class="tabs">${[['all','Tout'],['workout','Muscu / PDC'],['wod','WOD'],['run','Course']].map(([k,t])=>btn(t,'hist-filter',`data-kind="${k}"`,histFilter===k?'active':'')).join('')}</div><div class="stack">${h.map(h=>`<article class="card"><div class="row"><div class="activity-icon ${h.kind}">${icon(h.kind)}</div><div class="grow"><div class="eyebrow">${esc(dateLabel(h.date))}</div><h3>${esc(h.title)}</h3></div>${ib('next','history-detail',`data-id="${h.id}"`,'Voir le détail')}</div><div class="history-summary"><span>${esc(activitySubtitle(h))}</span>${h.kind==='workout'&&h.duration?`<span>${fmt(h.duration)} min</span>`:''}</div>${h.champion?champTotalsView(h):historyChainSummary(h)}${(h.exercises||[]).slice(0,3).map(e=>`<div class="history-ex"><b style="font-size:13px">${esc(e.name)}</b><p>${esc(e.blocks.flatMap(b=>b.rows.map(r=>rowSummary(r,e.mode))).join(' / '))}</p></div>`).join('')}${h.exercises?.length>3?`<p class="muted" style="font-size:12px;margin-top:12px">+ ${h.exercises.length-3} exercices dans le détail</p>`:''}${h.kind==='wod'&&h.content?`<p class="muted" style="margin-top:12px;white-space:pre-wrap">${esc(h.content)}</p>`:''}</article>`).join('')||emptyState('Tes entraînements apparaîtront ici une fois enregistrés.',btn('Ajouter un entraînement','start'))}</div>`;}

function spark(values){if(values.length<2)return '<div class="muted" style="font-size:12px;margin:20px 0">La courbe apparaîtra après un deuxième entraînement.</div>';const min=Math.min(...values),max=Math.max(...values),range=max-min||1,pts=values.map((v,i)=>[6+i*288/(values.length-1),54-(v-min)/range*43]),points=pts.map(p=>p.join(',')).join(' ');return `<svg class="spark" viewBox="0 0 300 65" role="img" aria-label="Évolution : ${values.map(fmt).join(', ')}"><path d="M6 57H294" stroke="#edf0f5" fill="none"/><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--blue)"/>`).join('')}</svg>`;}
function performanceCards(limit=Infinity){const groups=new Map();for(const m of measurements()){const k=JSON.stringify([norm(m.name),m.mode]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);}const all=[...groups.values()].sort((a,b)=>b.at(-1).date.localeCompare(a.at(-1).date)).slice(0,limit);return all.map(ms=>{const last=ms.at(-1),rows=ms.flatMap(m=>m.rows),weighted=rows.some(r=>r.weight>0);const best=rows.reduce((best,r)=>!best||(weighted?(r.weight>best.weight||(r.weight===best.weight&&r.reps>best.reps)):r.reps>best.reps)?r:best,null);const values=ms.slice(-12).map(m=>Math.max(...m.rows.map(r=>weighted?r.weight||0:r.reps||0)));const pdc=last.mode==='pdc';return `<div class="card"><div class="eyebrow">${pdc?'Poids du corps':'Musculation'} · ${ms.length} entraînements</div><h3>${esc(last.name)}</h3><div class="row between" style="margin-top:17px"><div class="perf-value">${weighted&&pdc?'+':''}${fmt(weighted?best.weight:best.reps)} <small>${weighted?'kg':'reps'}</small></div><span class="pill done">${weighted?'Charge maximale':'Meilleure série'}</span></div>${weighted?`<p class="muted" style="font-size:12px;margin-top:4px">${best.reps} reps à cette charge${pdc?' · lest ajouté':''}</p>`:''}${spark(values)}<div class="row between muted" style="font-size:10px"><span>${dayDate(ms.slice(-12)[0].date).toLocaleDateString('fr-FR')}</span><span>${dayDate(last.date).toLocaleDateString('fr-FR')}</span></div><p class="muted" style="font-size:12px;margin-top:13px">Courbe : ${weighted?'charge maximale':'maximum de reps par série'} à chaque entraînement.</p></div>`;}).join('')||emptyState('Tes records et tes courbes se construiront au fil de tes séances.');}
function prKey(p){return JSON.stringify([norm(p.name),p.mode,p.metric,p.metric==='load_reps'?p.reps:null,p.metric==='reps'?p.load:null]);}
function prLabel(p){return p.metric==='load'?'Charge maximale réalisée':p.metric==='load_reps'?`Charge sur ${p.reps} reps exactement`:`Maximum de reps ${p.mode==='pdc'&&p.load===0?'sans lest':'à '+(p.mode==='pdc'?'+':'')+fmt(p.load)+' kg'}`;}
function prUnit(p){return p.metric==='reps'?'reps':'kg';}
function prValue(p,v){return `${p.mode==='pdc'&&p.metric!=='reps'&&v>0?'+':''}${fmt(v)} ${prUnit(p)}`;}
function prRows(p,rows){return rows.filter(r=>r.done&&!r.warmup&&!r.aggregate&&Number.isFinite(r.weight)&&Number.isInteger(r.reps)&&r.reps>0&&(p.metric!=='load_reps'||r.reps===p.reps)&&(p.metric!=='reps'||r.weight===p.load));}
function prPoints(p,source=measurements()){return source.filter(m=>norm(m.name)===norm(p.name)&&m.mode===p.mode).map(m=>{const rows=prRows(p,m.rows);if(!rows.length)return null;const row=rows.reduce((a,b)=>{const av=p.metric==='reps'?a.reps:a.weight,bv=p.metric==='reps'?b.reps:b.weight;return bv>av||bv===av&&b.reps>a.reps?b:a;});return {date:m.date,value:p.metric==='reps'?row.reps:row.weight,reps:row.reps};}).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));}
function prBest(points){return points.reduce((a,b)=>!a||b.value>a.value||b.value===a.value&&b.reps>a.reps?b:a,null);}
function prExercises(){const list=measurements().map(m=>({name:m.name,mode:m.mode})).concat(sessions().flatMap(s=>s.exercises),db.customExercises||[],db.settings.prPins||[]);return [...new Map(list.map(e=>[JSON.stringify([norm(e.name),e.mode]),{name:e.name,mode:e.mode}])).values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));}
function prCard(p,index){const points=prPoints(p),best=prBest(points);return `<article class="pr-card"><div class="row between"><span class="pr-pin">◆ ÉPINGLÉ</span><div class="row">${ib('up','pr-move',`data-id="${p.id}" data-dir="-1" ${index===0?'disabled':''}`,'Monter ce PR')}${ib('down','pr-move',`data-id="${p.id}" data-dir="1" ${index===(db.settings.prPins||[]).length-1?'disabled':''}`,'Descendre ce PR')}${ib('edit','pr-edit',`data-id="${p.id}"`,'Modifier le PR et son objectif')}${ib('close','pr-unpin',`data-id="${p.id}"`,'Désépingler ce PR')}</div></div><button class="pr-open" data-action="pr-detail" data-id="${p.id}"><h3>${esc(p.name)}</h3><p class="muted">${esc(prLabel(p))}</p><strong class="pr-number">${best?prValue(p,best.value):'—'}</strong><p class="muted">${best?`${p.metric!=='reps'?best.reps+' reps · ':''}${esc(dateLabel(best.date))}`:'Pas encore de série correspondant à ce critère'}</p>${spark(points.slice(-12).map(x=>x.value))}<span class="text-btn">Voir la progression →</span></button>${p.goal?`<div class="pr-goal"><div class="row between"><span>Objectif ${prValue(p,p.goal)}</span><b>${best?Math.round(best.value/p.goal*100):0} %</b></div><progress value="${Math.min(best?.value||0,p.goal)}" max="${p.goal}" aria-label="Progression vers l’objectif"></progress>${best&&best.value>=p.goal?'<span class="pr-pin">Objectif atteint</span>':''}</div>`:''}</article>`;}

ries validées hors échauffement. En PDC, la charge est le lest ajouté. Aucun maximum estimé.</p><button class="btn full" style="margin-top:18px">${pin?'Enregistrer':'Épingler ce PR'}</button></form>`);}
function prDetail(id){const p=(db.settings.prPins||[]).find(p=>p.id===id);if(!p)return;const points=prPoints(p),best=prBest(points),recent=points.slice(-12);modal(p.name,`<p class="muted">${esc(prLabel(p))}</p><strong class="pr-number">${best?prValue(p,best.value):'—'}</strong><p class="muted">Record réalisé${best?' · '+esc(dateLabel(best.date)):''}</p>${spark(recent.map(x=>x.value))}<p class="muted">Les ${recent.length} derniers entraînements correspondant au critère.</p>${recent.length?`<table class="pr-table"><thead><tr><th>Date</th><th>Performance</th></tr></thead><tbody>${recent.slice().reverse().map(x=>`<tr><td>${esc(dateLabel(x.date))}</td><td>${prValue(p,x.value)}${p.metric!=='reps'?' × '+x.reps+' reps':''}</td></tr>`).join('')}</tbody></table>`:emptyState('Aucune série correspondante pour le moment.')}${btn('Modifier l’objectif / le critère','pr-edit',`data-id="${p.id}"`,'btn full')}`);}
function newWorkoutPRs(h){const before=measurements().filter(m=>m.date<=h.date),current=h.exercises.map(e=>({name:e.name,mode:e.mode,date:h.date,rows:e.blocks.flatMap(b=>b.rows)})),candidates=[...(db.settings.prPins||[])];for(const e of h.exercises){candidates.push({name:e.name,mode:e.mode,metric:'load'});if(e.mode==='pdc')candidates.push({name:e.name,mode:e.mode,metric:'reps',load:0});}return [...new Map(candidates.map(p=>[prKey(p),p])).values()].flatMap(p=>{const old=prBest(prPoints(p,before)),next=prBest(prPoints(p,current));return old&&next&&next.value>old.value?[{name:p.name,label:prLabel(p),value:prValue(p,next.value),old:prValue(p,old.value)}]:[];});}

function updateSoundStatus(){const text=db.settings.timerSound===false?'':audioFailed?'Son indisponible : réessaie « Tester le son ».':timerAudio?.state==='running'?'Musique + bips · désactive le silencieux sur iPhone':'Touche « Tester le son » pour vérifier tes écouteurs.';document.querySelectorAll('[data-sound-status]').forEach(el=>{if(el.textContent!==text)el.textContent=text;});}
function configureTimerAudio(){try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch{}}
function releaseTimerAudio(){stopTimerSounds();try{if(navigator.audioSession)navigator.audioSession.type='auto';}catch{}if(timerAudio?.state==='running')timerAudio.suspend?.().catch(()=>{});}
async function unlockTimerAudio(){if(db.settings.timerSound===false)return false;try{configureTimerAudio();const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Audio unavailable');if(!timerAudio||timerAudio.state==='closed'){timerAudio=new C();timerAudio.addEventListener('statechange',updateSoundStatus);}if(timerAudio.state!=='running')await timerAudio.resume();audioFailed=timerAudio.state!=='running';updateSoundStatus();return !audioFailed;}catch{audioFailed=true;updateSoundStatus();return false;}}
function stopTimerSounds(){for(const node of soundNodes){try{node.stop();}catch{}}soundNodes.clear();}
function timerTone(final=false,delay=0){if(db.settings.timerSound===false||timerAudio?.state!=='running'||document.visibilityState!=='visible')return;try{const osc=timerAudio.createOscillator(),gain=timerAudio.createGain(),at=timerAudio.currentTime+delay,duration=final?0.32:0.12;osc.type='sine';osc.frequency.setValueAtTime(final?1100:780,at);gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(0.16,at+0.012);gain.gain.setValueAtTime(0.16,at+duration-0.035);gain.gain.linearRampToValueAtTime(0,at+duration);osc.connect(gain);gain.connect(timerAudio.destination);soundNodes.add(osc);osc.onended=()=>{soundNodes.delete(osc);osc.disconnect();gain.disconnect();};osc.start(at);osc.stop(at+duration+0.01);}catch{audioFailed=true;updateSoundStatus();}}
async function testTimerSound(){if(db.settings.timerSound===false){toast('Active les bips pour les tester.');return;}if(await unlockTimerAudio()){stopTimerSounds();[0,1,2].forEach(delay=>timerTone(false,delay));timerTone(true,3);setTimeout(()=>{if(page!=='workout')releaseTimerAudio();},3600);}}
function tickTimerSounds(){const d=db.draft;if(!d||page!=='workout'||document.visibilityState!=='visible'){soundClocks.clear();return;}const now=Date.now(),active=new Set();let cue=null;
 if(d.restUntil){const key=d.id+':rest',signature=d.restUntil,left=Math.ceil((d.restUntil-now)/1000),old=soundClocks.get(key);active.add(key);if(left>=1&&left<=3&&(!old||old.signature!==signature||old.value!==left))cue=false;else if(left===0&&old?.signature===signature&&old.value>0&&now-old.at<1500)cue=true;soundClocks.set(key,{signature,value:left,at:now});}
 for(const e of d.exercises)for(const b of e.blocks){if(b.kind!=='emom'||!b.timer)continue;const key=d.id+':emom:'+b.id;active.add(key);if(!b.timer.running)continue;const raw=Math.max(0,b.timer.elapsed+now-b.timer.started),second=Math.floor(raw/1000),cap=emomDuration(b)*60,old=soundClocks.get(key);if(!old||old.value!==second){if(second<cap&&second%60>=57){if(cue!==true)cue=false;}else if(second>0&&second<=cap&&second%60===0&&old&&old.value===second-1&&now-old.at<1500)cue=true;}soundClocks.set(key,{value:second,at:now});}
 for(const key of soundClocks.keys())if(!active.has(key))soundClocks.delete(key);
 if(cue!==null)timerTone(cue);
}

let screenLock=null,screenLockPending=false,screenLockState='idle',screenPageHidden=false;
function wantsScreenLock(){return !!db.draft&&page==='workout'&&document.visibilityState==='visible'&&!screenPageHidden;}
function screenLockStatus(){const el=$('#screen-lock-status');if(!el)return;const active=screenLock&&!screenLock.released;el.innerHTML=active?'Écran maintenu allumé':screenLockState==='unsupported'?'Maintien de l’écran indisponible sur ce navigateur.':screenLockState==='blocked'?`Écran susceptible de se verrouiller. ${btn('Réessayer','screen-lock-retry','','text-btn')}<span class="screen-lock-help">Le téléphone peut refuser en mode économie d’énergie ou si la batterie est faible.</span>`:screenLockPending?'Maintien de l’écran…':'Maintien de l’écran en attente…';el.classList.toggle('screen-lock-active',!!active);}
async function syncScreenLock(retry=false){
 if(!wantsScreenLock()){const previous=screenLock;screenLock=null;screenLockState='idle';if(previous&&!previous.released){try{await previous.release();}catch{}}screenLockStatus();return;}
 if(!navigator.wakeLock?.request){screenLockState='unsupported';screenLockStatus();return;}
 if(screenLock&&!screenLock.released||screenLockPending){screenLockStatus();return;}
 if(screenLockState==='blocked'&&!retry){screenLockStatus();return;}
 screenLockPending=true;screenLockState='pending';screenLockStatus();
 try{const lock=await navigator.wakeLock.request('screen');if(!wantsScreenLock()){await lock.release();screenLockState='idle';return;}screenLock=lock;screenLockState=lock.released?'blocked':'active';lock.addEventListener('release',()=>{if(screenLock!==lock)return;screenLock=null;screenLockState=wantsScreenLock()?'blocked':'idle';screenLockStatus();});}

 finally{screenLockPending=false;screenLockStatus();}
}
document.addEventListener('visibilitychange',()=>{syncScreenLock(document.visibilityState==='visible');});
window.addEventListener('pagehide',()=>{screenPageHidden=true;syncScreenLock();});

function champConfig(bi,scope='draft',sid=''){const owner=scope==='template'?session(sid):db.draft,b=owner?.champion?.blocks[bi];if(!b)return;const families={pull:'Tractions',push:'Pompes',dip:'Dips',mu:'Muscle-ups',hold:'Maintien / gainage',leg:'Jambes'};modal(scope==='template'?'Modifier les prochaines séances':'Adapter cette séance',`<form class="ch-editor" data-ch-form="block" data-config="true" data-bi="${bi}" data-scope="${scope}" data-sid="${sid}"><p class="muted">${scope==='template'?'Ces réglages deviennent le modèle des prochaines séances.':'Modifications temporaires : le modèle dans Programme reste inchangé.'}</p><label class="label">Nom du bloc<input name="title" required maxlength="150" value="${esc(b.title)}"></label><label class="label">Repos commun (s, 0 = libre)<input name="rest" type="number" min="0" max="1800" required value="${b.rounds.find((r,ri)=>b.breaks?.[ri]==null)?.rest||0}"></label><p class="muted">Chaque tour garde son objectif : tu peux varier les reps minute par minute. Les objectifs ne sont jamais comptés comme des résultats. Pour remplacer un mouvement dans tout le bloc, utilise le champ ci-dessous.</p><label class="label">Remplacer dans tout le bloc<select name="replace-from"><option value="">Aucun remplacement</option>${[...new Set(b.rounds.flatMap(r=>r.items.map(i=>i.label)))].map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label><label class="label">Nouveau nom<input name="replace-name" maxlength="100" placeholder="Ex. Tractions lestées"></label><label class="label">Catégorie pour les totaux<select name="replace-family">${Object.entries(families).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="label">Unité du mouvement remplacé<select name="replace-unit"><option value="reps">Répétitions</option><option value="seconds">Secondes</option></select></label>${b.rounds.map((r,ri)=>`<details ${b.rounds.length<=4?'open':''}><summary>${esc(r.label||'Tour '+(ri+1))} · ${es function champHistoryAutosave(event){const f=event.target.closest('form[data-ch-form="history"]'),edit=db.historyEdit;if(!f||!edit?.snapshot?.champion||!event.target.checkValidity())return;const v=new FormData(f);change(()=>{const h=edit.snapshot;h.title=String(v.get('title'));h.date=String(v.get('date'));h.notes=String(v.get('notes'));h.champion.blocks.forEach((b,bi)=>b.rounds.forEach((r,ri)=>{const t=v.get(`time-${bi}-${ri}`);if(t!==null)r.time=t===''?null:Number(t);r.items.forEach((i,ii)=>{const key=`${bi}-${ri}-${ii}`,value=v.get('v-'+key),weight=v.get('w-'+key);i[i.unit==='seconds'?'seconds':'reps']=value===''?null:Number(value);if(weight!==null)i.weight=weight===''?null:Number(weight);i.warmup=v.has('e-'+key);i.done=v.has('d-'+key)&&(i.unit==='seconds'?i.seconds!==null:i.reps!==null&&i.weight!==null);});}));},false);}

function programOptionsDialog(id=null){const p=id?db.programs.find(p=>p.id===id):null;if(id&&!p)return;const o=p?.organization||{durationWeeks:null,cycles:[]};modal(p?'Modifier le programme':'Créer un programme',`<form data-form="program-options" data-id="${p?.id||''}"><label class="label" for="program-name">Nom du programme</label><input id="program-name" name="name" maxlength="100" required autocomplete="off" value="${esc(p?.name||'')}">${p?.champion?'<p class="muted" style="margin-top:14px">Champion conserve ses cycles et sa progression propres.</p>':`<label class="group-option"><input type="checkbox" name="hasDuration" ${o.durationWeeks?'checked':''}><span>Définir une durée</span></label><div id="program-duration-wrap" ${o.durationWeeks?'':'hidden'}><label class="label" for="program-duration">Semaines d’entraînement</label><input id="program-duration" name="durationWeeks" type="number" min="1" max="520" step="1" value="${o.durationWeeks||12}" ${o.durationWeeks?'required':'disabled'}></div><label class="group-option"><input type="checkbox" name="hasCycles" ${o.cycles.length?'checked':''}><span>Organiser en cycles</span></label><div id="program-cycles-wrap" ${o.cycles.length?'':'hidden'}><label class="label" for="program-cycle-count">Nombre de cycles</label><div class="row"><button type="button" class="btn secondary" data-cycle-step="-1" aria-label="Retirer un cycle">−</button><input id="program-cycle-count" name="cycleCount" type="number" inputmode="numeric" min="1" max="20" step="1" value="${o.cycles.length||1}" ${o.cycles.length?'required':'disabled'} style="min-width:0;flex:1;text-align:center"><button type="button" class="btn secondary" data-cycle-step="1" aria-label="Ajouter un cycle">+</button></div><p class="muted" style="font-size:12px;margin-top:8px">Choisis le nombre de cycles, puis leur nom et leur durée si besoin. Retirer un cycle conserve ses séances dans « Commun à tous les cycles ».</p><div id="program-cycle-fields"></div></div><p class="muted" style="font-size:12px;margin-top:14px">Durée et cycles sont facultatifs. Une pause ne fait pas avancer le programme. Les séances peuvent être classées par cycle depuis leur option « Nom et cycle ».</p>`}<button class="btn full" style="margin-top:20px">${p?'Enregistrer':'Créer le programme'}</button></form>`);const f=$('[data-form="program-options"]');f._cycles=clone(o.cycles);if(!p?.champion)syncProgramOptions(f);}
function syncProgramOptions(f){const enabled=f.elements.hasDuration.checked,cycles=f.elements.hasCycles.checked;$('#program-duration-wrap').hidden=!enabled;f.elements.durationWeeks.disabled=!enabled;f.elements.durationWeeks.required=enabled;$('#program-cycles-wrap').hidden=!cycles;f.elements.cycleCount.disabled=!cycles;f.elements.cycleCount.required=cycles;const n=Number(f.elements.cycleCount.value);if(!Number.isInteger(n)||n<1||n>20)return;const container=$('#program-cycle-fields');container.querySelectorAll('[data-cycle-index]').forEach(x=>{const j=Number(x.dataset.cycleIndex);f._cycles[j]={id:x.dataset.id,name:x.querySelector('[data-cycle-name]').value,weeks:x.querySelector('[data-cycle-weeks]').value};});container.innerHTML=Array.from({length:n},(_,j)=>{const c=f._cycles[j]||{id:uid(),name:'Cycle '+(j+1),weeks:null};f._cycles[j]=c;return `<div class="template-block" data-cycle-index="${j}" data-id="${c.id}"><label class="label" for="cycle-name-${j}">Cycle ${j+1}</label><input id="cycle-name-${j}" data-cycle-name maxlength="100" required value="${esc(c.name)}"><label class="label" for="cycle-weeks-${j}">Durée en semaines (facultatif)</label><input id="cycle-weeks-${j}" data-cycle-weeks type="number" min="1" max="520" step="1" value="${c.weeks??''}"></div>`;}).join('');container.querySelectorAll('input').forEach(x=>x.disabled=!cycles);}

const LF_MUSCLES={chest:'Pectoraux',back:'Dos',shoulders:'Épaules',arms:'Bras',legs:'Jambes',abs:'Abdos',other:'Autres'};
function lfMeta(name){const n=norm(name);return {muscle:/traction|tirage|rowing|hang|pull.up/.test(n)?'back':/couche|incline|pompe|dips|ecarte/.test(n)?'chest':/militaire|lateral|oiseau|face pull|epaule/.test(n)?'shoulders':(/curl|triceps/.test(n)&&!/leg curl/.test(n))?'arms':/squat|presse|leg |terre|fente|mollet|hip|abduction|adduction/.test(n)?'legs':/crunch|planche|gainage|abdo|releve/.test(n)?'abs':'other',equipment:/haltere/.test(n)?'Haltères':/barre|couche|militaire|squat|terre/.test(n)?'Barre':/poulie|tirage|face pull/.test(n)?'Poulie':/machine|presse|leg /.test(n)?'Machine':/traction|muscle.up|dips|hang/.test(n)?'Barres de street lifting':'Poids du corps',mode:/traction|pompe|dips|muscle.up|hang|planche|gainage/.test(n)?'pdc':'weight'};}
function lfFamily(name){const n=norm(name);return /muscle.?up/.test(n)?'mu':/traction|pull.?up/.test(n)?'pull':/pompe|push.?up/.test(n)?'push':/dips?/.test(n)?'dip':/hang|iso|planche|gainage/.test(n)?'hold':'leg';}
function lfCatalogue(){const names=exerciseSuggestions().concat(['Muscle-up','Dips à la barre','Tractions dead stop','Dead hang','Planche','Fentes arrière','Relevés de genoux']);return [...new Map(names.map(name=>{const e=db.customExercises?.find(e=>norm(e.name)===norm(name));return [norm(name),{...lfMeta(name),...e,name:e?.name||name}];})).values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));}
let lfCatalogueFilter='',lfCatalogueQuery='',lfPickContext=null;

function lfCatalogueResults(){const el=$('#lf-catalogue-results');if(!el)return;const q=norm(lfCatalogueQuery);const list=lfCatalogue().filter(e=>(!lfCatalogueFilter||e.muscle===lfCatalogueFilter)&&norm(e.name+' '+LF_MUSCLES[e.muscle]+' '+e.equipment).includes(q));el.innerHTML=list.map(e=>`<div class="lf-catalogue-row">${exerciseIllustration(e.name)}<div class="grow"><b>${esc(e.name)}</b><p class="muted ch-small">${esc(LF_MUSCLES[e.muscle]||'Autres')} · ${esc(e.equipment||'Non précisé')}</p></div>${lfPickContext?btn('Choisir','lf-pick',`data-name="${esc(e.name)}"`,'btn secondary'):btn(icon('edit'),'lf-catalogue-edit',`data-name="${esc(e.name)}" aria-label="Modifier ${esc(e.name)}"`,'icon')}</div>`).join('')||'<p class="muted">Aucun exercice. Tu peux créer le tien.</p>';}
function catalogView(){lfPickContext=null;return `<div class="page-head">${btn('‹ Programme','nav','data-page="program"','text-btn')}<h1>Mes exercices</h1><p class="muted">Une base commune à tes programmes. Tes créations sont conservées sur cet appareil.</p></div>${btn('+ Créer un exercice','lf-catalogue-new','','btn secondary')}${lfCatalogueControls()}`;}
function lfChooseExercise(context){lfPickContext=context;lfCatalogueQuery='';lfCatalogueFilter='';modal('Choisir un exercice',`${btn('+ Créer un exercice','lf-catalogue-new','','btn secondary')}${lfCatalogueControls()}`);lfCatalogueResults();}
function catalogDialog(id){const e=db.customExercises?.find(e=>e.id===id);lfCatalogEdit(e?.name||'');}
function lfCatalogEdit(name){const e=lfCatalogue().find(e=>e.name===name)||{name:'',mode:'weight',muscle:'other',equipment:''};modal(name?'Modifier l’exercice':'Créer un exercice',`<form data-form="lf-catalogue" data-original="${esc(name)}"><label class="label">Nom<input name="name" required maxlength="100" value="${esc(e.name)}"></label><label class="label">Muscle principal<select name="muscle">${Object.entries(LF_MUSCLES).map(([k,n])=>`<option value="${k}" ${e.muscle===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="label">Matériel<input name="equipment" maxlength="100" value="${esc(e.equipment||'')}" placeholder="Barre, haltères, poulie…"></label><label class="label">Charge notée<select name="mode"><option value="weight" ${e.mode==='weight'?'selected':''}>Musculation · charge totale</option><option value="pdc" ${e.mode==='pdc'?'selected':''}>Poids du corps · lest ajouté</option></select></label><p class="muted ch-small">Ce choix ne modifie pas tes séances existantes. Une illustration correspondante est utilisée lorsqu’elle est disponible.</p><button class="btn full">Enregistrer</button></form>`);}
function lfItem(name,training='street',target=''){const meta=lfCatalogue().find(e=>e.name===name)||lfMeta(name);return {id:uid(),label:name,family:lfFamily(name),unit:/hang|iso|planche|gainage/i.test(name)?'seconds':'reps',target,weight:0,reps:null,seconds:null,done:false,warmup:false,mode:meta.mode,training,note:''};}
function lfMakeStructured(owner){if(owner.champion)return;const executed=!!owner.startedAt;const blocks=[],doneGroups=new Set();for(const e of owner.exercises||[]){if(e.groupId&&doneGroups.has(e.groupId))continue;const members=e.groupId?owner.exercises.filter(q=>q.groupId===e.groupId):[e];if(e.groupId)doneGroups.add(e.groupId);const group=owner.groups?.find(g=>g.id===e.groupId);const blockCount=Math.max(...members.map(x=>x.blocks.length));for(let k=0;k<blockCount;k++){const sources=members.map(x=>({e:x,b:x.blocks[k]})).filter(x=>x.b),count=Math.max(...sources.map(x=>executed?x.b.rows.length:x.b.count));if(!count)continue;const b={id:uid(),sourceKey:owner.sessionId||owner.id+':'+e.id+':'+k,title:group?.name||e.name,note:members.map(x=>x.notes||'').filter(Boolean).join(' · '),type:sources.some(x=>x.b.kind==='emom')?'emom':'series',rounds:[]};b.sourceKey=owner.id+':'+e.id+':'+k;for(let j=0;j<count;j++){const items=[];for(const x of sources){const row=executed?x.b.rows[j]:j<x.b.count?{}:null;if(!row)continue;const i=lfItem(x.e.name,x.e.mode==='pdc'?'street':'muscu',String(x.b.target||''));i.mode=x.e.mode;i.unit='reps';i.note=x.e.notes||'';if(executed)Object.assign(i,{weight:row.weight,reps:row.reps,rpe:row.rpe,done:row.done,warmup:!!row.warmup});items.push(i);}if(items.length)b.rounds.push({id:uid(),label:'Série '+(j+1),rest:b.type==='emom'?0:(restRule(owner,e,group).enabled?restRule(owner,e,group).seconds:0),items});}if(b.rounds.length)blocks.push(b);}}
owner.champion={stage:0,week:1,programId:owner.programId||db.programs.find(p=>p.sessions.some(s=>s.id===owner.id))?.id||'free',personal:true,blocks};owner.exercises=[];owner.groups=[];}
function lfOwner(scope,sid){return scope==='draft'?db.draft:session(sid);}
let lfBuilder=null;
function lfBlockDialog(scope='template',sid='',index=null,format='series',name=''){const owner=lfOwner(scope,sid);if(!owner)return;const old=index===null?null:owner.champion?.blocks[index];lfBuilder={scope,sid,index,original:old?JSON.stringify(old):null,rounds:old?clone(old.rounds):[],items:old?clone(old.rounds[0].items):name?[lfItem(name,lfMeta(name).mode==='pdc'?'street':'muscu')]:[],format:old?.circuit||old?.type||format};const o=old||{};modal(old?'Modifier le bloc':format==='series'?'Ajouter un exercice / bloc':'Ajouter un circuit',`<form data-form="lf-block"><p class="muted ch-small">${scope==='draft'?'Adaptation de cette séance uniquement.':'Modèle pour les prochaines séances. Historique et séance en cours inchangés.'}</p><label class="label">Nom du bloc<input name="title" required maxlength="150" value="${esc(o.title||name)}" placeholder="Ex. Biset, Tractions lestées…"></label><label class="label">Format<select name="format">${[['series','Séries / biset'],['pyramid','Pyramide'],['percent','Max et pourcentages'],['interval','Efforts au temps'],['fortime','For time'],['round','Circuit · Round'],['hiit','Circuit · HIIT'],['emom','Circuit · EMOM'],['amrap','Circuit · AMRAP']].map(([v,n])=>`<option value="${v}" ${lfBuilder.format===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="form-grid"><label class="label">Séries / tours / intervalles<input name="count" type="number" min="1" max="200" step="1" required value="${o.rounds?.length||3}"></label><label class="label">Repos après le tour (s)<input name="rest" type="number" min="0" max="1800" required value="${o.rounds?.[0]?.rest??120}"></label></div><div id="lf-timing-fields"><div class="form-grid"><label class="label">Effort HIIT (s)<input name="work" type="number" min="1" max="3600" required value="${o.work||30}"></label><label class="label">Repos HIIT par mouvement (s)<input name="recovery" type="number" min="0" max="1800" required value="${o.recovery??15}"></label><label class="label">Intervalle EMOM (s)<input name="interval" type="number" min="5" max="1800" required value="${o.interval||60}"></label><label class="label">Durée AMRAP (min)<input name="duration" type="number" min="1" max="180" required value="${(o.duration||600)/60}"></label></div></div><label class="label">Décompte avant départ (s)<input name="countdown" type="number" min="0" max="60" step="1" required value="${o.countdown||0}"></label><p id="lf-format-help" class="muted ch-small"></p><h3>Mouvements</h3><div id="lf-builder-items"></div>${btn('+ Mouvement','lf-builder-pick','','btn secondary')}<details style="margin-top:18px"><summary>Objectifs et repos différents selon les tours</summary><div id="lf-builder-rounds"></div></details><label class="label">Consignes du bloc<textarea name="note">${esc(o.note||'')}</textarea></label><button class="btn full">Enregistrer le bloc</button></form>`);lfBuilderRender();lfBuilderFormat();}
function lfReadBuilder(){const f=$('[data-form="lf-block"]');if(!f||!lfBuilder)return;f.querySelectorAll('[data-lf-item]').forEach(el=>{const i=lfBuilder.items[Number(el.dataset.lfItem)];if(!i)return;for(const field of ['label','training','mode','unit','target','note'])i[field]=el.querySelector('[name="'+field+'"]').value;i.weight=Number(el.querySelector('[name="weight"]').value);i.family=lfFamily(i.label);});f.querySelectorAll('[data-lf-round]').forEach(el=>{const ri=Number(el.dataset.lfRound);lfBuilder.rounds[ri]??={};lfBuilder.rounds[ri].restOverride=el.querySelector('[data-round-rest]').value;lfBuilder.rounds[ri].targets=Array.from(el.querySelectorAll('[data-round-target]')).map(x=>x.value);lfBuilder.rounds[ri].names=Array.from(el.querySelectorAll('[data-round-name]')).map(x=>x.value);lfBuilder.rounds[ri].weights=Array.from(el.querySelectorAll('[data-round-weight]')).map(x=>x.value);});}
function lfBuilderRender(){const f=$('[data-form="lf-block"]');if(!f||!lfBuilder)return;$('#lf-builder-items').innerHTML=lfBuilder.items.map((i,j)=>`<fieldset data-lf-item="${j}"><legend>Mouvement ${j+1}</legend><label class="label">Exercice<input name="label" required maxlength="100" value="${esc(i.label)}"></label><div class="form-grid"><label class="label">Suivi<select name="training"><option value="muscu" ${i.training==='muscu'?'selected':''}>Musculation</option><option value="street" ${i.training!=='muscu'?'selected':''}>Street lifting / PDC</option></select></label><label class="label">Charge<select name="mode"><option value="weight" ${i.mode==='weight'?'selected':''}>Charge totale</option><option value="pdc" ${i.mode!=='weight'?'selected':''}>Lest ajouté</option></select></label><label class="label">Unité<select name="unit"><option value="reps" ${i.unit==='reps'?'selected':''}>Répétitions</option><option value="seconds" ${i.unit==='seconds'?'selected':''}>Secondes de maintien</option></select></label><label class="label">Objectif<input name="target" maxlength="100" value="${esc(i.target)}" placeholder="5, 8–12, Max, 80% du max"></label><label class="label">Charge / lest prévu (kg)<input name="weight" type="number" min="0" max="2000" step="any" required value="${i.weight??0}"></label></div><label class="label">Consigne du mouvement<textarea name="note">${esc(i.note||'')}</textarea></label>${btn('Retirer le mouvement','lf-builder-remove',`data-index="${j}"`,'text-btn danger-text')}</fieldset>`).join('');lfBuilderRounds();}
function lfBuilderRounds(){const f=$('[data-form="lf-block"]');const n=Number(f.elements.count.value);if(!Number.isInteger(n)||n<1||n>200)return;$('#lf-builder-rounds').innerHTML=Array.from({length:n},(_,ri)=>{const r=lfBuilder.rounds[ri];return `<fieldset data-lf-round="${ri}"><legend>Tour ${ri+1}</legend><label class="label">Repos spécifique (s, vide = commun)<input type="number" min="0" max="1800" data-round-rest value="${r?.restOverride??(r&&r.rest!==undefined?r.rest:'')}"></label>${lfBuilder.items.map((i,ii)=>`<label class="label">${esc(i.label)} · mouvement<input data-round-name maxlength="100" value="${esc(r?.names?.[ii]??r?.items?.[ii]?.label??i.label)}"></label><label class="label">Objectif<input data-round-target maxlength="100" placeholder="${esc(i.target||'Objectif commun')}" value="${esc(r?.targets?.[ii]??r?.items?.[ii]?.target??'')}"></label><label class="label">Charge / lest prévu (kg)<input data-round-weight type="number" min="0" max="2000" step="any" value="${r?.weights?.[ii]??r?.items?.[ii]?.weight??i.weight??0}"></label>`).join('')}</fieldset>`;}).join('');}
function lfBuilderFormat(){const f=$('[data-form="lf-block"]');if(!f)return;const type=f.elements.format.value;const help={series:'Les mouvements d’un même tour s’enchaînent avant le repos.',pyramid:'Règle les paliers dans « Objectifs différents ». Ajoute ou retire des tours selon ton sommet.',percent:'Après la première série Max, utilise par exemple 80% du max puis 70% du max dans les objectifs des tours.',interval:'Effort limité dans le temps, puis récupération après validation du tour.',fortime:'Volume cumulé à réaliser en fractionnant si besoin. Exclu des records de série unique.',round:'Tours à ton rythme, récupération entre les tours.',hiit:'Effort et repos chronométrés pour chaque mouvement, répétés sur tous les tours.',emom:'Tous les mouvements du tour dans le même intervalle. Modifie les tours pour une alternance.',amrap:'Maximum de tours dans la durée. Ajoute les tours au fil de la séance et note les derniers mouvements partiels.'};$('#lf-format-help').textContent=help[type];for(const [field,on]of Object.entries({work:type==='hiit'||type==='interval',recovery:type==='hiit',interval:type==='emom',duration:type==='amrap'})){const x=f.elements[field];x.closest('label').hidden=!on;x.disabled=!on;} }
function lfCircuitDialog(scope,sid){modal('Quel type de circuit ?',`${[['round','Round','Tours à ton rythme'],['hiit','HIIT','Effort et repos chronométrés'],['emom','EMOM','Départs à intervalles réguliers'],['amrap','AMRAP','Un maximum de tours dans le temps']].map(([type,name,description])=>btn(`<b>${name}</b><small>${description}</small>`,'lf-circuit-type',`data-scope="${scope}" data-sid="${sid}" data-type="${type}"`,'choice')).join('')}`);}
function lfAddTools(scope,sid=''){return `<div class="foot-actions">${btn('+ Exercice','lf-add-ex',`data-scope="${scope}" data-sid="${sid}"`,'btn secondary')}${btn('+ Circuit','lf-add-circuit',`data-scope="${scope}" data-sid="${sid}"`,'btn secondary')}</div>`;}
function editorView(){const s=editing();if(s&&!s.champion&&s.exercises.some(e=>e.blocks.some(b=>b.count>0))){if(!change(()=>lfMakeStructured(s),false))return '<p>Enregistrement impossible. Exporte tes données avant de poursuivre.</p>';}if(!s?.champion){let html=lfOldEditorView();if(s)html+=lfAddTools('template',s.id);return html;}return `<div class="page-head">${btn('‹ Programme','nav','data-page="program"','text-btn')}<h1>${esc(s.name)}</h1>${btn('Nom et cycle','session-rename',`data-id="${s.id}"`,'text-btn')}<p class="muted">Modèle pour les prochaines séances. La séance en cours et l’historique restent inchangés.</p></div>${s.champion.blocks.map((b,bi)=>`<section class="card"><div class="row">${champIcon(b.rounds[0].items[0].family,b.title+' '+b.rounds[0].items[0].label)}<h2>${esc(b.title)}</h2></div><p class="muted">${b.rounds.length} tours · ${esc(b.circuit||b.type)}</p><p class="muted">${esc(b.note)}</p><p>${esc([...new Set(b.rounds.flatMap(r=>r.items.map(i=>i.label)))].join(' + '))}</p><div class="row wrap">${btn('Modifier','lf-edit-block',`data-scope="template" data-sid="${s.id}" data-bi="${bi}"`,'btn secondary')}${ib('up','lf-block-move',`data-scope="template" data-sid="${s.id}" data-bi="${bi}" data-dir="-1" ${bi===0?'disabled':''}`,'Monter le bloc')}${ib('down','lf-block-move',`data-scope="template" data-sid="${s.id}" data-bi="${bi}" data-dir="1" ${bi===s.champion.blocks.length-1?'disabled':''}`,'Descendre le bloc')}${btn('Retirer','lf-block-remove',`data-scope="template" data-sid="${s.id}" data-bi="${bi}"`,'text-btn danger-text')}</div></section>`).join('')}${lfAddTools('template',s.id)}${btn('Terminé','nav','data-page="program"','btn')}`;}
function exDialog(scope){lfChooseExercise({kind:'new-block',scope,sid:scope==='template'?editing()?.id:''});}
function lfVolumeRows(h){const map=new Map();const add=(name,reps,kg,mode)=>{const key=name+'|'+mode;const x=map.get(key)||{name,reps:0,kg:0,mode};x.reps+=reps;x.kg+=reps*kg;map.set(key,x);};if(h.champion){for(const b of h.champion.blocks)for(const r of b.rounds)for(const i of r.items)if(i.done&&!i.warmup&&i.unit==='reps'&&i.training!=='muscu')add(i.label,i.reps||0,i.weight||0,i.mode||'pdc');}else for(const e of h.exercises||[])if(e.mode==='pdc')for(const b of e.blocks)for(const r of b.rows)if(r.done&&!r.warmup)add(e.name,r.reps||0,r.weight||0,e.mode);return [...map.values()];}
function champTotalsView(h){const rows=lfVolumeRows(h);return `<div class="lf-volume"><h3>Volume street lifting</h3>${rows.length?rows.map(x=>`<p><b>${esc(x.name)}</b> · ${x.reps} reps${x.kg?' · '+fmt(x.kg)+' kg de '+(x.mode==='pdc'?'lest cumulé':'charge cumulée'):''}</p>`).join(''):'<p class="muted">Aucune répétition street lifting validée.</p>'}<p class="muted ch-small">Résultats validés hors échauffement. Lest cumulé = reps × lest ajouté, sans le poids du corps. La musculation reste dans l’historique et les performances.</p></div>`;}
function champNormalize(h){const es=[];for(const b of h.champion.blocks)for(const [ri,r]of b.rounds.entries())for(const i of r.items){if(!i.done||i.unit!=='reps')continue;const mode=i.mode||(i.family==='leg'?'weight':'pdc');let e=es.find(e=>e.name===i.label&&e.mode===mode);if(!e){e={id:uid(),name:i.label,mode,notes:i.note||'',blocks:[]};es.push(e);}let block=e.blocks.find(q=>q.sourceKey===b.sourceKey);if(!block){block={id:uid(),kind:b.type==='emom'?'emom':'series',label:b.title,target:0,sourceKey:b.sourceKey,rows:[],timer:null};if(b.type==='emom')block.minutes=b.rounds.length;e.blocks.push(block);}block.rows.push({id:uid(),weight:i.weight??0,reps:i.reps,rpe:i.rpe??null,done:true,warmup:i.warmup,position:ri+1,aggregate:b.type==='fortime'||b.circuit==='amrap'});}h.exercises=es;}
function champTarget(b,ri,i){if(!i.targetOverride){const m=i.target.match(/^\s*(\d+(?:[.,]\d+)?)\s*%/);if(m){const ref=b.rounds[0].items.find(q=>q.label===i.label&&q.unit===i.unit);const value=ref?.reps;if(value!=null)return String(Math.floor(value*Number(m[1].replace(',','.'))/100));}if(b.type==='percent'&&ri>0){const v=b.rounds[0].items[0].reps;if(v!=null)return String(Math.floor(v*(ri===1?.8:.7)));}}return i.target;}
function lfWorkoutExtras(html){if(db.draft?.champion)return html;return html+lfAddTools('draft')+champTotalsView(db.draft);}
function lfStructuredWorkout(){const d=db.draft;let html=lfOldChampWorkoutView();if(d.champion.personal)html=html.replace(/Remise à niveau · semaine \d+/,'Séance personnelle · musculation / street lifting');html=html.replace(/Afficher les séries/g,'⌄ Déplier').replace(/Réduire le bloc/g,'⌃ Replier');return html+lfAddTools('draft');}
// Un seul moteur de chrono pour les circuits créés dans l'éditeur.
function lfSchedule(b){const start=b.countdown||0,phases=[];let cursor=start;if(start)phases.push({start:0,end:start,label:'Départ',ri:0,ii:0});if(b.circuit==='round'){return phases;}if(b.circuit==='amrap'){phases.push({start:cursor,end:cursor+(b.duration||600),label:'AMRAP',ri:0,ii:0});return phases;}for(let ri=0;ri<b.rounds.length;ri++){const r=b.rounds[ri];if(b.circuit==='hiit'){for(let ii=0;ii<r.items.length;ii++){phases.push({start:cursor,end:cursor+b.work,label:r.items[ii].label,ri,ii});cursor+=b.work;const rest=b.recovery||0;if(rest&&(ii<r.items.length-1||ri<b.rounds.length-1)){phases.push({start:cursor,end:cursor+rest,label:'Repos',ri,ii});cursor+=rest;}}if(ri<b.rounds.length-1&&r.rest){phases.push({start:cursor,end:cursor+r.rest,label:'Repos entre tours',ri,ii:0});cursor+=r.rest;}}else if(b.type==='emom'){phases.push({start:cursor,end:cursor+(b.interval||60),label:'EMOM '+(ri+1)+'/'+b.rounds.length,ri,ii:0});cursor+=b.interval||60;}}return phases;}
function lfClockStart(bi){const d=db.draft,b=d?.champion?.blocks[bi];if(!b)return;const t=d.lfClock;if(t?.blockId===b.id){change(()=>champToggle(t));return;}if((t?.running||d.champion.timer?.running||d.champion.blocks.some(b=>b.timer?.running))&&!confirm('Remplacer le chrono en cours ?'))return;change(()=>{champPauseClocks();d.restUntil=null;delete d.restPaused;delete d.champion.timer;d.lfClock={blockId:b.id,started:Date.now(),elapsed:0,running:true};});unlockTimerAudio();}
function lfClockStatus(){const d=db.draft,t=d?.lfClock,b=d?.champion?.blocks.find(b=>b.id===t?.blockId);if(!t||!b)return null;const sec=champElapsed(t)/1000;if(b.circuit==='round'&&sec>=(b.countdown||0))return {label:b.title,remaining:sec-(b.countdown||0),phase:'work',ended:false,b,t,elapsed:sec};const phases=lfSchedule(b),end=phases.at(-1)?.end||0;if(!phases.length)return {label:b.title,remaining:sec,phase:'work',ended:false,b,t,elapsed:sec};const phase=phases.find(p=>sec<p.end);return {label:phase?.label||'Terminé',remaining:phase?Math.ceil(phase.end-sec):0,phase:phase?.label==='Repos'?'rest':'work',ended:sec>=end,b,t,elapsed:sec,phaseEnd:phase?.end,ri:phase?.ri};}
function champTimerBar(){const s=lfClockStatus();if(!s||page!=='workout'||db.draft?.restUntil||db.draft?.restPaused!=null){lfOldTimerBar();return;}let el=$('#compact-timer');if(!el){el=document.createElement('aside');el.id='compact-timer';document.body.append(el);}el.hidden=false;document.body.classList.add('has-compact-timer');const signature=s.b.id+s.label+s.t.running+s.ended;if(el.dataset.signature!==signature){el.innerHTML=`<span class="compact-label"></span><strong class="compact-clock" role="timer"></strong><div class="compact-controls">${s.ended?'':btn(s.t.running?'Ⅱ':'▶','lf-clock-toggle','aria-label="Pause ou reprise"','compact-pause')}${btn('Fermer','lf-clock-stop','','compact-extra')}</div>`;el.dataset.signature=signature;}el.querySelector('.compact-label').textContent=s.label;el.querySelector('.compact-clock').textContent=timeFmt(Math.floor(s.remaining));}
function lfTick(){lfCatalogueResultsIfNeeded();const s=lfClockStatus();if(s){if(s.t.running&&s.phaseEnd)champCue('lf'+s.b.id,Math.floor(s.elapsed),s.phaseEnd);const el=document.querySelector('[data-lf-clock-status="'+s.b.id+'"]');if(el)el.textContent=s.label+' · '+timeFmt(Math.floor(s.remaining));if(s.ended&&s.t.running)change(()=>{s.t.elapsed=lfSchedule(s.b).at(-1).end*1000;s.t.running=false;},false);}}
function lfCatalogueResultsIfNeeded(){if($('#lf-catalogue-results')&&!$('#lf-catalogue-results').dataset.ready){$('#lf-catalogue-results').dataset.ready='true';lfCatalogueResults();}}
function lfRender(){lfCatalogueResultsIfNeeded();if(page==='workout'&&db.draft?.champion){document.querySelectorAll('.ch-block').forEach((el,bi)=>{const b=db.draft.champion.blocks[bi];if(!b)return;const toolsAll=el.querySelector('.ch-tools');if(toolsAll)toolsAll.insertAdjacentHTML('beforeend',btn('Retirer le bloc','lf-block-remove',`data-scope="draft" data-bi="${bi}"`,'text-btn danger-text'));const fold=el.querySelector('[data-action="ch-collapse"]');fold?.setAttribute('aria-expanded',String(!b.uiCollapsed));if(b.circuit){el.querySelectorAll('[data-ch-emom]').forEach(x=>x.remove());const tools=el.querySelector('.ch-tools');if(tools){tools.querySelectorAll('[data-action="ch-emom"],[data-action="ch-focus"]').forEach(x=>x.remove());tools.insertAdjacentHTML('beforeend',btn('Chrono '+b.circuit.toUpperCase(),'lf-clock-start',`data-bi="${bi}"`,'btn secondary')+`<p class="muted" data-lf-clock-status="${b.id}"></p>`);}el.querySelectorAll('[data-action="ch-work"]').forEach(x=>x.remove());}el.querySelectorAll('.ch-item').forEach((row,j)=>{const i=b.rounds.flatMap(r=>r.items)[j];if(i?.unit==='reps'){let at=0,ri=0,ii=0;for(let r=0;r<b.rounds.length;r++){if(j<at+b.rounds[r].items.length){ri=r;ii=j-at;break;}at+=b.rounds[r].items.length;}row.insertAdjacentHTML('beforeend',`<details><summary>RPE facultatif</summary><label class="label">RPE<input type="number" min="1" max="10" step="0.5" data-lf-rpe data-bi="${bi}" data-ri="${ri}" data-ii="${ii}" value="${i.rpe??''}"></label></details>`);}if(i?.note){const p=document.createElement('p');p.className='muted ch-small';p.textContent=i.note;row.querySelector('.row')?.after(p);}});});}}
function planDialog(date,id=null){lfOldPlanDialog(date,id);const p=id?db.plan.find(p=>p.id===id):null,f=$('[data-form="plan"]'),wrap=$('#plan-session-wrap');if(!f||!wrap)return;const owner=db.programs.find(p=>p.sessions.some(s=>s.id===db.plan.find(q=>q.id===id)?.sessionId))||currentProgram();wrap.insertAdjacentHTML('afterbegin',`<label class="label" for="lf-plan-program">Programme</label><select id="lf-plan-program"><option value="">Tous les programmes</option>${db.programs.map(p=>`<option value="${p.id}" ${p.id===owner?.id?'selected':''}>${esc(p.name)}${p.archived?' (archivé)':''}</option>`).join('')}</select>`);lfPlanSessions(owner?.id||'',p?.sessionId||'');}
function lfPlanSessions(pid,selected=''){const p=db.programs.find(p=>p.id===pid),ss=p?p.sessions:sessions();$('#plan-session').innerHTML='<option value="">Séance libre</option>'+ss.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('');}
function lfBuilderResume(context,name){const state=context.builder,fields=context.fields;lfBlockDialog(state.scope,state.sid,state.index,state.format);lfBuilder=state;lfBuilder.items.push(lfItem(name,lfMeta(name).mode==='pdc'?'street':'muscu'));const f=$('[data-form="lf-block"]');for(const [key,v]of Object.entries(fields))if(f.elements[key])f.elements[key].value=v;lfBuilderRender();lfBuilderFormat();}
document.addEventListener('input',event=>{if(event.target.hasAttribute('data-lf-rpe')){const x=event.target.dataset;if(event.target.checkValidity())change(()=>db.draft.champion.blocks[Number(x.bi)].rounds[Number(x.ri)].items[Number(x.ii)].rpe=event.target.value===''?null:Number(event.target.value),false);}if(event.target.id==='lf-search'){lfCatalogueQuery=event.target.value;lfCatalogueResults();}if(event.target.closest('[data-lf-item]'))lfReadBuilder();if(event.target.matches('[data-ch-field], [data-input="set"]')){document.querySelectorAll('.lf-volume').forEach(el=>{const temp=document.createElement('div');temp.innerHTML=champTotalsView(db.draft);el.replaceWith(temp.firstElementChild);});}});
document.addEventListener('change',event=>{const f=event.target.closest('[data-form="lf-block"]');if(f&&['count','format'].includes(event.target.name)){lfReadBuilder();lfBuilderRounds();lfBuilderFormat();}if(event.target.id==='lf-plan-program')lfPlanSessions(event.target.value);});
document.addEventListener('click',event=>{const filter=event.target.closest('[data-lf-filter]');if(filter){lfCatalogueFilter=filter.dataset.lfFilter;filter.parentNode.querySelectorAll('button').forEach(x=>{x.className='btn '+(x===filter?'':'secondary');x.setAttribute('aria-pressed',String(x===filter));});lfCatalogueResults();return;}const x=event.target.closest('[data-action]')?.dataset;if(!x)return;const scope=x.scope||'template',sid=x.sid||'',owner=lfOwner(scope,sid),bi=Number(x.bi);
// Capture the old settings actions before their older listeners run.
if(x.action==='ch-edit'||x.action==='ch-config'){event.preventDefault();event.stopImmediatePropagation();lfBlockDialog(x.scope||'draft',sid,bi);return;}
if(x.action==='ch-template-add'){event.preventDefault();event.stopImmediatePropagation();lfChooseExercise({kind:'new-block',scope:'template',sid});return;}
if(!x.action.startsWith('lf-')||x.action.startsWith('lf-program-'))return;event.preventDefault();event.stopImmediatePropagation();
if(x.action==='lf-catalogue-new')lfCatalogEdit('');
else if(x.action==='lf-catalogue-edit')lfCatalogEdit(x.name);
else if(x.action==='lf-pick'){const context=lfPickContext;lfPickContext=null;if(!context)return;if(context.kind==='builder')lfBuilderResume(context,x.name);else lfBlockDialog(context.scope,context.sid,null,'series',x.name);}
else if(x.action==='lf-add-ex')lfChooseExercise({kind:'new-block',scope,sid});
else if(x.action==='lf-add-circuit')lfCircuitDialog(scope,sid);
else if(x.action==='lf-circuit-type')lfBlockDialog(scope,sid,null,x.type);
else if(x.action==='lf-builder-pick'){lfReadBuilder();const f=$('[data-form="lf-block"]');lfChooseExercise({kind:'builder',builder:lfBuilder,fields:Object.fromEntries(new FormData(f))});}
else if(x.action==='lf-builder-remove'){lfReadBuilder();lfBuilder.items.splice(Number(x.index),1);lfBuilder.rounds.forEach(r=>{r.items?.splice(Number(x.index),1);r.targets?.splice(Number(x.index),1);});lfBuilderRender();}
else if(x.action==='lf-edit-block')lfBlockDialog(scope,sid,bi);
else if(x.action==='lf-block-move'&&owner?.champion){const list=owner.champion.blocks,j=bi+Number(x.dir);if(j<0||j>=list.length)return;change(()=>{champBindTimer();[list[bi],list[j]]=[list[j],list[bi]];});}
else if(x.action==='lf-block-remove'&&owner?.champion){if(owner.champion.blocks.length<=1){toast('Garde au moins un bloc.');return;}if(scope==='draft'&&(owner.champion.timer?.blockId===owner.champion.blocks[bi].id||owner.lfClock?.blockId===owner.champion.blocks[bi].id)){toast('Ferme le chrono de ce bloc avant de le retirer.');return;}if(confirm(scope==='draft'?'Retirer ce bloc de cette séance ?':'Retirer ce bloc des prochaines séances ?'))change(()=>owner.champion.blocks.splice(bi,1));}
else if(x.action==='lf-clock-start')lfClockStart(bi);
else if(x.action==='lf-clock-toggle'&&db.draft?.lfClock){unlockTimerAudio();change(()=>champToggle(db.draft.lfClock));}
else if(x.action==='lf-clock-stop'&&db.draft?.lfClock){change(()=>{const t=db.draft.lfClock,b=db.draft.champion.blocks.find(b=>b.id===t.blockId);if(b)b.circuitTime=Math.max(0,Math.round(champElapsed(t)/1000)-(b.countdown||0));delete db.draft.lfClock;});}
},true);
document.addEventListener('submit',event=>{const f=event.target;if(f.dataset.form==='lf-catalogue'){event.preventDefault();if(!f.checkValidity())return;const v=Object.fromEntries(new FormData(f)),name=v.name.trim();if(!name)return;const original=f.dataset.original,existing=db.customExercises?.find(e=>norm(e.name)===norm(original));if(db.customExercises?.some(e=>norm(e.name)===norm(name)&&e!==existing)){toast('Cet exercice est déjà enregistré.');return;}const context=lfPickContext;if(change(()=>{const e=existing||rememberExercise(db,name,v.mode);Object.assign(e,{name,mode:v.mode,muscle:v.muscle,equipment:v.equipment.trim()});},false)){if(context){lfChooseExercise(context);}else{closeModal();goto('catalog');}}return;}
if(f.dataset.form!=='lf-block')return;event.preventDefault();if(!f.checkValidity()){f.reportValidity();return;}lfReadBuilder();const state=lfBuilder,v=Object.fromEntries(new FormData(f)),owner=lfOwner(state.scope,state.sid);if(!owner||!state.items.length){toast('Ajoute au moins un mouvement.');return;}if(!v.title.trim()){toast('Donne un nom au bloc.');return;}const old=state.index===null?null:owner.champion?.blocks[state.index];if(state.index!==null&&JSON.stringify(old)!==state.original){toast('Le bloc a changé. Rouvre ses réglages.');return;}
const type=v.format==='round'?'series':v.format==='hiit'?'interval':v.format==='amrap'?'fortime':v.format;
const b={...(old||{}),id:old?.id||uid(),sourceKey:old?.sourceKey||owner.id+':'+uid(),title:v.title.trim(),note:v.note,type,circuit:['round','hiit','emom','amrap'].includes(v.format)?v.format:null,customized:true,personal:true,interval:Number(v.interval)||60,work:Number(v.work)||30,recovery:Number(v.recovery)||0,duration:(Number(v.duration)||10)*60,countdown:Number(v.countdown),rounds:[]};
for(let ri=0;ri<Number(v.count);ri++){const previous=old?.rounds[ri],settings=state.rounds[ri];const rest=settings?.restOverride!==undefined&&settings.restOverride!==''?Number(settings.restOverride):Number(v.rest);const items=state.items.map((i,ii)=>{const oldItem=previous?.items[ii],label=(settings?.names?.[ii]||i.label).trim(),same=oldItem?.label===label&&oldItem.unit===i.unit&&(oldItem.mode||(oldItem.family==='leg'?'weight':'pdc'))===i.mode;const q={...clone(i),id:same?oldItem.id:uid(),label,family:lfFamily(label),target:settings?.targets?.[ii]||i.target,weight:settings?.weights?.[ii]!==undefined&&settings.weights[ii]!==''?Number(settings.weights[ii]):i.weight,reps:null,seconds:null,done:false,warmup:false};if(state.scope==='draft'&&same){q.reps=oldItem.reps;q.seconds=oldItem.seconds;q.warmup=oldItem.warmup;q.done=oldItem.done&&oldItem.weight===q.weight;}return q;});b.rounds.push({id:previous?.id||uid(),label:previous?.label||((type==='emom'?'Intervalle ':'Tour ')+(ri+1)),rest:type==='emom'?0:rest,items});}
const candidate=clone(db),target=state.scope==='draft'?candidate.draft:candidate.programs.flatMap(p=>p.sessions).find(s=>s.id===state.sid);lfMakeStructured(target);if(state.index===null)target.champion.blocks.push(b);else target.champion.blocks[state.index]=b;
try{validate(candidate);}catch{toast('Vérifie les objectifs, les charges et les durées.');return;}
if(state.scope==='draft'&&old&&(db.draft?.lfClock?.blockId===old.id||db.draft?.champion?.timer?.blockId===old.id)){toast('Ferme le chrono de ce bloc avant de le modifier.');return;}
if(change(()=>{lfMakeStructured(owner);if(state.index===null)owner.champion.blocks.push(b);else owner.champion.blocks[state.index]=b;for(const i of state.items)rememberExercise(db,i.label,i.mode);if(state.scope==='draft')champNormalize(owner);},false)){lfBuilder=null;closeModal();render();}
});
function lfValidate(s){const int=(x,min,max)=>Number.isInteger(x)&&x>=min&&x<=max;for(const e of s?.customExercises||[])if(e.muscle!=null&&!['chest','back','shoulders','arms','legs','abs','other'].includes(e.muscle)||e.equipment!=null&&(typeof e.equipment!=='string'||e.equipment.length>100))throw Error('Métadonnées exercice invalides');for(const owner of [...(s?.programs||[]).flatMap(p=>p.sessions),...(s?.history||[]),...(s?.draft?[s.draft]:[])]){for(const b of owner.champion?.blocks||[]){if(b.circuit!=null&&!['round','hiit','emom','amrap'].includes(b.circuit))throw Error('Circuit invalide');for(const [key,min,max]of [['interval',5,1800],['work',1,3600],['recovery',0,1800],['duration',1,10800],['countdown',0,60]])if(b[key]!=null&&!int(b[key],min,max))throw Error('Durée de circuit invalide');for(const r of b.rounds)for(const i of r.items){if(i.rpe!=null&&(!Number.isFinite(i.rpe)||i.rpe<1||i.rpe>10))throw Error('RPE invalide');if(i.training!=null&&!['muscu','street'].includes(i.training)||i.mode!=null&&!['pdc','weight'].includes(i.mode)||i.note!=null&&typeof i.note!=='string')throw Error('Mouvement invalide');}}if(owner.lfClock){const t=owner.lfClock;if(typeof t.blockId!=='string'||!owner.champion?.blocks.some(b=>b.id===t.blockId)||!Number.isFinite(t.elapsed)||t.elapsed<0||!Number.isFinite(t.started)||typeof t.running!=='boolean')throw Error('Chrono circuit invalide');}}}

function champRest(b,ri){if(['hiit','amrap'].includes(b.circuit))return;lfOldChampRest(b,ri);}
function lfProgramTools(){const p=currentProgram();if(!p)return '';return `<div class="card"><h3>Gérer ce programme</h3><div class="row wrap" style="margin-top:12px">${btn(p.archived?'Réactiver':'Archiver','lf-program-archive',`data-id="${p.id}"`,'btn secondary')}${btn('Refaire depuis le début','lf-program-repeat',`data-id="${p.id}"`,'btn secondary')}</div><p class="muted ch-small">Un nouveau parcours conserve les résultats de l’ancien programme. Aucune donnée passée n’est remise à zéro.</p></div>`;}
document.addEventListener('click',event=>{const x=event.target.closest('[data-action]')?.dataset,p=db.programs.find(p=>p.id===x?.id);if(!p)return;if(x.action==='lf-program-archive'){if(change(()=>{p.archived=!p.archived;if(p.archived&&db.activeProgram===p.id)db.activeProgram=db.programs.find(q=>!q.archived)?.id||p.id;}))toast(p.archived?'Programme archivé. Historique conservé.':'Programme réactivé.');}if(x.action==='lf-program-repeat'){if(!confirm('Créer un nouveau parcours vierge en conservant cet ancien programme et ses résultats ?'))return;change(()=>{const q=clone(p);q.id=uid();q.name=p.name+' · nouveau parcours';q.archived=false;q.originProgramId=p.originProgramId||p.id;const cycleIds=new Map();q.organization?.cycles.forEach(c=>{const old=c.id;c.id=uid();cycleIds.set(old,c.id);});q.sessions.forEach(s=>{s.id=uid();if(s.cycleId)s.cycleId=cycleIds.get(s.cycleId)||null;const groupIds=new Map();s.groups?.forEach(g=>{const old=g.id;g.id=uid();groupIds.set(old,g.id);});s.exercises.forEach(e=>{e.id=uid();if(e.groupId)e.groupId=groupIds.get(e.groupId)||null;e.blocks.forEach(b=>b.id=uid());});s.champion?.blocks.forEach(b=>{b.id=uid();b.timer=null;b.rounds.forEach(r=>{r.id=uid();delete r.time;r.timer=null;r.items.forEach(i=>{i.id=uid();i.reps=null;i.seconds=null;i.done=false;});});});});if(q.champion)q.champion={stage:0,week:1,completed:false};p.archived=true;db.programs.push(q);db.activeProgram=q.id;});}});

function workoutView(){return lfWorkoutExtras(lfOldWorkoutView());}
setInterval(tick,500);
render();
</script>
